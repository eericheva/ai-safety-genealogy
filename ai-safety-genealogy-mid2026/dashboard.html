      +'<table><tr><th>kind</th><th>direction</th><th>grantee</th><th>funder</th><th class="num">amount</th></tr>'
      +(S2.rows||[]).map(r=>{const d=rows.find(x=>x.id===+r.d);
        return `<tr><td class="mut">${name(r.k)}</td><td>${d?d.name:r.d}</td><td>${r.g}</td>`
          +`<td class="mut">${r.f}</td><td class="num">${cnum(r.a)}</td></tr>`;}).join('')+'</table>';})();

  // 2i. the coverage table: which layer touches which direction
  (()=>{const svg=document.getElementById('m3cov'); if(!svg)return; svg.textContent='';
    const L=M.ledger; if(!L||!L.coverage)return;
    const C=L.coverage, LAY=L.layers, W2=1010, L2=250, R2=110;
    const cw=(W2-L2-R2-32)/LAY.length, rowH=17, top=96, H=top+C.length*rowH+14;
    svg.setAttribute('viewBox',`0 0 ${W2} ${H}`);
    LAY.forEach((lab,j)=>{const x=L2+16+cw*(j+.5);
      const e=el('text',{x,y:top-8,class:'axlab',transform:`rotate(-40 ${x} ${top-8})`,'text-anchor':'start'});
      e.textContent=lab.replace('attrib/','').replace('_labeled.csv','').replace('.csv','').slice(0,22);
      svg.appendChild(e);});
    C.forEach((r,i)=>{const y=top+i*rowH, g=el('g',{}); svg.appendChild(g);
      const d=rows.find(x=>x.id===r.id);
      const nm=el('text',{x:L2-12,y:y+12,'text-anchor':'end',class:'trklab'});
      nm.textContent=r.name.length>30?r.name.slice(0,29)+'.':r.name;
      if(d){nm.style.cursor='pointer'; nm.addEventListener('click',()=>toggleD(d.id));}
      g.appendChild(nm);
      LAY.forEach((lab,j)=>{const on=r.layers.indexOf(lab)>=0;
        g.appendChild(el('rect',{x:L2+16+cw*j+1,y:y+3,width:cw-2,height:rowH-6,rx:2,
          fill:on?HEAT(.55):'var(--text-primary)','fill-opacity':on?1:.05}));});
      const vl=el('text',{x:W2-R2+8,y:y+12,class:'mlab'}); vl.textContent=r.n; g.appendChild(vl);
      const hit=el('rect',{x:0,y,width:W2,height:rowH,fill:'transparent'});
      hit.addEventListener('mousemove',ev=>showTip(`<b>${r.name}</b><br>`
        +`<span class="k">${r.n} ${T().m3CovLayers}:</span><br>`
        +r.layers.map(x=>x.replace('attrib/','').replace('_labeled.csv','')).join('<br>'),ev));
      hit.addEventListener('mouseleave',hideTip); g.appendChild(hit);});})();

  // 2h. the two ledgers: pairs held out, and papers ruled out
  (()=>{const L=M.ledgers, t2=T();
    const ty=L.overlap.types.map(x=>`<b>${nnum(x.n)}</b> ${x.k==='same_year'?t2.m3LedSame:t2.m3LedAdj}`).join(', ');
    let h=`<p class="foot"><b>${t2.m3LedOv}:</b> ${nnum(L.overlap.n)} pairs - ${ty}.</p>`
      +'<table style="margin-bottom:14px"><tr><th>Tallinn lists</th><th class="num"></th>'
      +'<th>SFF lists</th><th class="num"></th><th></th></tr>'
      +L.overlap.top.map(p=>`<tr><td>${p.jr} <span class="mut">${p.jy} - ${p.jvia}</span></td>`
        +`<td class="num">${cnum(p.jv)}</td><td>${p.sg} <span class="mut">${p.sr}</span></td>`
        +`<td class="num">${cnum(p.sv)}</td>`
        +`<td class="mut">${p.type==='same_year'?t2.m3LedSame:t2.m3LedAdj}</td></tr>`).join('')
      +'</table>';
    h+=`<p class="foot"><b>${t2.m3LedLab}:</b> ${nnum(L.labels.n)} papers labeled by hand across ${L.labels.rows.length} keys.</p>`
      +'<table><tr><th>key</th><th class="num">'+t2.m3LedOn+'</th><th>'+t2.m3LedOff+'</th></tr>'
      +L.labels.rows.map(r=>{const d=rows.find(x=>x.id===r.id);
        return `<tr><td class="name">${d?d.name:r.id}<br><span class="mut">"${r.phrase}"</span></td>`
          +`<td class="num">${r.on}/${r.n}</td><td>`
          +(r.worst.length?r.worst.map(w=>`<span class="lw"><span class="mut">${w.c} cit</span> ${w.t}`
              +`<i>${w.why}</i></span>`).join('')
            :'<span class="mut">-</span>')+'</td></tr>';}).join('')
      +'</table>';
    document.getElementById('m3led').innerHTML=h;})();

  // 3. how firm the count is
  (()=>{const c=M.corpus;
    document.getElementById('m3corpus').innerHTML=
      `<p class="foot"><b>${nnum(c.sumOfCounts)}</b> ${t.m3Counted} &nbsp;-&nbsp; <b>${nnum(c.distinct)}</b> ${t.m3Distinct}`
      +` &nbsp;-&nbsp; <b>${nnum(c.inMoreThanOne)}</b> ${t.m3Twice}.<br>`
      +`<span class="k">${t.m3Drift}:</span> `
      +c.drift.slice(0,6).map(d=>{const r=rows.find(x=>x.id===d.id);
        return `${r?r.name:d.id} <b>${d.pct>0?'+':''}${d.pct}%</b>`;}).join(', ')+'.</p>';})();

  // 4. what survives the page it was read from
  (()=>{const a=M.archive;
    document.getElementById('m3arch').innerHTML=
      `<p class="foot"><b>${a.ok}</b> ${t.m3Archived} &nbsp;-&nbsp; <b>${a.n-a.ok}</b> ${t.m3NotArchived}:<br>`
      +a.missing.map(m=>`<span class="k">${m.url.replace(/^https?:\/\//,'').slice(0,72)}</span> - ${m.why}`).join('<br>')
      +'</p>';})();
}

// ---- the decade behind the slice: what a paper and a citation cost, year by year.
// Money is a range here for the same reason it is a range in the money column: the registry
// records a grant whole in the year it was announced, and spreading it over its published term
// is as defensible a reading. Neither bounds the other, so the bar carries both and the tick
// carries the one the figures are quoted from.
// a hue of its own for the price of a citation, stepped by the theme like every tag colour
const COSTV='oklch(from hsl(285 62% 50%) calc(var(--tl) + .04) c h / 1)';
const CX=i=>{const C=costByYear.rows;return 74+(1010-74-30)*(i+0.5)/C.length;};
const cnum=(v,d)=>v>=1e6?'$'+(v/1e6).toFixed(d===undefined?1:d)+'M':(v>=1e3?'$'+Math.round(v/1e3)+'k':'$'+Math.round(v));
const cint=v=>(''+Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function drawCost(){
  const svg=document.getElementById('cost'), t=T(), C=costByYear.rows, ix=n=>costByYear.cols.indexOf(n);
  const W=1010,rowH=96,pad=30,H=(rowH+pad)*4+22;
  svg.textContent=''; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('aria-label',t.hCost);
  const ROWS=[
    {lo:'moneyLo',hi:'moneyHi',at:'moneyAt',lab:t.cRowMoney,col:'var(--d-blue)',bar:1,fmt:v=>cnum(v,v>=1e8?0:1)},
    {at:'papers',lab:t.cRowPapers,col:'var(--warn)',bar:1,fmt:cint},
    {lo:'paperLo',hi:'paperHi',at:'paperAt',lab:t.cRowPPaper,col:'var(--good)',fmt:v=>cnum(v)},
    {lo:'citeLo',hi:'citeHi',at:'citeAt',lab:t.cRowPCite,col:COSTV,fmt:v=>cnum(v),hollow:1},
  ];
  const geo=[];
  ROWS.forEach((r,ri)=>{
    const top=(rowH+pad)*ri+(r.bar?0:12), base=top+rowH;
    const at=C.map(row=>row[ix(r.at)]), lo=r.lo?C.map(row=>row[ix(r.lo)]):null, hi=r.hi?C.map(row=>row[ix(r.hi)]):null;
    const tops=C.map((_,i)=>Math.max(at[i]||0, hi?hi[i]||0:0));
    const lab=el('text',{x:0,y:top+11,class:'axtitle'}); lab.textContent=r.lab;
    lab.style.fill=r.col; svg.appendChild(lab);
    svg.appendChild(el('line',{x1:74,y1:base,x2:W-30,y2:base,stroke:'var(--axis)','stroke-width':1}));
    let Y;
    if(r.bar){
      const mx=Math.max(...tops), h=v=>(rowH-24)*v/mx, bw=Math.min(30,(W-104)/C.length*0.56);
      Y=v=>base-h(v);
      C.forEach((row,i)=>{
        const dim=row[0]===costByYear.partial?0.42:1, x=CX(i);
        if(lo&&lo[i]>0)svg.appendChild(el('rect',{x:x-bw/2,y:base-h(lo[i]),width:bw,height:h(lo[i]),rx:3,fill:r.col,opacity:dim}));
        if(hi&&hi[i]>(lo?lo[i]:0))svg.appendChild(el('rect',{x:x-bw/2,y:base-h(hi[i]),width:bw,height:h(hi[i])-h(lo?lo[i]:0),rx:3,
          fill:r.col,'fill-opacity':.24*dim,stroke:r.col,'stroke-opacity':.5*dim,'stroke-width':1}));
        if(!lo&&at[i]>0)svg.appendChild(el('rect',{x:x-bw/2,y:base-h(at[i]),width:bw,height:h(at[i]),rx:3,fill:r.col,opacity:dim}));
        if(lo&&at[i]>0)svg.appendChild(el('line',{x1:x-bw/2-2.5,y1:base-h(at[i]),x2:x+bw/2+2.5,y2:base-h(at[i]),
          stroke:r.col,'stroke-width':2,opacity:dim}));});
    }else{
      const all=[]; C.forEach((_,i)=>{[at[i],lo&&lo[i],hi&&hi[i]].forEach(v=>{if(v>0)all.push(v);});});
      const mn=Math.min(...all), mxv=Math.max(...all), lg=Math.log10;
      Y=v=>top+26+(rowH-44)*(1-(lg(v)-lg(mn))/Math.max(lg(mxv)-lg(mn),1e-9));
      for(let e=Math.floor(lg(mn));e<=Math.ceil(lg(mxv));e++)for(const k of[1,3]){
        const v=k*Math.pow(10,e); if(v<mn*0.95||v>mxv*1.05)continue;
        svg.appendChild(el('line',{x1:74,y1:Y(v),x2:W-30,y2:Y(v),stroke:'var(--grid)','stroke-width':1}));
        const g=el('text',{x:66,y:Y(v)+3.5,'text-anchor':'end',class:'axlab'});g.textContent=r.fmt(v);svg.appendChild(g);}
      // the band between the two readings, broken wherever a year has no money at all
      let seg=[];
      const flush=()=>{ if(seg.length>1)svg.appendChild(el('polygon',{fill:r.col,'fill-opacity':.16,
          points:seg.map(p=>`${p.x},${Y(p.hi)}`).join(' ')+' '+seg.slice().reverse().map(p=>`${p.x},${Y(p.lo)}`).join(' ')}));
        seg.forEach(p=>{if(Y(p.lo)-Y(p.hi)>1.5)svg.appendChild(el('line',{x1:p.x,y1:Y(p.hi),x2:p.x,y2:Y(p.lo),
          stroke:r.col,'stroke-width':1.4,'stroke-opacity':.5}));}); seg=[];};
      C.forEach((row,i)=>{ if(lo&&lo[i]>0&&hi[i]>0){ if(seg.length&&seg[seg.length-1].i!==i-1)flush(); seg.push({i,x:CX(i),lo:lo[i],hi:hi[i]});} else flush();});
      flush();
      let prev=null;
      C.forEach((row,i)=>{ if(!(at[i]>0))return;
        const x=CX(i), y=Y(at[i]), hol=r.hollow&&row[0]>=costByYear.hollowFrom;
        if(prev)svg.appendChild(el('line',{x1:prev.x,y1:prev.y,x2:x,y2:y,stroke:r.col,'stroke-width':2,
          ...(hol||prev.h?{'stroke-dasharray':'4 4'}:{})}));
        prev={x,y,h:hol};});
      C.forEach((row,i)=>{ if(!(at[i]>0))return;
        const x=CX(i), y=Y(at[i]);
        svg.appendChild(r.hollow&&row[0]>=costByYear.hollowFrom
          ?el('circle',{cx:x,cy:y,r:4.6,fill:'var(--surface-1)',stroke:r.col,'stroke-width':2})
          :el('circle',{cx:x,cy:y,r:4.6,fill:r.col}));});
    }
    // the extremes and the last year, written out; a range prints as a range
    const idx=[], vals=r.bar?tops:at.map(v=>v||0);
    const nz=vals.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
    if(nz.length){idx.push(nz.reduce((a,i)=>vals[i]>vals[a]?i:a,nz[0]),nz.reduce((a,i)=>vals[i]<vals[a]?i:a,nz[0]),nz[nz.length-1]);}
    [...new Set(idx)].forEach(i=>{
      const s=(lo&&hi&&r.fmt(lo[i])!==r.fmt(hi[i]))?r.fmt(lo[i])+'-'+r.fmt(hi[i]):r.fmt(vals[i]);
      const e=el('text',{x:CX(i),y:(r.bar?base-((rowH-24)*vals[i]/Math.max(...tops)):Y(vals[i]))-8,
        'text-anchor':'middle',class:'axlab'});
      e.textContent=s; svg.appendChild(e);});
    C.forEach((row,i)=>{ if(row[0]%2===0){
      const e=el('text',{x:CX(i),y:base+15,'text-anchor':'middle',class:'axlab'});e.textContent=row[0];svg.appendChild(e);}});
    geo.push({r,at,lo,hi});
  });
  const hb=el('rect',{x:74,y:0,width:W-104,height:H-16,fill:'transparent'});
  const vl=el('line',{y1:0,y2:H-16,stroke:'var(--axis)','stroke-width':1,opacity:0});
  svg.appendChild(vl); svg.appendChild(hb);
  hb.addEventListener('mousemove',ev=>{
    const bb=svg.getBoundingClientRect(), fx=(ev.clientX-bb.left)/bb.width*W;
    const i=Math.min(C.length-1,Math.max(0,Math.floor((fx-74)/((W-104)/C.length))));
    const x=CX(i); vl.setAttribute('x1',x); vl.setAttribute('x2',x); vl.setAttribute('opacity',1);
    const t2=T();
    let html=`<b>${C[i][0]}</b>`+(C[i][0]===costByYear.partial?` <span class="k">${t2.cPartial}</span>`:'');
    geo.forEach(g=>{const v=g.at[i], lo=g.lo&&g.lo[i], hi=g.hi&&g.hi[i];
      if(!(v>0)&&!(hi>0))return;
      const wide=lo>0&&hi>0&&g.r.fmt(lo)!==g.r.fmt(hi);
      html+=`<br><i class="dot" style="width:8px;height:8px;background:${g.r.col}"></i> <span class="k">${g.r.lab}:</span> `
        +(wide?`<b>${g.r.fmt(lo)} - ${g.r.fmt(hi)}</b>`+(v>0?` <span class="k">(${t2.cKAnnounced} ${g.r.fmt(v)})</span>`:'')
              :`<b>${g.r.fmt(v||hi)}</b>`);});
    showTip(html,ev);});
  hb.addEventListener('mouseleave',()=>{vl.setAttribute('opacity',0);hideTip();});
  const mu='var(--muted)';
  document.getElementById('leg-cost').innerHTML=ROWS.map(r=>
    `<span><i class="dot" style="background:${r.col}"></i>${r.lab}</span>`).join('')
    +`<span><svg width="30" height="14" style="width:30px;height:14px;flex:none"><rect x="6" y="4" width="18" height="8" rx="3" fill="${mu}" fill-opacity=".26" stroke="${mu}" stroke-opacity=".55"/><line x1="4" y1="7" x2="26" y2="7" stroke="${mu}" stroke-width="2"/></svg>${T().cTickLab}</span>`
    +`<span><i class="dot" style="background:transparent;border:2px solid ${mu}"></i>${T().cHollowLab}</span>`;
}
function redraw(){drawBar();drawDirBar();drawTracks();drawByTag();renderTasks();render();render2();drawCost();drawCDirChips();drawCDir();drawCoh();drawTrk();drawM2();drawM3();if(view)drawTable(view);}

// ---- views: the page shows its charts, or one table, and the button on a card opens its own.
// A table is the same data the chart drew, sortable, which is what a table is for.
const CHART_CARDS=['tags','c1','cdir','coh','trk','cost','c2','tk','t1','t2'];
let view=null;
function cardOf(id){const h=document.getElementById('h-'+id); return h?h.closest('.card'):null;}
function showView(v){
  view=v;
  if(!v){document.body.removeAttribute('data-view');
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));
    document.querySelectorAll('.card[data-table]').forEach(c=>c.classList.remove('on'));
    return;}
  document.body.setAttribute('data-view',v);
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));
  const tc=document.querySelector(`.card[data-table="${v}"]`);
  if(tc)tc.classList.add('on');
  drawTable(v);
  scrollTo({top:0,behavior:'smooth'});
}
const TBL_OF={c1:'t1',c2:'t2',tags:'t1',tk:'t1'};   // the ladders and the chips read the old tables
function addTableButtons(){
  const t=T();
  CHART_CARDS.forEach(id=>{
    const c=cardOf(id); if(!c||c.querySelector('.tbtn'))return;
    if(id==='t1'||id==='t2')return;                  // those cards are tables already
    const b=document.createElement('button');
    b.className='tbtn'; b.textContent=t.btnTable+' \u229E';
    b.onclick=()=>showView(TBL_OF[id]||id);
    c.querySelector('h2').appendChild(b);});
  document.querySelectorAll('[data-back]').forEach(b=>{b.textContent='\u2190 '+t.btnBack; b.onclick=()=>showView(null);});
}
// --- a small sortable table renderer, one config per view
const TBLS={
  cdir:{el:'tbl-cdir',head:()=>{const t=T();
      return ['direction','tags',t.cdPaid,t.cdAwarded,t.cdPromised,t.cdPaper,t.cdCite,'papers','citations'];},
    rows:()=>rows.filter(r=>moneyByDir.rows[r.id]).map(r=>{const c=moneyByDir.rows[r.id], m=cdMoneyOf(c);
      const pp=(cdUnit+'Paper'), pc=(cdUnit+'Cite');
      return {name:r.name, r, v:[r.name, r.tags.map(i=>tagShort[i]).join(' '), m[0], m[1], m[2],
        (c[pp]||[])[2]||0, (c[pc]||[])[2]||0, cdUnit==='a'?c.pace:c.papers, c.cites||0],
        fmt:[null,null,cdFmtM,cdFmtM,cdFmtM,cdFmtC,cdFmtC,nnum,nnum]};})},
  coh:{el:'tbl-coh',head:()=>['year','papers','citations','maturity','registry $','directions $','plus infrastructure $',
      'per paper (registry)','per paper (directions)','per paper (plus infra)',
      'per citation (registry)','per citation (directions)','per citation (plus infra)'],
    rows:()=>moneyByDir.cohort.map(c=>({name:''+c.year, v:[c.year,c.papers,c.cites,T()['coh'+c.maturity[0].toUpperCase()+c.maturity.slice(1)],
        ...c.layers.map(L=>L.usd), ...c.layers.map(L=>L.paper), ...c.layers.map(L=>L.cite)],
      fmt:[null,nnum,nnum,null,cdFmtM,cdFmtM,cdFmtM,cdFmtC,cdFmtC,cdFmtC,cdFmtC,cdFmtC,cdFmtC]}))},
  trk:{el:'tbl-trk',head:()=>{const ys=[...new Set(rows.flatMap(r=>Object.keys((moneyByDir.rows[r.id]||{}).byYear||{})))]
      .map(Number).sort(); return ['direction','tags',...ys.map(String)];},
    rows:()=>{const ys=[...new Set(rows.flatMap(r=>Object.keys((moneyByDir.rows[r.id]||{}).byYear||{})))]
        .map(Number).sort();
      return rows.filter(r=>moneyByDir.rows[r.id]&&Object.keys(moneyByDir.rows[r.id].byYear||{}).length)
        .map(r=>{const c=moneyByDir.rows[r.id];
          return {name:r.name, r, v:[r.name, r.tags.map(i=>tagShort[i]).join(' '), ...ys.map(y=>(c.byYear||{})[y]*1e6||0)],
            fmt:[null,null,...ys.map(()=>cdFmtM)]};});}},
  cost:{el:'tbl-cost',head:()=>['year','money low','money high','as recorded','papers','citations',
      '$/paper low','$/paper high','$/citation low','$/citation high'],
    rows:()=>costByYear.rows.map(r=>{const g=n=>r[costByYear.cols.indexOf(n)];
      return {name:''+g('year'), v:[g('year'),g('moneyLo'),g('moneyHi'),g('moneyAt'),g('papers'),g('cites'),
        g('paperLo'),g('paperHi'),g('citeLo'),g('citeHi')],
        fmt:[null,cdFmtM,cdFmtM,cdFmtM,nnum,nnum,cdFmtC,cdFmtC,cdFmtC,cdFmtC]};})},
};
let tSortK=0, tSortD=1, tSortView=null;
function drawTable(v){
  if(v==='t1'){render();return;} if(v==='t2'){render2();return;}
  const cfg=TBLS[v]; if(!cfg)return;
  const el2=document.getElementById(cfg.el); if(!el2)return;
  const cols=cfg.head(), data=cfg.rows();
  if(tSortView!==v){tSortView=v; tSortK=0; tSortD=1;}
  data.sort((a,b)=>{const x=a.v[tSortK], y=b.v[tSortK];
    return (typeof x==='string'?(''+x).localeCompare(''+y):(x-y))*tSortD;});
  const num=i=>i>0&&typeof (data[0]||{v:[]}).v[i]==='number';
  el2.innerHTML='<tr>'+cols.map((c,i)=>`<th class="${num(i)?'num':''}" data-i="${i}">${c}`
      +`${tSortK===i?(tSortD<0?' \u2193':' \u2191'):''}</th>`).join('')+'</tr>'
    +data.map(d=>'<tr>'+d.v.map((x,i)=>{const f=d.fmt[i];
        const txt=f?(x?f(x):'<span class="mk">-</span>'):x;
        return `<td class="${num(i)?'num':''}">${txt}</td>`;}).join('')+'</tr>').join('');
  el2.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const i=+th.dataset.i; if(tSortK===i)tSortD*=-1;else{tSortK=i;tSortD=i===0?1:-1;}
    drawTable(v);});
  const t=T();
  const hid={cdir:'hCDir',coh:'hCoh',trk:'hTrk',cost:'hCost'}[v];
  const h=document.getElementById('h-tbl'+v); if(h)h.textContent=t.tblOf+': '+t[hid];
}

// ---- static text
function paint(){
  const t=T();
  document.title=t.title;
  const put=(id,v)=>document.getElementById(id).innerHTML=v;
  put('h1',t.h1); put('sub',t.sub);
  put('h-tags',t.hTags); put('s-tags',t.sTags); put('s-dirs',t.sDirs);
  put('h-tk',t.hTk);
  put('h-c1',t.hC1); put('h-c2',t.hC2);
  put('h-t1',t.hT1); put('h-t2',t.hT2); put('foot',t.foot);
  put('h-cost',t.hCost);
  put('h-cdir',t.hCDir);
  put('s-cdwhat',t.cdWhat); put('s-cdunit',t.cdUnit);
  put('s-cdsrc',t.cdSrc); put('s-cdden',t.cdDen);
  put('h-coh',t.hCoh); put('s-cohwhat',t.cohWhat);
  put('h-trk',t.hTrk);
  put('s-trkwhat',t.trkWhat); put('s-trkgroup',t.trkGroup); put('s-trkscale',t.trkScale);
  put('s-trklayout',t.trkLayout);
  document.getElementById('bubble').setAttribute('aria-label',t.hC1);
  document.getElementById('bytag').setAttribute('aria-label',t.hC2);
  document.getElementById('tgl').textContent=t.theme+': '+[t.tDark,t.tLight,t.tAuto][mode];

  const tot=rows.reduce((a,b)=>a+b.papers,0);
  const exp=rows.filter(r=>r.trend==="surge").length;
  const fast=[...rows].filter(r=>r.papers>=12).sort((a,b)=>b.grow-a.grow)[0];
  const tiles=[[rows.length,t.tiles[0]],[nnum(tot),t.tiles[1]],[exp,t.tiles[2]],
    [fast.name,t.tiles[3]+' (x'+fast.grow.toFixed(1)+')']];
  document.getElementById('tiles').innerHTML=tiles.map(x=>
    `<div class="tile"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
  legend('leg'); legend('leg2');
  redraw();
}

// ---- toggles: dark theme by default
let mode=0;
const applyTheme=()=>{const root=document.documentElement;
  if(mode===2)root.removeAttribute('data-theme');
  else root.setAttribute('data-theme',mode===0?'dark':'light');};
document.getElementById('tgl').onclick=()=>{mode=(mode+1)%3;applyTheme();
  document.getElementById('tgl').textContent=T().theme+': '+[T().tDark,T().tLight,T().tAuto][mode];};

applyTheme();
paint();
addTableButtons();
document.querySelectorAll('.scopenote').forEach(p=>p.textContent=T().scopeNote);
showView(null);
</script>
</body>
</html>
