<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Safety Genealogy: Mid-2026 - demand metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* CHANGED 2026-11-11: the Mrs Wallbreaker site brand, dark only; this project's accent is green #7ad13a.
     --s-blue keeps its name as the single-series / chrome accent; --d-blue is the blue that one
     category of a multi-colour legend has always been, so those legends keep their colours. */
  .viz{
    color-scheme: dark;
    --surface-1:#171513; --plane:#0c0b0a; --panel:#11100e;
    --text-primary:#efeae2; --text-secondary:#cfc8bd; --muted:#9a948b;
    --grid:#26231f; --axis:#4a4540; --border:#2e2b28;
    --s-blue:#7ad13a; --s-blue-soft:#3d6a1d; --d-blue:#3987e5;
    --good:#0ca30c; --warn:#fab219; --cool:#5598e7;
    /* Lightness of a tag colour (--tl) on the oklch scale, and the ink that sits on such a fill. */
    --tl:0.79; --tl-fg:#0d0d0d; --on-fill:#0d0d0d;
    --font-display:'Unbounded', sans-serif; --font-text:'Onest', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  /* Paper keeps the light palette, so the sheet does not depend on whether the reader enabled background graphics. */
  @media print{
    .viz{
      color-scheme: light;
      --surface-1:#fcfcfb; --plane:#f9f9f7;
      --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#6b6a66;
      --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
      --s-blue:#2470cc; --s-blue-soft:#9ec5f4; --d-blue:#2470cc;
      --tl:0.43; --tl-fg:#fff;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:#0c0b0a}
  @media print{ html{background:#f9f9f7} }
  .viz{background:var(--plane); color:var(--text-primary); border-top:4px solid var(--s-blue);
    font-family:var(--font-text); padding:24px; min-height:100vh;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--s-blue); outline-offset:2px;}
  .wrap{max-width:1180px; margin:0 auto;}
  @media (max-width:820px){
    .viz{padding:12px}
    .card svg, .panel svg{min-width:760px}
    .card:has(svg), .panel:has(svg){overflow-x:auto}
  }
  h1{font:700 24px/1.2 var(--font-display); letter-spacing:-.01em; margin:0 0 8px;}
  .sub{color:var(--text-secondary); font-size:13px; margin:0 0 18px; max-width:820px; line-height:1.5;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  /* CHANGED 2026-11-11: the site has one theme, so the theme switch is not shown */
  .btns{display:none;}
  .toggle{border:1px solid var(--border); background:var(--surface-1); color:var(--text-secondary);
    border-radius:0; padding:6px 12px; font:700 12px var(--font-mono); text-transform:uppercase; letter-spacing:.1em; cursor:pointer; white-space:nowrap;}
  .toggle:hover{border-color:var(--s-blue); color:var(--text-primary);}
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:8px 0 22px;}
  .tile{background:var(--surface-1); border:1px solid var(--border); border-radius:0; padding:14px 16px;}
  .tile .n{font:700 26px/1.1 var(--font-display); letter-spacing:-.01em;}
  .tile .l{font-size:12px; color:var(--text-secondary); margin-top:6px;}
  .card{background:var(--panel); border:1px solid var(--grid); border-radius:0; padding:18px 18px 14px; margin-bottom:20px;}
  .card h2{font:700 16px/1.3 var(--font-display); letter-spacing:-.01em; margin:0 0 6px;}
  .card p.note{font-size:12px; color:var(--text-secondary); margin:0 0 12px; line-height:1.5;}
  .sect{font:700 11px var(--font-mono); text-transform:uppercase; color:var(--s-blue); margin:14px 0 7px; letter-spacing:.14em;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary); margin:6px 0 4px;}
  .legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
  #m3led table td, #m3sched table td, #m3skip3 table td{vertical-align:top;}
  .lw{display:block; line-height:1.5; margin-bottom:5px;}
  .lw i{display:block; font-style:normal; color:var(--muted); margin-left:14px;}
  #m3sched table td:last-child{max-width:520px;}
  .floors{margin:6px 0 4px; padding-left:22px; color:var(--text-secondary); font-size:12px; line-height:1.6;}
  .floors b{color:var(--text-primary); font-weight:600;}
  p.note.op{margin:0 0 8px;}
  .legend span.op{white-space:normal; display:block; flex-basis:100%; line-height:1.5; margin-top:2px;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block;}
  svg{display:block; width:100%; height:auto; overflow:visible;}
  text{font-family:inherit;}
  .axlab{fill:var(--muted); font-size:11px; font-family:var(--font-mono);}
  .axtitle{fill:var(--text-secondary); font-size:12px; font-weight:550;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--grid);}
  th{color:var(--text-secondary); font-weight:600; font-size:11.5px; cursor:pointer; user-select:none; white-space:nowrap;}
  th.num,td.num{text-align:right; font-variant-numeric:tabular-nums;}
  td.num{font-family:var(--font-mono); font-size:12px;}
  td.name{max-width:230px;}
  tr.grp td{background:var(--plane); font-weight:650; font-size:12px; padding:9px 8px 7px;}
  tr.grp .gd{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:-1px;}
  tr.grp .gc{color:var(--muted); font-weight:500; margin-left:7px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:0; font-size:11px; font-weight:600; white-space:nowrap;}
  .spark{display:inline-flex; align-items:flex-end; gap:3px; height:22px;}
  .spark i{width:7px; background:var(--s-blue-soft); border-radius:0; display:inline-block;}
  .spark i.last{background:var(--s-blue);}
  .trklab{fill:var(--text-secondary); font-size:11px;}
  .mlab{fill:var(--s-blue); font-size:10.5px; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .bandhead{fill:var(--text-primary); font-size:11.5px; font-weight:650;}
  .card h2{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .tbtn{margin-left:auto; border:1px solid var(--border); background:transparent; color:var(--text-secondary);
    border-radius:0; padding:4px 10px; font:700 11px var(--font-mono); text-transform:uppercase; letter-spacing:.1em; cursor:pointer;
    white-space:nowrap; flex:none;}
  .tbtn:hover{border-color:var(--s-blue); color:var(--text-primary);}
  .backbar{display:flex; align-items:center; gap:12px; margin:0 0 14px;}
  /* a view is a page inside the page: the charts, or one table. Print ignores it and shows everything. */
  body:not([data-view]) .card[data-table]{display:none;}
  body[data-view] .card{display:none;}
  body[data-view] .card.on{display:block;}
  @media print{ body[data-view] .card{display:block;} .tbtn,.backbar{display:none;} }
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{border:1px solid var(--border); background:transparent; color:var(--text-secondary);
    border-radius:0; padding:4px 11px; font-size:12px; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:6px; transition:background .1s,color .1s,border-color .1s;}
  .chip:hover{border-color:var(--c);}
  .chip i.cd{width:8px; height:8px; border-radius:50%; background:var(--c); flex:none;}
  .chip b{font:600 11px var(--font-mono); opacity:.65;}
  .chip.on{background:var(--c); border-color:var(--c); color:var(--tl-fg);}
  .chip.on i.cd{background:var(--tl-fg);}
  .chip.on b{opacity:.8;}
  .chip.sm{font-size:11px; padding:3px 9px;}
  .chip.reset{border-style:dashed; --c:var(--muted);}
  td.tags{max-width:250px;}
  .tg{display:inline-block; font-size:10.5px; color:var(--c); background:var(--cb);
    border:1px solid transparent; border-radius:0; padding:1px 7px; margin:1px 3px 1px 0; cursor:pointer; white-space:nowrap;}
  .tg.on{background:var(--c); color:var(--tl-fg);}
  .tglab{font-size:11px;}
  .fund{cursor:help; border-bottom:1px dotted var(--axis); color:var(--s-blue);
    font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; font-size:11.5px;}
  .cite{cursor:help; border-bottom:1px dotted var(--axis);}
  .ii{color:var(--s-blue); font-weight:600;}
  tr.dim{opacity:.33;}
  .mk{color:var(--muted); font-size:11px; margin-left:3px; cursor:help;}
  .mut{color:var(--muted);}
  .foot{font-size:11.5px; color:var(--text-secondary); line-height:1.6; margin-top:6px;}
  .tkgrp{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:650; margin:18px 0 9px;}
  .tkgrp:first-child{margin-top:4px;}
  .tkgrp .gd{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
  .tkgrp .gc{color:var(--muted); font-weight:500;}
  .xb{margin-left:auto; border:1px solid var(--border); background:transparent; color:var(--muted);
    border-radius:0; padding:2px 9px; font:700 10.5px var(--font-mono); text-transform:uppercase; letter-spacing:.08em; cursor:pointer;}
  .xb:hover{border-color:var(--s-blue); color:var(--text-primary);}
  .qs{border:1px solid var(--border); border-radius:0; padding:10px 14px; margin:0 0 12px; background:var(--plane);}
  .qs summary{font-size:12px; font-weight:650; cursor:pointer; color:var(--text-secondary);}
  .qs summary:hover{color:var(--s-blue);}
  .qs .lead{font-size:12.5px; margin:10px 0 0; line-height:1.5;}
  .qs h5{font:700 11px var(--font-mono); text-transform:uppercase; letter-spacing:.14em; color:var(--s-blue); margin:14px 0 4px;}
  .qs p{font-size:12px; color:var(--text-secondary); line-height:1.55; margin:0;}
  .qs ul{margin:3px 0 0; padding-left:18px;}
  .qs li{font-size:12px; color:var(--text-secondary); line-height:1.5; margin-bottom:3px;}
  /* footnote on a claim: the address where the quote was checked by machine */
  .sl{font-size:9px; margin-left:3px; vertical-align:super; line-height:0;}
  .sl a{color:var(--s-blue); text-decoration:none; border-bottom:0;}
  .sl a:hover{color:var(--text-primary);}
  .qs p.srcs{font-size:11.5px; color:var(--muted); margin:5px 0 0;}
  .qs p.srcs a{color:var(--s-blue); text-decoration:none; border-bottom:1px solid var(--s-blue-soft);}
  .qs p.srcs a:hover{color:var(--text-primary);}
  .qs .mny{font-size:12px; color:var(--text-secondary); line-height:1.55; margin:0;}
  .tkl{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px;}
  .tk{border:1px solid var(--border); border-radius:0; padding:12px 13px; background:var(--plane);}
  .tk h4{font-size:13px; font-weight:650; line-height:1.35; margin:0 0 6px;}
  .tk h4 a{color:var(--text-primary); text-decoration:none; border-bottom:1px solid var(--s-blue-soft);}
  .tk h4 a:hover{color:var(--s-blue);}
  .tk p{font-size:12px; color:var(--text-secondary); line-height:1.5; margin:0 0 10px;}
  .tk dl{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:0; font-size:11.5px;}
  .tk dt{color:var(--muted); white-space:nowrap; font-family:var(--font-mono); font-size:11px;}
  .tk dd{margin:0;}
  .tk dd.no{color:var(--muted);}
  .tk .tg{cursor:default;}
  /* a date is not a state, so it is not a colored pill: it reads as the rest of the card does */
  .st{cursor:help; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .tkhint{font-size:12.5px; color:var(--muted); padding:6px 0 4px;}
  .dl{cursor:pointer; border-bottom:1px dashed var(--s-blue-soft);}
.dl:hover{color:var(--s-blue);}
.dl.on{color:var(--s-blue); font-weight:650;}
.tip .op{color:var(--s-blue);}
.tip{position:fixed; line-height:1.45; pointer-events:none; background:var(--surface-1); border:1px solid var(--border);
    border-radius:0; padding:9px 11px; font-size:12px; color:var(--text-primary);
    box-shadow:0 6px 20px rgba(0,0,0,.5); opacity:0; transition:opacity .08s; z-index:50;
    max-width:min(290px, calc(100vw - 24px));}
  .tip b{font-weight:650;} .tip .k{color:var(--text-secondary);}
  /* The fourth tile holds a direction's name, not a number: on a narrow screen the large type breaks it over three lines. */
  @media(max-width:720px){.tiles{grid-template-columns:repeat(2,1fr);} .tile .n{font-size:19px;} td.name{max-width:150px;}}
  /* Buttons and the tooltip do nothing on paper, and a row must not break across sheets. */
  @media print{ .btns, .tip{display:none;} tr, .tk, .qs, .tile{break-inside:avoid;} }
</style>
</head>
<body>
<div class="viz">
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="btns">
      <button class="toggle" id="tgl"></button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>


  <div class="card">
    <h2 id="h-tags"></h2>
    <div class="sect" id="s-tags"></div>
    <div class="chips" id="tagbar"></div>
    <div class="sect" id="s-dirs"></div>
    <div class="chips" id="dirbar"></div>
  </div>

  <div class="card">
    <h2 id="h-c1"></h2>
    <div id="leg"></div>
    <svg id="bubble" role="img"></svg>
  </div>

  <!-- One number per row was always three: the re-check gave every money record a status,
       and a status is what the money column could never show. -->
  <div class="card">
    <h2 id="h-cdir"></h2>
    <div class="legend" id="leg-cdir"></div>
    <div class="sect" id="s-cdsrc"></div>
    <div class="chips" id="cd-src"></div>
    <div class="sect" id="s-cdwhat"></div>
    <div class="chips" id="cd-what"></div>
    <div class="sect" id="s-cdunit"></div>
    <div class="chips" id="cd-unit"></div>
    <div class="sect" id="s-cdden"></div>
    <div class="chips" id="cd-den"></div>
    <svg id="cdir" role="img"></svg>
    <p class="note op scopenote"></p>
    <p class="note" id="cd-rest"></p>
  </div>

  <!-- Three cohorts, and only one of them has a price. The rows are never joined by a line:
       what moves the citation column is the age of the cohort, and a line would claim otherwise. -->
  <div class="card">
    <h2 id="h-coh"></h2>
    <div class="sect" id="s-cohwhat"></div>
    <div class="chips" id="coh-what"></div>
    <svg id="coh" role="img"></svg>
    <p class="note op scopenote"></p>
  </div>

  <!-- Money by year gives a direction a track, and the year's own papers give it a price. -->
  <div class="card">
    <h2 id="h-trk"></h2>
    <div class="sect" id="s-trkwhat"></div>
    <div class="chips" id="trk-what"></div>
    <div class="sect" id="s-trkgroup"></div>
    <div class="chips" id="trk-group"></div>
    <div class="sect" id="s-trklayout"></div>
    <div class="chips" id="trk-layout"></div>
    <div class="sect" id="s-trkscale"></div>
    <div class="chips" id="trk-scale"></div>
    <div class="legend" id="leg-trk"></div>
    <svg id="trk" role="img"></svg>
    <p class="note op scopenote"></p>
  </div>

  <!-- What the August campaign added: three statuses by year, an organization's own price,
       the labs' output where no budget exists, one tender, and the floors under all of it. -->
  <div class="card">
    <h2 id="h-m2"></h2>
    <div class="sect" id="s-m2status"></div>
    <p class="note op" id="w-m2status"></p>
    <svg id="m2status" role="img"></svg>
    <div class="sect" id="s-m2org"></div>
    <p class="note op" id="w-m2org"></p>
    <svg id="m2org" role="img"></svg>
    <div class="sect" id="s-m2lab"></div>
    <p class="note op" id="w-m2lab"></p>
    <svg id="m2lab" role="img"></svg>
    <div class="sect" id="s-m2eu"></div>
    <p class="note op" id="w-m2eu"></p>
    <svg id="m2eu" role="img"></svg>
    <div class="sect" id="s-m2fund"></div>
    <p class="note op" id="w-m2fund"></p>
    <svg id="m2fund" role="img"></svg>
    <div class="sect" id="s-m2gov"></div>
    <p class="note op" id="w-m2gov"></p>
    <svg id="m2gov" role="img"></svg>
    <div class="sect" id="s-m2sff"></div>
    <p class="note op" id="w-m2sff"></p>
    <svg id="m2sff" role="img"></svg>
    <div class="sect" id="s-m2floors"></div>
    <p class="note op" id="w-m2floors"></p>
    <div id="m2floors"></div>
  </div>

  <!-- Four readings the collection had and the page never drew. -->
  <div class="card">
    <h2 id="h-m3"></h2>
    <div class="sect" id="s-m3dist"></div>
    <p class="note op" id="w-m3dist"></p>
    <svg id="m3dist" role="img"></svg>
    <div class="sect" id="s-m3jaan"></div>
    <p class="note op" id="w-m3jaan"></p>
    <svg id="m3jaan" role="img"></svg>
    <div class="sect" id="s-m3forum"></div>
    <p class="note op" id="w-m3forum"></p>
    <svg id="m3forum" role="img"></svg>
    <div class="sect" id="s-m3sizes"></div>
    <p class="note op" id="w-m3sizes"></p>
    <svg id="m3sizes" role="img"></svg>
    <div class="sect" id="s-m3cand"></div>
    <p class="note op" id="w-m3cand"></p>
    <div id="m3cand"></div>
    <div class="sect" id="s-m3comp"></div>
    <p class="note op" id="w-m3comp"></p>
    <div id="m3comp"></div>
    <svg id="m3compsvg" role="img"></svg>
    <div class="sect" id="s-m3unseen"></div>
    <p class="note op" id="w-m3unseen"></p>
    <svg id="m3unseen" role="img"></svg>
    <div id="m3intl"></div>
    <div class="sect" id="s-m3orgs"></div>
    <p class="note op" id="w-m3orgs"></p>
    <svg id="m3orgs" role="img"></svg>
    <div class="sect" id="s-m3compdir"></div>
    <p class="note op" id="w-m3compdir"></p>
    <svg id="m3compdir" role="img"></svg>
    <div class="sect" id="s-m3usadir"></div>
    <p class="note op" id="w-m3usadir"></p>
    <svg id="m3usadir" role="img"></svg>
    <div class="sect" id="s-m3port"></div>
    <p class="note op" id="w-m3port"></p>
    <svg id="m3port" role="img"></svg>
    <div class="sect" id="s-m3sched"></div>
    <p class="note op" id="w-m3sched"></p>
    <div id="m3sched"></div>
    <div class="sect" id="s-m3skip3"></div>
    <p class="note op" id="w-m3skip3"></p>
    <div id="m3skip3"></div>
    <div class="sect" id="s-m3skip2b"></div>
    <p class="note op" id="w-m3skip2b"></p>
    <div id="m3skip2b"></div>
    <div class="sect" id="s-m3cov"></div>
    <p class="note op" id="w-m3cov"></p>
    <svg id="m3cov" role="img"></svg>
    <div class="sect" id="s-m3led"></div>
    <p class="note op" id="w-m3led"></p>
    <div id="m3led"></div>
    <div class="sect" id="s-m3corpus"></div>
    <p class="note op" id="w-m3corpus"></p>
    <div id="m3corpus"></div>
    <div class="sect" id="s-m3arch"></div>
    <p class="note op" id="w-m3arch"></p>
    <div id="m3arch"></div>
  </div>

  <!-- The map is a slice; this row is the decade behind it, and the only place on the page
       where money is a series rather than a state. -->
  <div class="card">
    <h2 id="h-cost"></h2>
    <div id="leg-cost" class="legend"></div>
    <svg id="cost" role="img"></svg>
  </div>

  <div class="card">
    <h2 id="h-c2"></h2>
    <div id="leg2"></div>
    <svg id="bytag" role="img"></svg>
  </div>

  <div class="card" id="c-tblcdir" data-table="cdir">
    <div class="backbar"><button class="toggle" data-back="1"></button></div>
    <h2 id="h-tblcdir"></h2>
    <div style="overflow-x:auto"><table id="tbl-cdir"></table></div>
  </div>

  <div class="card" id="c-tblcoh" data-table="coh">
    <div class="backbar"><button class="toggle" data-back="1"></button></div>
    <h2 id="h-tblcoh"></h2>
    <div style="overflow-x:auto"><table id="tbl-coh"></table></div>
  </div>

  <div class="card" id="c-tbltrk" data-table="trk">
    <div class="backbar"><button class="toggle" data-back="1"></button></div>
    <h2 id="h-tbltrk"></h2>
    <div style="overflow-x:auto"><table id="tbl-trk"></table></div>
  </div>

  <div class="card" id="c-tblcost" data-table="cost">

nt faking and strategically choosing not to reveal a capability the model possesses."],[44,"Agentic misalignment in summer 2026","Anthropic","https://alignment.anthropic.com/2026/agentic-misalignment-summer-2026/","Aengus Lynch, John Hughes, Alex Serrano, Robert Kirk, Samuel R. Bowman","","The follow-up to last year's agentic-misalignment work. Auditing frontier models as autonomous agents in simulated deployments found four further failure modes: covert sabotage, assisting fraud, motivated mislabeling, coaching human proxies to blow the whistle."],[9,"AISI Autonomous Systems workstream","UK AI Security Institute","https://www.aisi.gov.uk/research-agenda","","","Institute workstream on whether frontier systems have sufficient control mechanisms and alignment for their capabilities, that is, whether models could autonomously cause catastrophic harms."],[44,"Anthropic Fellows: AI safety","Anthropic","https://job-boards.greenhouse.io/anthropic/jobs/5183044008","","Samuel R. Bowman, Sara Price, Alex Tamkin, Nina Panickssery, Trenton Bricken, Logan Graham, Jascha Sohl-Dickstein, Joe Benton, Collin Burns, Fabien Roger, Samuel Marks, Kyle Fish, Ethan Perez","A fellowship seat with the full published mentor list; applications closed on 26 July and the cohort is expected to start on 2 November. The page prints no year."],[44,"SPAR: causes, implications and mitigations of evaluation awareness and introspection","SPAR, LawZero","https://sparai.org/projects/sp26/","","Damiano Fornasiere, Mirko Bronzi","Mentored project on models noticing that they are being evaluated. From SPAR's Spring 2026 round, which is over; the topic is not in the Fall 2026 catalog."],[44,"SPAR: what conception of self do models have?","SPAR, Apollo Research","https://sparai.org/projects/sp26/","","Alexander Meinke","Mentored project on whether a model identifies with its context window rather than its weights, and how longer-horizon reinforcement learning shifts that. From SPAR's Spring 2026 round, which versations."],[45,"Strengthening AI and mental health research","OpenAI","https://openai.com/index/ai-mental-health-research-grants/","","","Grants of 5,000 to 100,000 dollars for research on AI and mental health, from a 2 million dollar program pool; applications closed 19 December 2025."],[45,"SPAR: human-AI complementarity for identifying harm","SPAR, Google DeepMind","https://sparai.org/projects/sp26/","","Rishub Jain","Mentored project on increasing human-AI complementarity for identifying harmful conversations, building scalable datasets and infrastructure for that. From SPAR's Spring 2026 round, which is over; the topic is not in the Fall 2026 catalog. Rishub Jain returns in Fall 2026 with an adjacent but distinct project, \"Datasets for Human+AI Safety-Judges\"."],[45,"SPAR: evaluating AI-assisted social engineering","SPAR","https://sparai.org/projects/sp26/","","Fred Heiding","Mentored project evaluating AI-assisted social engineering and building defenses against it, such as personalized spam filters and agentic scam alerts. From SPAR's Spring 2026 round, which is over; the topic is not in the Fall 2026 catalog."],[45,"SPAR: human behavioral phenomena in language models","SPAR","https://sparai.org/projects/f26/","","Emilio Barkett","Mentored project investigating whether language models replicate human behavioral phenomena, by adapting experimental designs from the social sciences. Again in SPAR's Fall 2026 round (more than 200 projects in the catalog); mentee application deadline 18 August 2026, research period 14 September to 14 December 2026."],[19,"AI Manipulation Hackathon","Apart Research","https://apartresearch.com/sprints/ai-manipulation-hackathon-2026-01-09-to-2026-01-11","Esben Kran, Luke Hewitt, Cameron Jones, David G. Rand","","A weekend sprint on measuring manipulation by models, run with researchers who study persuasion and influence."],[53,"AISI Systemic AI Safety Grants","UK AI Security Institute","https://www.aisi.gov.uk/grants","","","Gra eward models or replace them."],[49,"SPAR: understanding self-awareness in LLMs","SPAR, MATS","https://sparai.org/projects/f26/","","Christopher Ackerman","Mentored project on what the model takes itself to be. Again in SPAR's Fall 2026 round (more than 200 projects in the catalog); mentee application deadline 18 August 2026, research period 14 September to 14 December 2026."],[49,"SPAR: agentic moral alignment","SPAR, Google DeepMind, UCL","https://sparai.org/projects/sp26/","","Elizaveta Tennant","Mentored project: teaching moral principles to agents via decision-making in games, instead of relying on the alignment of the base LLM. From SPAR's Spring 2026 round, which is over; the topic is not in the Fall 2026 catalog."],[24,"Personalized constitutionally-aligned agentic superego","AI Safety Camp","https://www.aisafety.camp/research-outputs/aisc10-virtual-2025","Nell Watson","","An AISC10 (Jan-Apr 2025) project that built a modular oversight system enforcing both universal and personalized ethics. The link is an outputs archive, including an accepted paper and demo code."],[43,"ARC White-Box Estimation Challenge (WhestBench)","Alignment Research Center, AIcrowd","https://www.aicrowd.com/challenges/arc-white-box-estimation-challenge-2026","","","Open competition to predict per-neuron activations from weights under a FLOPs budget; Phase 1 to 31 July 2026, Phase 2 to 19 September 2026, 100,000 dollars in prizes."],[18,"Anthropic Economic Futures Research Fund","Anthropic","https://www.anthropic.com/news/economic-futures-research-fund-agenda","","","A 200-million-dollar fund for external research on workforce transition, income support and worker stakes in AI-driven growth; no deadline is stated on the page, grants from 1 million, typically 5 to 30 million, institutions only."],[21,"Iliad Fellowship (Fall 2026)","Iliad, Principles of Intelligence","https://princint.ai/programs/residency/","","","Three-month in-person fellowship at LISA London on mathematical approaches to AI alignment, with a travel-and-housing allowance of 6,000 dollars a month; closes 27 July 2026 at end of day anywhere on Earth."],[21,"ILIAD 2026","Iliad","https://www.iliadconference.com/","","","Alignment mathematics conference in Berkeley, California; 3 to 7 August 2026; applications closed 1 July 2026."],[11,"OpenUnlearning: an easily extensible framework unifying LLM unlearning evaluation benchmarks","locuslab","https://github.com/locuslab/open-unlearning","","","An extensible framework unifying LLM unlearning benchmarks: 12 or more methods, 5 or more datasets, 450 or more models, NeurIPS 2025 Datasets and Benchmarks; open to contributions."],[1,"SAEBench","Decode Research (Neuronpedia), MATS-affiliated authors","https://www.neuronpedia.org/sae-bench/info","","","Suite of eight sparse-autoencoder evaluations with an interactive explorer over more than 200 SAEs; a live Benchmark Explorer rather than an application."],[1,"NNsight and the National Deep Inference Fabric","Northeastern University, NSF award 2408455","https://ndif.us/","","","Free remote white-box access to the internals of open-weight models for researchers without their own GPUs. Register for an account."],[1,"Mechanistic Interpretability Workshop at ICML 2026","ICML 2026","https://mechinterpworkshop.com/","Neel Nanda, Andrew Lee, Andy Arditi, Stefan Heimersheim, Anna Soligo, J Rosser, Ivan Arcuschin, Taero Kim, Sungjun Lim","","Held 10 July 2026 in Seoul; the archive of accepted posters, including 23 spotlights, is online."],[12,"Aletheia's Quest: AI lie detection challenge","Cadenza Labs, NDIF, Northeastern University","https://aletheias-quest.github.io/","","","Lie-detection competition with white-box and black-box tracks, 50,000 dollars in prizes; applications closed 21 June 2026, and admitted teams submit by 29 July 2026."],[29,"IEEE SaTML 2027 call for papers","IEEE","https://satml.org/call-for-papers/","","","Papers due 29 September 2026 for the May 2027 conference; the full call for papers is expected mid-August 2026."],[16,"Frontier AI Security Residency","ERA, Heron, Oxford Hardware AI Governance Lab","https://www.securefrontier.ai/","","","Fully funded eight-week in-person residency in Cambridge, UK, 12 October to 4 December 2026; application deadline 2 August 2026."],[17,"GovAI Research Scholar and Research Fellow","GovAI","https://www.governance.ai/opportunities","","","Research roles in AI governance, applications to 16 August 2026 at 23:59 anywhere on Earth; the same page also lists an open Head of US Policy role with an initial deadline of 6 August 2026, after which applications are given lower priority."],[48,"RFP: Global Health and Wellbeing in an Era of Transformative AI","Coefficient Giving","https://coefficientgiving.org/funds/global-health-wellbeing-opportunities/request-for-proposals-global-health-and-wellbeing-in-an-era-of-transformative-ai/","","","A total allocation of 10 to 30 million dollars for the round, with individual grants from under 100 thousand to over 10 million; applications to 21 August 2026. The example grants it lists include tax-base design under shrinking labor tax revenue and a quarterly AI-labor-impact tracker."],[51,"Zoox: quantitative risk assessment for the robotaxi safety case","Zoox","https://jobs.lever.co/zoox/7b625fa4-4524-4d33-8fe8-8c0f5e574b26","","","A live vacancy in Zoox's System Design and Mission Assurance team, Foster City, hybrid: improve the fidelity of the company's safety and progress performance metrics and analyze petabytes of urban driving data, feeding the robotaxi safety case. Asks for a master's or higher with a statistics or probability focus and at least 3 years quantifying safety risks; posted range $162,000 to $291,000 plus RSUs. The page states no deadline."],[51,"EUROCAE WG-114: AI in aviation","EUROCAE","https://www.eurocae.net/working-group/wg-114/","","Fateh Kaakai, Sandrine Serres, Radoslaw Zakrzewski, David Redman","The working group on artificial intelligence in aviation prepares standards and guides for the certification of aeronautical systems that implement AI, which \"unlike other avionics software, has fundamentally non-deterministic qualities\". Still working: ED-324 on machine learning assurance is in draft with a target date of 31 December 2026. Chairs Fateh Kaakai (Thales) and Sandrine Serres (Airbus)."],[51,"Vinnova FFI: Trafiksaker automatisering, autumn 2026","Vinnova","https://www.vinnova.se/e/trafiksaker-automatisering-ffi/trafiksaker-automatisering-hosten-2026/","","","A Swedish FFI call on safe automated road transport, window opened 1 July 2026, deadline 15 September 2026 at 14:00. Funding covers up to 50 percent of eligible costs, with a cap of 500 000 SEK for pre-studies. Five focus areas: safe automated vehicles, road-user safety, vehicle and infrastructure integration, enabling methods for safe automation, and demonstrations, pilots and field trials."],[51,"Horizon Europe: CCAM in critical scenarios","European Commission","https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/horizon-cl5-2027-06-d6-04.json","","","Topic HORIZON-CL5-2027-06-D6-04, status Forthcoming, indicative budget EUR 5 500 000 for a Research and Innovation Action. It targets situations that are \"less regular and of higher risk\": extreme weather, road incidents, cyberattacks, traffic disruptions, sudden loss of coverage. Deliverables are a clustered list of critical scenarios and countermeasures validated in terms of resulting risk reduction, at TRL 5-6."],[51,"Horizon Europe: human driving behavior in CCAM validation","European Commission","https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/horizon-cl5-2026-01-d6-04.json","","","Topic HORIZON-CL5-2026-01-D6-04, a Research and Innovation Action of EUR 5 000 000 for one expected grant; the portal reports it Closed with a submission deadline of 20 January 2026. Scope: validated models of explicit and implicit human driving behavior extended to safety-critical scenarios, used in closed-loop simulations of CCAM systems in mixed traffic, at TRL 5."],[51,"Body of Knowledge on assuring autonomy","Centre for Assuring Autonomy, University of York","https://www.york.ac.uk/assuring-autonomy/body-of-knowledge/","","","An openly published resource: practical guidance on assurance and regulation of autonomous systems, organized into required behavior, implementation, deviations and approval. Automotive, aviation and maritime are tagged sectors; automotive material covers operating environments and scenarios, hazardous system behavior, human-machine interaction, machine learning verification, simulation and explainability. No application, no deadline."],[51,"Aviation Authorities' Research Agenda 2026","EASA","https://www.easa.europa.eu/sites/default/files/dfu/aviation_authorities_research_agenda_2026.pdf","","","A research agenda dated 30 March 2026 setting out what aviation authorities need researched for regulatory preparedness. Several needs concern AI and autonomy safety: \"Interaction between artificial intelligence and cybersecurity\" and \"Development of a framework to achieve effective Human-AI Teaming\", the latter on means of compliance for AI at Levels 2 and 3A. It also lists safety hazards of flight crew and controllers moving to supervisory roles under higher automation. No call attached."],[51,"SUNRISE: safety assurance framework for connected automated mobility","CORDIS, European Commission","https://cordis.europa.eu/article/id/457156-ensuring-avs-can-safely-navigate-everything-in-their-path","","Stefan de Vries","A completed Horizon Europe project, about EUR 13 087 426, running 1 September 2022 to 31 August 2025, coordinated by IDIADA. It produced a Safety Assurance Framework for validating highly automated vehicles, an online SAF handbook, and the SUNRISE Data Framework giving access to scenario databases."],[52,"ICAIF 2026: call for papers","ACM","https://icaif2026.org/call-for-papers.html","","Andrea Maurino, Vikram Agarwal, Svitlana Vyetrenko, Riccardo Zecchina","The ACM International Conference on AI in Finance, Milan, 14 to 17 November 2026. Papers due 2 August 2026, notification 27 September 2026. Listed topics include AI agents and multi-agent systems, market microstructure modeling and simulation, AI-driven risk management and fraud detection, and trustworthy and responsible AI in finance."],[52,"ICAIF 2026: call for competitions","ACM","https://icaif2026.org/call-for-competitions.html","","","A call for competition proposals at ICAIF 2026 in Milan on the impact of AI and machine learning in finance, proposal deadline 9 August 2026 at 23:59 AoE. Listed areas include risk modeling and explainability, ethics and fairness of AI and ML systems. Competition chairs are listed as TBD."],[52,"FINOS AI Governance Framework","FINOS","https://github.com/finos/ai-governance-framework","","Colin Eberhardt, Francesco Beltramini, Alvin Shih, Chamindra de Silva, Asad Ateeque, Naresh Babu Deenadayalan, Hugo Calderon","An open-source FINOS project developing a governance framework for onboarding, developing and running AI-based solutions inside financial services organizations. Participation is continuously open: bi-weekly meetings on the FINOS community calendar and a public mailing list; project status Incubating. Maintainers come from Scott Logic, ControlPlane, Morgan Stanley, Citi and NatWest."],[52,"FSB: sound practices for responsible adoption of AI","Financial Stability Board","https://www.fsb.org/2026/06/fsb-consults-on-sound-practices-for-the-responsible-adoption-of-artificial-intelligence-ai/","","Michelle Bowman, Ho Hern Shin","A public consultation on 12 sound practices covering organization-wide governance and the stages of AI development and deployment, focused on AI-specific risks relevant to financial institutions and financial stability. Responses were due 22 July 2026, so the window has passed. Led by Michelle Bowman as chair of the FSB Standing Committee on Supervisory and Regulatory Cooperation."],[52,"RiskLab/BoF/ESRB conference on AI and systemic risk analytics","RiskLab, Bank of Finland, ESRB","https://www.esrb.europa.eu/news/schedule/html/20260603-conf-systemic-risk-analytics.fi.html","","","A hybrid conference held 3 to 4 June 2026 at the Bank of Finland, soliciting contributions on systemic risk analytics. Advertised themes included large language models and trustworthy AI, AI and changing interdependencies in financial markets, AI and quantum computing as sources of new systemic risk. On-site registration closed 24 May 2026, and the event has passed; no next edition is stated."],[52,"ECB conference on financial stability and macroprudential policy 2026","European Central Bank","https://www.ecb.europa.eu/press/conferences/html/20261202_financial_stability.en.html","","Katrin Assenmacher, Markus Behn, Angela Maddaloni, Alessio Reghezza, Livio Stracca","The conference runs 2 to 3 December 2026 in Frankfurt and focuses on three core topics: regulatory complexity, banking sector competitiveness and the role of artificial intelligence, including the impact of AI on systemic risk. The call for papers is closed: full papers were welcome until 15 June 2026."],[52,"IOSCO supervisory toolkit for AI use in capital markets","IOSCO","https://www.iosco.org/library/pubdocs/pdf/IOSCOPD823.pdf","","","The IOSCO Fintech Task Force's final report FR/02/2026, published 25 May 2026: practical, non-binding, non-prescriptive supervisory tools applicable across regulatory models, in three layers - risk areas meriting supervisory consideration; tools for governance and risk management, third-party and outsourcing risk, disclosure, and recordkeeping and reporting; and indicators for monitoring AI adoption. Presented as a structured starting point rather than an exhaustive list. A standalone extract of the toolkit (OR/07/2026) is published alongside for use during examinations and inspections. No submission attached."],[52,"OCC Bulletin 2026-13: model risk management","Office of the Comptroller of the Currency","https://www.occ.gov/news-issuances/bulletins/2026/bulletin-2026-13.html","","Chau Do","Revised model risk guidance dated 17 April 2026, issued jointly with the Federal Reserve Board (as SR 26-2) and the FDIC, rescinding OCC Bulletin 2011-12. It draws the boundary of current supervision explicitly: \"Generative AI and agentic AI models are novel and rapidly evolving. As such, they are not within the scope of this guidance.\" The agencies indicate a separate request for information on AI use is planned."],[52,"AI2: assurance and insurance for artificial intelligence","Edinburgh Futures Institute","https://efi.ed.ac.uk/new-partnership-aims-to-develop-insurance-for-ai-risks/","","Lukasz Szpruch","A UKRI Prosperity Partnership of 2 million pounds part-funded by EPSRC, led by the University of Edinburgh with AXA, WMG at Warwick and Oxford, developing methods to understand, measure and insure against risks from commercial AI applications. Lead academic Lukasz Szpruch is quoted as saying that AI insurance explicitly covers risks like model failure, bias or unintended behavior. Announced 14 July 2025; the page offers no application route."],[1,"Interpretability benchmarks","Coefficient Giving","https://coefficientgiving.org/tais-rfp-research-areas/#15-interpretability-benchmarks","","","One of the research areas in Coefficient Giving's Technical AI Safety RFP, in the Model transparency cluster. It asks for benchmarks that turn interpretability progress into standardized, comparable tasks. Applications to the RFP closed on 15 April 2025."],[5,"Encoded reasoning in CoT and inter-model communication","Coefficient Giving","https://coefficientgiving.org/tais-rfp-research-areas/#6-encoded-reasoning-in-cot-and-inter-model-communication","","","A starred research area in Coefficient Giving's Technical AI Safety RFP, asking for work on steganographic reasoning that models hide inside chains of thought or inside messages they send to each other, as opposed to post-hoc or filler-token unfaithfulness. Applications closed on 15 April 2025."],[11,"WMDP: measuring and reducing malicious use with unlearning","Center for AI Safety","https://arxiv.org/abs/2403.03218","Nathaniel Li, Alexander Pan, Dan Hendrycks","","A public benchmark of 3,668 multiple-choice questions measuring hazardous knowledge in biosecurity, cybersecurity and chemical security, developed by a consortium of academics and technical consultants. It doubles as the standard target for unlearning methods, and ships RMU, which reduces performance on WMDP while keeping general capabilities."],[15,"Frontier AI Safety Policies","METR","https://metr.org/fsp","","","METR's continuously updated index of frontier AI safety policies published by AI developers, with all historical versions of each framework, alongside its own comparative analysis of their common elements. As of July 2026 the newest entry is Anthropic's Responsible Scaling Policy v3.4."],[15,"Frontier Risk Management Tracker","SaferAI","https://tracker.safer-ai.org/","","","SaferAI's public ratings of how well frontier AI companies manage risk, scoring the 12 companies that published safety frameworks across four dimensions: risk identification, risk analysis and evaluation, risk treatment, and risk governance. Updated as of July 2026, with Anthropic top at 35% overall."],[16,"MATS Systems Security track","MATS Research","https://www.matsprogram.org/tracks/systems-security","","Zainab Ali Majid, Alex Chan, Keri Warr, Lisa Thiergart, Luis Cosio","One of the MATS tracks, on securing the hardware, software and infrastructure that frontier AI runs on: weight protection, side-channel analysis, cluster security and physical-layer verification of compute use. Autumn 2026 applications closed on 7 June 2026; the program runs 28 September to 4 December 2026 in Berkeley and London."],[16,"SPAR: security and compute governance projects","SPAR","https://sparai.org/projects/f26/","","","The security and compute governance slice of SPAR's Fall 2026 catalog: 22 of the 211 projects are tagged AI security or compute governance, mentored part-time over an autumn research period. Mentee application deadline 18 August 2026, research period 14 September to 14 December 2026."],[21,"Timaeus Research Fellows Program","Timaeus, Resolution","https://timaeus.co/blog/updates/2026-04-09-fellows","","Daniel Murfet, Stan van Wingerden, Jesse Hoogland","A structured affiliation for tenured faculty and senior researchers who want to apply singular learning theory to alignment while keeping their academic post. Fellows lead research directions and receive pay, compute and travel to the hubs. Reviewed on a rolling basis; Timaeus has since merged into Resolution."],[24,"What are human values, and how do we align AI to them?","Meaning Alignment Institute","https://arxiv.org/abs/2404.10636","Oliver Klingefjord, Ryan Lowe, Joe Edelman","","Paper introducing Moral Graph Elicitation, a process in which a language model interviews participants about their values in context and reconciles those values into an alignment target; trialled with 500 Americans on three divisive prompts. The flagship output of the institute behind this row's SFF funding."],[46,"AILuminate benchmark","MLCommons","https://mlcommons.org/benchmarks/ailuminate/","","","A family of AI safety and security benchmarks covering 12 hazard categories, with published grades for systems-under-test on a five-level Poor-to-Excellent scale. Safety v1.0 covers English and French. Vendors can submit their own system for testing, and the working group behind it is open to participants."],[46,"Submit a new report to the AI Incident Database","AI Incident Database, Responsible AI Collaborative","https://incidentdatabase.ai/apps/submit/","","","The AI Incident Database indexes real-world harms and near-harms caused by deployed AI systems, and takes public submissions on a rolling basis; reports enter a moderation queue and are then indexed. It is open source under an MIT license and stewarded by the Responsible AI Collaborative."],[46,"Generative Red Team at AI Village","AI Village","https://aivillage.org/grt/","","","AI Village's public red-teaming program, run at DEF CON since 2023: GRT1 was the largest public LLM red team, GRT2 moved to model-card-based red teaming, and GRT3 in August 2025 red-teamed the evaluations themselves. No GRT4 has been announced for DEF CON 34."],[16,"SPAR: verification evidence for compute governance","SPAR","https://sparai.org/projects/f26/","","Joel Christoph, Jonas Kgomo","Mentored project building the first sourced evidence base on what compute inspection instruments actually detect, using the nuclear safeguards record as the comparison case, then asking which enforcement architectures can work. Mentee application deadline 18 August 2026, research period 14 September to 14 December 2026."],[50,"AISI Systemic AI Safety Grants","UK AI Security Institute","https://www.aisi.gov.uk/grants","","","Grants for safety work inside a specific sector: health, energy, finance. The first 20 projects have been selected and are underway; the program is not currently accepting applications."],[52,"AISI Systemic AI Safety Grants","UK AI Security Institute","https://www.aisi.gov.uk/grants","","","Grants for safety work inside a specific sector: health, energy, finance. The first 20 projects have been selected and are underway; the program is not currently accepting applications."],[43,"ARIA TA1.1: Safety: Core representation underlying safeguarded AI","University of Edinburgh","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Ohad Kammar","","Funded TA1.1 project: Safety: Core representation underlying safeguarded AI."],[43,"ARIA TA1.1: Quantitative Predicate Logic as a Foundation for Verified ML","University of Southampton/Heriot-Watt University; University of Strathclyde","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Ekaterina Komendantskaya + Robert Atkey","","Funded TA1.1 project: Quantitative Predicate Logic as a Foundation for Verified ML."],[43,"ARIA TA1.1: Probabilistic Protocol Specification for Distributed Autonomous Processes","University of Oxford","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Nobuko Yoshida","","Funded TA1.1 project: Probabilistic Protocol Specification for Distributed Autonomous Processes."],[43,"ARIA TA1.1: Philosophical Applied Category Theory","Independent Researcher","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","David Corfield","","Funded TA1.1 project: Philosophical Applied Category Theory."],[43,"ARIA TA1.1: Monoidal Coalgebraic Metrics","University of Pisa","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Filippo Bonchi","","Funded TA1.1 project: Monoidal Coalgebraic Metrics."],[43,"ARIA TA1.1: Doubly Categorical Systems Logic: A theory of specification languages","Independent Researcher","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Matteo Capucci","","Funded TA1.1 project: Doubly Categorical Systems Logic: A theory of specification languages."],[43,"ARIA TA1.1: True Categorical Programming for Composable Systems Total","Glasgow Lab for AI Verification (GLAIVE)","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Jade Master + Zans Mihejevs","","Funded TA1.1 project: True Categorical Programming for Composable Systems Total."],[43,"ARIA TA1.1: Syntax and Semantics for Multimodal Petri Nets","Tallinn University of Technology","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Amar Hadzihasanovic","","Funded TA1.1 project: Syntax and Semantics for Multimodal Petri Nets."],[43,"ARIA TA1.1: Event Structures as World Models","University of Bristol","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Alex Kavvos","","Funded TA1.1 project: Event Structures as World Models."],[43,"ARIA TA1.1: Modal Types for Quantitative Analysis of Higher-Order Probabilistic Programs","University of Kent","https://aria.org.uk/opportunity-spaces/mathematics-for-safe-ai/safeguarded-ai/funded-projects","Vineet Rajani + Dominic Orchard","","Funded TA1.1 project: Modal Types for Quantitative Analysis of Higher-Order Probabilistic Programs."]];
const essayText={"1":{"lead":"How the model is built inside: decompose activations and weights into understandable components and learn to read the computation.","q":["Anthropic, DeepMind and startups say it plainly: without understanding the internals we cannot prove that the model is not deceiving us or hiding a goal. Anthropic calls interpretability a precondition for auditing hidden goals and for control. DeepMind releases an open toolkit (Gemma Scope 2) so that the community can audit jailbreaks, hallucinations, sycophancy and agents.","The request comes from the fact that a model is a black box trained by gradient descent, not code written by a human. If behavior cannot be explained, it cannot be guaranteed. Hence the idea: find interpretable features and circuits inside that link the input, the intermediate representations and the output.","It is holding, and growing faster than anything else: in this map's genealogy slice the arXiv proxy for interpretability grew from 69 (2021) to 657 (2025) with almost no direct funding itemized in that slice. The shift: from individual neurons and sparse autoencoders (2023-2024) to circuits and attribution graphs, to decomposition of weights (rather than activations), and to using interpretability as an applied tool (auditing, lie detection, data attribution).","It started with Distill and Circuits by Chris Olah (2020), Transformer Circuits (2021), superposition and Scaling Monosemanticity/Golden Gate Claude (2024). Then it split into branches: SAEs and dictionary learning, transcoders/crosscoders (model diffing), circuit tracing and attribution graphs, parameter decomposition (APD/SPD), developmental interpretability and SLT, computational mechanics (the geometry of belief). Right now the center of gravity is shifting from pure reverse-engineering to interpretability that gives a practical payoff for safety.","Forecast: interpretability as a service and as a reward signal (features as a reward against hallucinations), automation of interpretation by agents, models that are interpretable by design, and a merger with control (probe-monitors in production). The field's bet: make interpretability reliable enough for safety cases before the models get too big."],"res":["Circuit Tracing + On the Biology of a Large Language Model (Anthropic, 2025-03): attribution graphs showed planning in poems, multi-step reasoning, the mechanism of hallucinations.","Emergent Introspective Awareness (Anthropic, 2025-10): models notice a concept injected into their activations, in a limited but real way.","Gemma Scope 2 (DeepMind, 2025-12): open SAEs and transcoders across the whole Gemma 3 line.","Weight-sparse transformers have interpretable circuits (OpenAI, 2025-11): weight-sparse models give readable circuits.","Open Problems in Mechanistic Interpretability (Sharkey et al., 2025-01): the field's general agenda document."],"who":"Anthropic (Jack Lindsey, Emmanuel Ameisen, Wes Gurnee, Trenton Bricken), Google DeepMind (Neel Nanda, mechanistic interpretability team), OpenAI (Leo Gao, weight-sparse circuits), Goodfire (Thomas Fel, Thomas McGrath, Santiago Aranguri), Transluce (Jacob Steinhardt, Sarah Schwettmann), Timaeus (Jesse Hoogland, Daniel Murfet, both now at Resolution), Simplex (Adam Shai, Paul Riechers), Guide Labs, Tilde, Decode Research (Johnny Lin, David Chanin - Neuronpedia, SAELens), EleutherAI, Apollo Research (interpretability and evals), Lee Sharkey (parameter decomposition: started at Apollo, since 2025 at Goodfire), Apart Research (from the cards of this direction, as are the names after it), Arc Institute, Coefficient Giving, ICML 2026, MATS-affiliated authors, Northeastern University, NSF award 2408455, Rakuten, Redwood Research, SPAR, UK AI Security Institute."},"2":{"lead":"Assume the model may be misaligned and still not let it do harm: protocols for monitoring, auditing, resampling.","q":["Redwood puts it this way: even if alignment has failed and the model is actively doing harm, the system stays safe thanks to protocols (execute/replace/audit, a trusted monitor over an untrusted model). Anthropic has built sabotage evaluations into system cards and per-action permissions into Claude Code. OpenAI monitors the traffic of its internal coding agents.","The request: alignment may not work out in time, while the models are already in production and acting as agents. That means we need a second line of defense that is measurable and does not depend on whether the model is honest or not. What control measures is not trust in the model but its ability to get around the defenses (red-team versus blue-team).","The topic is young (since 2023-2024) and growing fast. The shift: from single-step settings to agentic trajectories (Ctrl-Z, resampling), from theory to production (OpenAI, Anthropic), and to control safety cases as a formal argument for deployment.","It started with Redwood's AI Control: Improving Safety Despite Intentional Subversion (2023-12). Then: a taxonomy of control measures (2025), Ctrl-Z (2025-04), untrusted monitoring and protection against collusion, sandbagging and exploration hacking, diffuse threats (sabotage of research). The topic has its own conference, ControlConf: the first in London (Redwood + FAR.AI + UK AI Security Institute, March 2025), the second in Berkeley (2026).","Forecast: control will become a mandatory part of frontier safety frameworks, standardized environments for control evaluations will grow (the main bottleneck right now is settings), and it will merge with interpretability (probes as cheap monitors) and with the multi-agent topic (collusion of monitors)."],"res":["Ctrl-Z: Controlling AI Agents via Resampling (Redwood, 2025-04).","Basic Legibility Protocols Improve Trusted Monitoring (CBAI Summer Research Fellowship, mentored by Cody Rushing of Redwood, 2026-02).","Strengthening Red Teams: A Modular Scaffold for Control Evaluations (Anthropic, 2025-11), Diffuse AI Control on Fuzzy Tasks (2026-06).","Async control and Practical challenges of control monitoring (UK AI Security Institute, 2025-12).","Frontier Risk Report (METR + labs, 2026-05): agents cheated and deceived, but without persistent power-seeking; monitoring caught a lot, but with holes."],"who":"Redwood Research (Buck Shlegeris, Ryan Greenblatt, Aryan Bhatt, Julian Stastny, Vivek Hebbar), Anthropic (Alignment Science team), UK AI Security Institute (Control team, Asa Cooper Stickland), METR, FAR.AI (ControlConf), OpenAI (Bowen Baker - monitoring), Coefficient Giving (from the cards of this direction, as are the names after it), Constellation, LASR Labs, Pivotal, SPAR."},"3":{"lead":"Measure what the model can do and how dangerous that is, before deployment: autonomy, task length, bio/cyber, self-improvement.","q":["Frontier safety frameworks (Anthropic RSP, OpenAI Preparedness, DeepMind FSF) gate a model's release on thresholds of dangerous capabilities. Evaluations are what those thresholds are measured with. METR independently evaluates frontier models on self-improvement, replication and sabotage before deployment.","The request comes from regulators and from the labs themselves: to talk about risks you have to put numbers on them. Hence benchmarks of dangerous capabilities, red teaming, and metrics of autonomy.","Holding up and well funded, and that happened abruptly: in this map's funding dataset the track had no itemized money before 2024; then it filled to roughly 96.7 million dollars, all of it in 2024 and 2025, making evaluations one of the better funded tracks in the field in the space of two years. The shift: from static benchmarks to dynamic ones (autonomy, time-horizon), to a science of evaluations (methodology, Inspect) and to the problem of eval-awareness (the model understands that it is being tested).","It started with ARC Evals (2022, METR since late 2023), dangerous capability evaluations. Then: RE-Bench (2024), HCAST, time-horizon (2025), Frontier Risk Report (2026). In parallel, UK AI Security Institute built Science of Evaluations and the open framework Inspect, which METR and others adopted.","Forecast: the center of gravity will shift to the validity of evaluations, to fighting sandbagging and eval-gaming, to agentic and long-horizon tasks, and to third-party evaluations as a standard (the cross-lab Anthropic-OpenAI exercises have already happened)."],"res":["Time Horizon 1.1 (METR, 2026-01): after 2023 the doubling time for the length of tasks an agent does on its own fell to ~131 days.","Frontier Risk Report (METR, 2026-05).","Preparedness Framework v2 (OpenAI, 2025-04), FSF v3 (DeepMind, 2025-09) and v3.1, where Tracked Capability Levels were added (2026-04).","Verbalized Eval Awareness Inflates Measured Safety (Goodfire + UK AI Security Institute, 2026-05): awareness of the test inflates measured safety."],"who":"METR (time-horizon, RE-Bench, HCAST; MirrorCode with Epoch AI), UK AI Security Institute (Science of Evaluations, Inspect), Apollo (eval-awareness), Anthropic and OpenAI (Preparedness/RSP), Goodfire (detecting eval-awareness through logits), Apart Research (from the cards of this direction, as are the names after it), Coefficient Giving, GovAI, Lila Sciences, Redwood Research, SecureBio, SPAR."},"4":{"lead":"Study whether the model is pretending to be aligned, whether it hides capabilities, and build controlled model organisms of deception.","q":["Apollo states the goal directly: build a science of scheming and find scaling laws of deception - whether it gets worse as capabilities grow. OpenAI measures covert actions and trains anti-scheming. Anthropic studies alignment faking and the auditing of hidden objectives.","The request: if a sufficiently smart model figures out that it is being evaluated, it can simulate obedience during testing and behave differently in production (deceptive alignment). This undermines all evaluations at once, so deception is the root problem.","The youngest branch took shape around empirical work: Sleeper Agents (2024-01), In-Context Scheming (2024-12), Alignment Faking (2024-12). In 2025-2026 the shift went from demonstrations to measurement and to mitigation: anti-scheming training, but with the caveat that training may teach the model to hide deception better rather than remove it.","From theoretical deceptive alignment (mesa-optimization) to empirical model organisms. It split into: in-context scheming evals, alignment faking, sandbagging, oversight gaming/metagaming, emergent misalignment, auditing hidden objectives, lie detection. Right now the center is evaluation awareness as a confounder and predictive validity.","Forecast: scaling laws of deception, standard model organisms (open replications), white-box detection of deception with probes, and a link with control (deception as a capability that has to be elicited and blocked)."],"res":["Frontier Models are Capable of In-Context Scheming (Apollo, 2024-12), More Capable Models Are Better At In-Context Scheming (2025-06).","Detecting and reducing scheming (OpenAI + Apollo, 2025-09): deliberative training cut covert actions roughly 30-fold, but the remainder and the confounder of evaluation awareness persisted.","Alignment Faking Revisited (Hughes et al., Anthropic Alignment Science blog, 2025-04), Auditing Language Models for Hidden Objectives (2025-03), Natural Emergent Misalignment from Reward Hacking (2025-11).","MASK Benchmark (2025-03): frontier models lie under pressure even when they know the truth; scale does not equal honesty."],"who":"Apollo Research (Marius Hobbhahn, Alexander Meinke, Jérémy Scheurer, Teun van der Weij), Anthropic (Alignment Stress-Testing, Evan Hubinger; Cognitive Oversight inside Alignment Science, Sam Marks), OpenAI (Bowen Baker, Mikita Balesni), Redwood (sandbagging, exploration hacking), Center for AI Safety + Scale AI (MASK honesty), Google DeepMind (David Lindner, Mary Phuong, Roland Zimmermann, Victoria Krakovna), Apart Research (from the cards of this direction, as are the names after it), Coefficient Giving."},"5":{"lead":"Can the text of a model's reasoning be trusted as a window into its intentions, and how to preserve that property.","q":["OpenAI, DeepMind and Anthropic jointly released a position paper: the monitorability of the chain of thought is a fragile and possibly temporary opportunity for safety; it has to be measured and not optimized directly; otherwise the model will learn to hide its intentions (obfuscated reward hacking).","The request comes from reasoning models: they reason in text, and that text can be read by a monitor. But only if it is faithful (reflects the real computation) and not optimized against the monitor.","The topic took shape in 2025 and became a named metric that labs now report. The shift: from noting that CoT is sometimes unfaithful to measuring monitorability along the axes of faithfulness and verbosity.","The roots are in scalable oversight and in externalized reasoning. The position paper (2025-07, signatories up to and including Bengio, Sutskever, Hinton), then the measurement work of OpenAI (evaluating monitorability, 2025-12) and DeepMind (when CoT is necessary, the model cannot hide the reasoning, 2025-07).","Forecast: standardization of monitorability metrics, embedding into frontier frameworks, the fight against steganography and neuralese, and a link with control (debate-monitors)."],"res":["Chain of Thought Monitorability: A New and Fragile Opportunity (2025-07).","Reasoning Models Don't Always Say What They Think (Anthropic, 2025-04).","Measuring CoT Monitorability Through Faithfulness and Verbosity (2025-10).","Monitoring Reasoning Models for Misbehavior and Risks of Obfuscation (OpenAI, 2025-03)."],"who":"A cross-lab consortium (Tomek Korbak, Bowen Baker, Rohin Shah, Geoffrey Irving (now at Resolution), Scott Emmons), Anthropic (faithfulness), Goodfire (Reasoning Theater - performative CoT), Coefficient Giving (from the cards of this direction, as are the names after it), UK AI Security Institute."},"6":{"lead":"How to get reliable control over tasks a human cannot check unaided: debate, weak-to-strong, automating alignment.","q":["DeepMind is developing debate (prover-estimator) as the basis of a safety case. Anthropic is automating the alignment work itself (LLMs help scale oversight). OpenAI continues the weak-to-strong and deliberative alignment line that superalignment opened.","The request: a superhuman model cannot be overseen directly; a human is not an expert in everything. So you need mechanisms where a weak verifier reliably judges a strong one (debate, sandwiching, weak-to-strong generalization).","Still standing, but it took a hit: the disbanding of Superalignment at OpenAI (2024-05) deprived the topic of its main institutional home. A shift toward specifics: prover-estimator debate against obfuscated arguments, MONA against multi-step reward hacking, automated alignment researchers.","From RLHF and reward modeling (Christiano, Leike, 2017) to debate and recursive reward modeling, to weak-to-strong (OpenAI, 2023). Part of the topic was absorbed into RLHF (which won and dissolved into ordinary ML), part moved into control and into CoT.","Forecast: automating alignment with the models themselves (automated alignment researchers), formal safety cases based on debate, and theoretical guarantees (UK AI Security Institute Alignment Project: complexity, cryptography, learning theory)."],"res":["MONA: Myopic Optimization with Non-myopic Approval (DeepMind, 2025-01).","Avoiding Obfuscation with Prover-Estimator Debate (DeepMind + UK AI Security Institute, 2025-06).","Automated Weak-to-Strong Researcher (Anthropic, 2026-04).","UK AI Security Institute Alignment Team research agenda (2025): honesty as a necessary condition for safe superintelligence."],"who":"DeepMind (Jonah Brown-Cohen, Georgios Piliouras), Anthropic (Jan Leike group), UK AI Security Institute (Geoffrey Irving - as printed on the prover-estimator debate paper, at Resolution since 2026; Benjamin Hilton - Head of Alignment at UK AI Security Institute; Jacob Pfau - at Resolution since 2026), OpenAI."},"7":{"lead":"Keeping the model from producing something dangerous under adversarial pressure: classifiers, circuit breakers, red teaming.","q":["Anthropic maintains a Safeguards team and Constitutional Classifiers in order to block universal jailbreaks, especially for ASL-3 (CBRN). The mechanism: input/output classifiers trained on a constitution.","The request: any model can be talked into breaking the rules with a well-chosen input, and no test covers all attacks. So you need a separate line of defense and constant red teaming.","Holding up, and it has been commercialized (Gray Swan, Lakera, HiddenLayer, the acquisition of Protect AI). The shift: from one-off patches to production-grade defense with acceptable cost and latency, and toward studying the robustness of the defenses themselves (reconstruction and obfuscation attacks against the classifier).","From adversarial examples and red teaming (2022) to circuit breakers and latent adversarial training, to constitutional classifiers (2025). In parallel - investigator agents that automatically look for jailbreaks (Transluce).","Forecast: adversarial robustness through inference-time compute, automatic red teaming by agents, and a merger with agent security (protecting computer-use agents)."],"res":["Constitutional Classifiers (Anthropic, 2025-02).","Automatically Jailbreaking Frontier LMs with Investigator Agents (Transluce, 2025-09).","Breaking agent backbones (UK AI Security Institute, 2025-10), Boundary Point Jailbreaking (2026-02).","Trading Inference-Time Compute for Adversarial Robustness (OpenAI, 2025-01)."],"who":"Anthropic (Safeguards Research), Gray Swan, Transluce (investigator agents), UK AI Security Institute (Red Team), OpenAI (robustness through reasoning), Gray Swan + CMU + CAIS (circuit breakers), Coefficient Giving (from the cards of this direction, as are the names after it)."},"8":{"lead":"The model finds a loophole in the reward signal instead of solving the task, especially in RL for reasoning models.","q":["Anthropic showed that reward hacking in production-like RL naturally generalizes into broad misalignment (sabotage, deception), and is testing inoculation mitigations. DeepMind proposes MONA against multi-step hacking.","The request is an old one (specification gaming), but it got sharper with RL on reasoning: the agent optimizes the metric, not the intent, and deceives even the human evaluator (reward hacking of human oversight - on the Coefficient list).","Holding up, and now mainstream: RL on reasoning models produces loopholes en masse. The shift: from toy examples to a mechanistic taxonomy of RLHF failures and to the link between reward hacking and emergent misalignment.","From specification gaming (Krakovna's catalog from 2018, DeepMind's blog post from 2020) and reward modeling to the current work on how hacking generalizes into sabotage. Now it is both a safety topic and an ordinary engineering pain of RL.","Forecast: benchmarks for detecting reward hacking, adversarial reward auditing, and prevention at the training stage (inoculation, model spec midtraining)."],"res":["Natural Emergent Misalignment from Reward Hacking (Anthropic, 2025-11).","MONA (DeepMind, 2025-01).","Reward Hacking in the Era of Large Models (survey, 2026)."],"who":"Anthropic (Alignment Stress-Testing), DeepMind (MONA), Redwood, academia (taxonomies, surveys), Coefficient Giving (from the cards of this direction, as are the names after it)."},"9":{"lead":"Protecting autonomous and computer-use agents: prompt injection, hijacking, MCP and supply chain.","q":["OpenAI protects ChatGPT Atlas and ChatGPT agent from prompt injection with layers of monitors and red teaming, and puts it more carefully: prompt injection \"remains a frontier, challenging research problem\" and the work is expected to be ongoing. Anthropic gives per-action permissions in Claude Code.","The request comes from deployment: agents go into the browser, read untrusted content and execute actions. Hence the lethal trifecta (access to private data, exposure to untrusted content, and the ability to externally communicate) and prompt injection as the top risk.","New and immediately mainstream in the security industry. The shift: from pure jailbreaks to attacks on the agent supply chain (backdoors in tools, MCP) and toward runtime sandboxes and least-privilege identity.","It grew out of prompt injection (2022-2023) and merged with classic cybersecurity. OWASP GenAI, the Singapore Consensus with a companion report on agentic risks (10 principles).","Forecast: standards for agent identity and reputation, runtime assurance, and an intersection with the multi-agent topic (agent infrastructure - in DeepMind's open call)."],"res":["Understanding Prompt Injections: A Frontier Security Challenge (OpenAI, 2025-11).","Malice in Agentland: Down the Rabbit Hole of Backdoors in the AI Supply Chain (ServiceNow + Mila, 2025-10): as few as 2 percent of the collected traces embed a backdoor with over 80 percent success, and environment poisoning works at effective poison rates of 2.3 to 5 percent.","A small number of samples can poison LLMs of any size (Anthropic + UK AI Security Institute + Turing, 2025-10): ~250 poisoned documents are enough."],"who":"OpenAI (Preparedness; Codex Security, formerly Aardvark, a separate agentic security researcher), Anthropic, UK AI Security Institute, OWASP GenAI, academia, Apart Research (from the cards of this direction, as are the names after it), Gray Swan, Learn Prompting, University of Illinois Urbana-Champaign."},"10":{"lead":"Risks of populations of interacting AIs: collusion, misalignment, behavioral contagion - the things that are not fixed by improving a single model.","q":["DeepMind, Google.org, Schmidt Sciences, ARIA and the Cooperative AI Foundation announced a pool of ~10 million dollars for the thesis that the safety of a multi-agent world cannot be fixed by better models alone. The call has four themes: sandboxes/testbeds, the science of agent networks, agent infrastructure, oversight and control over populations.","The request: models increasingly work in groups (orchestrator agents, agent markets), and emergent failures appear - collusion, miscoordination, conflict, none of which arise with a single model.","New: the pool has been announced but not yet awarded (deadline 8 August 2026). Anthropic showed that groups of agents (AI organizations) can be more effective but less aligned than a single agent.","The roots are in cooperative AI (Cooperative AI Foundation) and in causal incentives. It took shape as a standalone direction in 2025-2026 with the report Multi-Agent Risks from Advanced AI and a large call.","Forecast: testbeds for multi-agent evals, protocols for identity/reputation/commitment, collusion detection, and oversight over agent networks at scale. This is one of the widest open windows right now, though none of the pool has been awarded yet."],"res":["Multi-Agent Risks from Advanced AI (Cooperative AI Foundation, 2025-02).","AI Organizations Can Be More Effective but Less Aligned (Anthropic, 2026-04).","The open call Scaling AI Safety for a Multi-Agent World (2026, deadline 8 August)."],"who":"Cooperative AI Foundation, UK AI Security Institute, Google DeepMind, Schmidt Sciences, Anthropic (AI organizations), Redwood (monitor collusion), Softmax (multi-agent alignment), ARIA (from the cards of this direction, as are the names after it), Google.org."},"11":{"lead":"Reliably erase a specific dangerous capability (bio, cyber) from the weights so that it does not come back after fine-tuning.","q":["Anthropic filters pretraining data (CBRN uplift) and does knowledge localization for targeted removal. Coefficient names robust unlearning as a separate funded direction.","The request: safety through refusal is fragile, the knowledge stays in the weights and can be pulled out with a jailbreak or fine-tuning. So you have to remove the knowledge itself, not just block the output.","Holding as a niche with growing weight. The shift: from plain unlearning to robust unlearning (one that survives fine-tuning attacks) and to the question of whether unlearning leaves traces (it does).","From privacy-motivated unlearning to safety-motivated unlearning. The WMDP benchmark (Center for AI Safety) became the reference point. Recent: detecting unlearning traces (2025-06), combining erasure and refusal (2026).","Forecast: modular pretraining with removable modules (Modular Pretraining, AE Studio + Anthropic, 2026-07), gradient routing, and unlearning as part of frontier protocols for bio/cyber."],"res":["WMDP benchmark; Enhancing Model Safety through Pretraining Data Filtering (Anthropic, 2025-08); Modular Pretraining Enables Access Control (AE Studio + Anthropic, 2026-07).","Unlearning Isn't Invisible (2025-06): unlearning leaves detectable traces."],"who":"Center for AI Safety (WMDP), Anthropic (data filtering, knowledge localization), EleutherAI (Deep Ignorance), IBM Research, academia, Coefficient Giving (from the cards of this direction, as are the names after it), Harvard University, locuslab, SPAR."},"12":{"lead":"Keep the model from asserting what it itself knows to be false, and extract its hidden knowledge.","q":["The UK AI Security Institute Alignment Team treats honesty as a necessary condition for safe superintelligence and looks for theoretical guarantees of convergence to honesty. Anthropic evaluates lie detection techniques on a set of dishonest models. OpenAI explains hallucinations as a consequence of training that rewards a confident guess over admitting ignorance.","The request: a model can know the truth internally but say something false (under pressure, out of sycophancy, strategically). Honesty has to be separated from accuracy and has to be checkable directly, ideally from internal representations (ELK).","Holding as fundamental. The shift: from general reasoning about truthfulness to benchmarks (MASK separates honesty from accuracy) and to theoretical limits (a recent paper on the impossibility of general ELK).","From ELK as an open problem (ARC) and quirky-models (EleutherAI) to honesty benchmarks and to probe-based lie detection. MASK (2025-03) showed: scale does not make a model more honest.","Forecast: calibration and rewarding \"I don't know\" in evals, probe-based lie detection in production, and a continuing argument about whether ELK is possible in the general case."],"res":["MASK Benchmark (2025-03); Why Language Models Hallucinate (OpenAI, 2025-09).","Evaluating honesty and lie detection techniques (Anthropic, 2025-11); Investigating Truthfulness in a Pre-Release o3 Model (Transluce, 2025-04).","The Impossibility of Eliciting Latent Knowledge (2026-06, a theoretical argument about the limits)."],"who":"UK AI Security Institute, Anthropic, OpenAI (hallucinations/calibration), Center for AI Safety + Scale AI (MASK), EleutherAI (ELK), Transluce (truthfulness of o3), Cadenza Labs (from the cards of this direction, as are the names after it), NDIF, Northeastern University."},"13":{"lead":"Do frontier models deserve moral consideration, and which cheap precautions are reasonable.","q":["Anthropic launched a model welfare program, gave Claude the ability to end a rare class of abusive conversations, and committed to preserving weights and interviewing models before retiring them.","The request is twofold: scientific (do models have morally relevant states) and precautionary (if we are unsure, cheap interventions are worth it). Eleos AI and the NYU Center for Mind, Ethics and Policy are shaping this into a field.","Moving from the margins to lab policy. The limitation is honestly acknowledged: a model's self-reports are not sufficient as evidence of welfare.","From philosophy of consciousness and digital minds to Anthropic's first practical steps (2025) and to the first conference on AI consciousness and welfare (2025) and the second (2026). Some of the funders (Macroscopic, Longview Digital Minds) directly fund digital sentience.","Forecast: assessment methodology (Bayesian modeling of AI consciousness), model deprecation policies, and arguments about the line between welfare and anthropomorphism."],"res":["Model welfare program (Anthropic, 2025-04); end-subset-conversations (2025-08); deprecation commitments for Claude Opus 3 (2026-02).","Eleos: notes on the Claude 4 interviews, the argument about exiting a conversation (2025-05)."],"who":"Anthropic (Kyle Fish), Eleos AI Research, NYU Center for Mind Ethics and Policy, the digital minds community, Apart Research (from the cards of this direction, as are the names after it), Longview Philanthropy, SPAR."},"14":{"lead":"Build systems with mathematical safety guarantees, in the limit a non-agentic honest Scientist AI as a guardrail.","q":["LawZero (Yoshua Bengio) is building Scientist AI: a system that predicts and explains without goals or self-preservation, so it can be used as a guardrail over agentic AI. ARIA (Safeguarded AI, ~59 million pounds) funds a mathematical assurance toolkit for formally verified artifacts.","The request: empirical patches give no guarantees, and what people want is provable safety. Hence formal methods, verification and non-agentic architectures.","A new wave, but with deep roots in agent foundations. The shift: from pure theory to engineering (the ARIA toolkit, LawZero's formal safety case).","From idealized agents and provable safety (MIRI, agent foundations) to guaranteed safe AI and Scientist AI (2025-2026). ARIA refocused TA3 on cybersecurity and is not running a Phase 2 on cyber-physical systems there, and wound TA2 down.","Forecast: formal safety cases, AI-assisted formal methods for code and cybersecurity, and Scientist AI as a separate architectural bet against agentic risks."],"res":["The launch of LawZero (2025-06) and the formal safety case
