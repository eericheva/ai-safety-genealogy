ised Guidance on Model Risk Management (Federal Reserve, OCC and FDIC, 2026-04): replaced SR 11-7 after fifteen years and put generative and agentic AI explicitly out of scope, leaving the fastest-moving category unsupervised by the main model-risk regime."],"who":"Financial Stability Board (chaired by Andrew Bailey; 2024 vulnerabilities report, October 2025 monitoring report, sound practices due to the G20 in October 2026), Bank of England's Financial Policy Committee and its AI Consortium (Financial Stability in Focus, April 2025; agentic-AI tasking of the Bank and FCA, March 2026), IMF (GFSR October 2024 chapter on AI in capital market activities), IOSCO (Supervisory Toolkit for AI Use in Capital Markets, FR/02/2026), the Federal Reserve with the OCC and the FDIC (SR 26-2, revised model risk guidance), Winston Wei Dou and Itay Goldstein at Wharton with Yan Ji (on autonomous algorithmic collusion among AI traders), Anthropic (Claude for Financial Services, with S&P Global, FactSet, Morningstar and PitchBook as data partners), ACM (from the cards of this direction, as are the names after it), Bank of Finland, Edinburgh Futures Institute, ESRB, European Central Bank, FINOS, Office of the Comptroller of the Currency, RiskLab, UK AI Security Institute."},"53":{"lead":"AI as both a load on the grid and a control layer inside it: data centers that shed hundreds of megawatts in milliseconds, and AI moving into the operation of critical infrastructure.","q":["The labs speak only to the supply side. Anthropic's Build AI in America (2025-07-21) states that \"Frontier AI model training requires continuous access to firm, reliable power sources\" and argues the US needs at least 50 GW of electric capacity by 2028, against more than 400 GW that China added in a single year. The post argues for capacity and says nothing about the reliability consequences of its own load shape. The grid operators wrote that part.","NERC treats AI data centers as a new class of load with unmodelled dynamics. Its Large Loads Task Force white paper (July 2025) documents the Eastern Interconnection event of 10 July 2024, where transmission faults caused roughly 1,500 MW of voltage-sensitive load, primarily data centers, to disconnect almost simultaneously and switch to backup power, briefly pushing system frequency to 60.053 Hz. ERCOT saw a comparable 1,500 MW event, and a separate NERC incident review of January 2026, drawing on ERCOT analysis of 26 crypto-mining facility events between January 2023 and September 2025, found losses of 17% to 95% of pre-disturbance consumption within milliseconds of a normally cleared fault. Training ramps reach 1.9 per unit per second over 250 milliseconds.","It holds up because it went from white paper to mandatory obligation within a year. NERC issued a rare Level 3 essential-actions alert on 4 May 2026, with seven required measures due 3 August 2026 covering modeling data, load composition, commissioning processes and dynamic fault recording; its previous Level 3 alert, about a year earlier, concerned inverter-based resource performance, the same failure shape in different hardware. FERC then ordered NERC on 16 July 2026 (docket RD26-7-000) to file mandatory reliability standards for computational loads by 31 December 2026. The shift: data centers stop being customers and become registered reliability entities.","Yes, on two tracks that only recently met. The demand track: IEA's Energy and AI (10 April 2025) put data centers at about 415 TWh in 2024, roughly 1.5% of global electricity, doubling to around 945 TWh by 2030. The applications track: EPRI's Open Power AI Consortium (20 March 2025) building open domain-specific models for the power sector with a sandbox to validate them before deployment. The reliability track that joins them starts with the July 2024 Virginia event and runs through the 2025 white paper to the 2026 alert and order.","Forecast: mandatory NERC standards and a registry for computational loads by the end of 2026, with a Phase II work plan due 1 March 2027; NIST's AI RMF profile for trustworthy AI in critical infrastructure (concept note 7 April 2026) generalising the frame past electricity to all critical-infrastructure sectors; and, on the applications side, the unresolved question of what validation an open power-sector model needs before it is allowed anywhere near operations."],"res":["Energy and AI (IEA, 2025-04): data centers at about 415 TWh in 2024 rising to roughly 945 TWh by 2030, while AI-based grid management could unlock up to 175 GW of transmission capacity without new lines, and cyberattacks on energy utilities have tripled in four years.","Characteristics and Risks of Emerging Large Loads (NERC Large Loads Task Force, 2025-07): the 10 July 2024 Eastern Interconnection event in which roughly 1,500 MW of mostly data-center load dropped near-simultaneously, plus AI ramp rates of 1.9 per unit per second over 250 milliseconds.","Level 3 essential-actions alert on large loads (NERC, 2026-05): seven mandatory measures by 3 August 2026 on modeling data, load composition, commissioning and dynamic fault recording, only the second Level 3 alert in about a year.","Order in docket RD26-7-000 (FERC, 2026-07): NERC directed to file mandatory reliability standards for computational loads by 31 December 2026, Rules of Procedure revisions including registry criteria for computational-load entities by the same date, and a Phase II work plan by 1 March 2027.","Open Power AI Consortium (EPRI with NVIDIA, 2025-03): open domain-specific models and datasets for the power sector plus a sandbox for validating AI applications before they reach operations.","Concept note on an AI RMF Profile for Trustworthy AI in Critical Infrastructure (NIST, 2026-04): a cross-sector profile for infrastructure operators procuring AI capabilities, extending the frame past electricity into the rest of critical infrastructure."],"who":"NERC's Large Loads Working Group and Large Loads Action Plan (the group was the Large Loads Task Force until it was upgraded in 2026, and authored the 2025 white paper; Level 3 essential-actions alert of May 2026), FERC (under Chairman Laura Swett, with Commissioners David Rosner, Lindsay See, Judy W. Chang and David A. LaCerte; order RD26-7-000 directing mandatory standards for computational loads), IEA (Fatih Birol, Executive Director; Energy and AI, April 2025), EPRI's Open Power AI Consortium (Arshad Mansoor, EPRI President and CEO, with NVIDIA, Microsoft, AWS, Oracle, Linux Foundation Energy and utilities including Duke Energy, Southern Company, PG&E, Exelon and Con Edison), NIST (Raymond Sheh and Martin Stanley, named on the April 2026 concept note that launched the AI RMF profile for trustworthy AI in critical infrastructure), Anthropic on the demand side (Build AI in America), UK AI Security Institute (from the cards of this direction, as are the names after it)."},"54":{"lead":"Safety of AI where the user is a minor and the product is cognition: learning that degrades when the model does the work, and companion-style harm at the age where it lands hardest.","q":["OpenAI shipped study mode on 29 July 2025, asking its own question out loud: \"how do we ensure it is used to support real learning, and doesn't just offer solutions without helping students make sense of them?\" On teen users Sam Altman was blunter on 16 September 2025: \"We prioritize safety ahead of privacy and freedom for teens; this is a new and powerful technology, and we believe minors need significant protection.\" Anthropic launched a free Claude for Teachers tier for US K-12 on 14 July 2026, with education lead Drew Bent describing, in a Chalkbeat interview, lesson plans built from a student's past assessment data, while keeping under-18 students off Claude entirely.","Education research frames it as the gap between performance and learning. In a randomised trial with about 1,000 students at a Turkish high school (Bastani, Bastani, Sungu and colleagues, University of Pennsylvania, 2024), unrestricted GPT-4 raised performance 48% during assisted practice and a tutor-style version raised it 127%, but on the unaided exam the unrestricted group scored 17% below control while the tutor-style group was indistinguishable from it. UNESCO framed the same thing as a governance vacuum on 7 September 2023: fewer than 10% of surveyed institutions had any formal guidance, and it set an age floor of 13 for classroom use.","It holds because both signs are now measured. Structured and supervised, the effect is large: a six-week after-school pilot in Nigeria (World Bank Policy Research Working Paper 11125, May 2025) produced 0.31 standard deviations overall, which the authors equate to 1.5 to 2 years of business-as-usual schooling. Unsupervised, the exposure is broad but not universal: 72% of US 13-to-17-year-olds have used AI companions, 52% use them regularly and 28% have never tried them, and about a third of those users have discussed something important with AI rather than a person (Common Sense Media, 16 July 2025). The shift is from academic-integrity policy to child-safety regulation.","Yes, and it turns sharply. First the pedagogy layer: UNESCO's guidance for generative AI in education and research (September 2023) and its AI competency frameworks for students and teachers (2024). Then the product layer: Claude for Education with Learning Mode for higher-education institutions (April 2025), study mode (OpenAI, July 2025). Then enforcement: the FTC's 6(b) orders of 11 September 2025 to Alphabet, Character Technologies, Instagram, Meta, OpenAI, Snap and X.AI, and Character.AI removing open-ended chat for under-18s, announced for 25 November 2025 and begun the day before.","Forecast: age assurance as infrastructure, with OpenAI's behavioural age prediction and Character.AI's in-house model plus Persona, and the independent AI Safety Lab for AI entertainment that Character.AI said it would fund. Underneath sits the question the FTC asked and nobody has answered publicly, how companies \"measure, test, and monitor for negative impacts before and after deployment\" for minors, arguably the same evaluation problem this vertical shares with medicine."],"res":["Generative AI Can Harm Learning (Bastani, Bastani, Sungu and colleagues, University of Pennsylvania, 2024-07; published in PNAS 122(26), 2025, as Generative AI without guardrails can harm learning: Evidence from high school mathematics): about 1,000 Turkish high-school students; unrestricted GPT-4 raised practice performance 48% but cut unaided exam scores 17% below control, while a tutor-style version left them unchanged.","From Chalkboards to Chatbots (World Bank Policy Research Working Paper 11125, 2025-05): a six-week after-school pilot in Nigeria tutoring English through Microsoft Copilot, powered by GPT-4 at the time, produced 0.31 standard deviations overall and 0.23 for English, which the authors equate to 1.5 to 2 years of business-as-usual schooling.","National survey of teens and AI companions (Common Sense Media, 2025-07): 72% of US 13-to-17-year-olds have used AI companions, about a third of those users have discussed something important with AI instead of a person, and half of all teens surveyed say they do not trust its advice.","6(b) orders on AI companion chatbots (US FTC, 2025-09): Alphabet, Character Technologies, Instagram, Meta, OpenAI, Snap and X.AI ordered to disclose how they measure, test and monitor negative impacts on minors before and after deployment.","Guidance for generative AI in education and research (UNESCO, 2023-09): an age floor of 13 for independent conversations with generative-AI platforms, issued when fewer than 10% of the more than 450 schools and universities surveyed had any formal policy at all.","Removal of open-ended chat for under-18s (Character.AI, 2025-10): the teen cap went from two hours a day down to one, and removal began 24 November 2025 in the US and rolled out in waves against an announced date of 25 November, with in-house plus third-party age assurance and a funded independent AI Safety Lab."],"who":"UNESCO (Audrey Azoulay, Director-General at the time of the 2023 guidance for generative AI in education and research and the 2024 AI competency frameworks for students and teachers), OpenAI (Leah Belsky, vice president and general manager of education, on the study mode of July 2025), Sam Altman on the teen-safety principles of September 2025, Anthropic (Claude for Education and the free Claude for Teachers tier of July 2026), US Federal Trade Commission under Chairman Andrew N. Ferguson (with Alysa Bernstein and Erik Jones leading the 6(b) study of AI companions), Common Sense Media (James P. Steyer, founder and CEO; Robbie Torney on AI risk assessments for teens), Character.AI (under-18 restrictions, age assurance with Persona, and a funded independent AI Safety Lab), Hamsa Bastani with Osbert Bastani and Alp Sungu at the University of Pennsylvania (on measured learning harm), World Bank education economists behind the Nigeria trial (Martín De Simone and colleagues), SPAR (from the cards of this direction, as are the names after it)."}};
const moneyNotes={"1":"[S] UK AISI Alignment Project, Interpretability (theme 8 of 11) - $3.29M total for the whole period (2025), the term is not published, a 1/11 share of the pool; Coefficient Giving TAIS RFP, Model Transparency cluster (7 of 21 areas) - up to $13.33M one-off (2025), a 7/21 share of the pool. [E] Anthropic+DeepMind interp ~$30-80M/yr. Left out: no share attributable to this row, the window closed too long ago, valuation.","2":"[S] Redwood Research, FY2024 total expenses (IRS filing, via ITBB) - $2.9M a year (FY2024); Coefficient Giving TAIS RFP, 'Control evaluations' (area 2, Adversarial ML cluster) - up to $1.9M one-off (2025), a 1/21 share of the pool. [E] Redwood + lab teams ~$10-25M/yr. Left out: counted under another row, no share attributable to this row, announced but not disbursed.","3":"[S] Frontier Model Forum AI Safety Fund, lifetime fund size - $10.0M total for the whole period (2023), the term is not published; Schmidt Sciences AI Safety Science Program - $10.0M total for the whole period (2025), the term is not published. [E] METR + internal evals ~$50M+/yr. Left out: no share attributable to this row, an organisation's whole budget.","4":"[S] Coefficient Giving TAIS RFP, 'Experiments on alignment faking' (area 6, Sophisticated Misbehavior cluster) - up to $1.9M one-off (2025), a 1/21 share of the pool. [E] Apollo + lab teams ~$15-30M/yr. Left out: no share attributable to this row.","5":"[S] Coefficient Giving TAIS RFP, 'Encoded reasoning in chain-of-thought and inter-model communication' (area 7) - up to $1.9M one-off (2025), a 1/21 share of the pool. [E] cross-lab ~$5-15M/yr. Left out: no share attributable to this row.","6":"[S] UK AISI Alignment Project, 'Methods for Post-training and Elicitation' area of the first-round pool - $3.29M total for the whole period (2025), the term is not published, a 1/11 share of the pool. [E] labs ~$10-25M/yr. Left out: counted under another row, no share attributable to this row, parent-field budget, the window closed too long ago.","7":"[E] ~$50M+/yr with commercial. Left out: acquisition price, counted under another row, no share attributable to this row, parent-field budget, the window closed too long ago, valuation.","8":"[S] Coefficient Giving TAIS RFP, 'Reward hacking of human oversight' (area 10) - up to $1.9M one-off (2025), a 1/21 share of the pool. [E] RL teams ~$5-15M/yr. Left out: no share attributable to this row.","9":"[E] this is capital and acquisition value, not annual research spend. OWASP + labs + industry ~$100M+/yr. Left out: acquisition price, no share attributable to this row, valuation.","10":"[S] Cooperative AI Foundation, 22 itemized grants rolled up across four currencies - $4.7M total for the whole period (2021-2027), the term is not published; Macroscopic Ventures commitment to the Foundations of Cooperative AI Lab (FOCAL), CMU - $3.0M total for the whole period, the term is not published. [E] ~$5-15M/yr. Left out: no share attributable to this row, the window closed too long ago, announced but not disbursed.","11":"[S] Coefficient Giving TAIS RFP, 'Robust unlearning' (area 5, Adversarial ML cluster) - up to $1.9M one-off (2025), a 1/21 share of the pool. [E] ~$10-20M/yr. Left out: no share attributable to this row.","12":"[E] ~$5-10M/yr. Left out: no share attributable to this row, parent-field budget.","13":"[E] Longview Digital Minds RFP and Macroscopic, neither of which publishes a figure for this line (Macroscopic's digital-minds allocation is undisclosed). Anthropic (Kyle Fish, small team) ~$1-3M/yr. Left out: no share attributable to this row.","14":"[S] ARIA Safeguarded AI program envelope, net of the canceled TA2 Phase 2 - $13.74M a year (2024); NSF Safe Learning-Enabled Systems, 2023 inaugural cohort - $10.9M total for the whole period (2023), the term is not published; LawZero launch raise - $30.0M one-off (2025). Left out: no share attributable to this row, announced but not disbursed.","15":"[E] small dedicated ~$2-5M/yr. Left out: no share attributable to this row, parent-field budget.","16":"[E] security ~$10-30M/yr. Left out: counted under another row, no share attributable to this row.","17":"[S] Centre for the Governance of AI (GovAI), total expenses 2025 - $11.9M a year (2025). [E] GovAI publishes $11.9M of total expenses for 2025 and is the only body on this row that publishes an annual figure at all. Coefficient Giving's AI-governance RFP is known as per-grant sizes of $200k to $2M a year with no program total, its historical governance series is explicitly multi-year, and IAPS publishes no budget. The middle counts the policy staff that labs, foundations and institutes do not break out by function, and it is a guess of that shape rather than a sum. Left out: no share attributable to this row, parent-field budget.","18":"[E] <$2M/yr. Left out: no share attributable to this row, an organisation's whole budget.","19":"[E] UK AISI has a Human Influence research area but publishes no budget for it (the same area is cited under direction 49). product + safety ~$5-15M/yr. Left out: no share attributable to this row, an organisation's whole budget.","20":"[S] Forecasting Research Institute, FY2024 total expenses (Form 990, EIN 92-0693558) - $2.29M a year (FY2024); SFF-2025, AI Futures Project - $2.04M one-off (2025); SFF-2025, Metaculus - $0.75M one-off (2025); SFF-2025, Sage Future - $0.17M one-off (2025). [E] ~$4M/yr. The topic lives on forums, not arXiv. Left out: no share attributable to this row, the window closed too long ago, announced but not disbursed, an organisation's whole budget.","21":"[S] SFF-2025, PIBBSS (now Principles of Intelligence) - $1.01M one-off (2025); SFF-2025, Topos Institute - $0.22M one-off (2025); SFF-2025, Timaeus Research - $0.28M one-off (2025). [E] The Survival and Flourishing Fund's 2025 round is the whole of the attributable money: $1.01M to PIBBSS, now Principles of Intelligence, $0.28M to Timaeus and $0.22M to Topos. That is a one-off recommendation and not an annual budget, its matching pledges are not counted because they were never disbursed, and MIRI's $1.61M from the same round is a whole-organization grant. About $1M a year is what is left once those are set aside. Left out: no share attributable to this row, the window closed too long ago, announced but not disbursed, no public source, an organisation's whole budget.","22":"[S] SFF-2025, SecureDNA - $1.5M one-off (2025); SFF-2025, SecureBio - $0.75M one-off (2025). [E] The attributable grants are small and known: $1.5M to SecureDNA and $0.75M to SecureBio, both from SFF-2025. Everything larger is set aside for a stated reason. Coefficient Giving's biosecurity RFP of over $100M a year is parent-field money, SecureBio's $4.25M of FY2024 expenses is a whole-organization budget, and the Frontier Model Forum's AI Safety Fund rounds are topic-general. The middle stands for state biodefense spending whose AI slice no agency publishes. Left out: counted under another row, no share attributable to this row, parent-field budget, valuation, an organisation's whole budget.","23":"[E] no published figure: the Coefficient RFP has no post-training area, and \"the core of post-training at every lab\" is product-function spend rather than research funding ~$100M+/yr. Left out: counted under another row, no share attributable to this row, parent-field budget.","24":"[S] SFF-2025, Meaning Alignment Institute - $0.15M one-off (2025). [E] $0.15M to the Meaning Alignment Institute from SFF-2025 is the only attributable grant. The value-learning line in this project's own genealogy dataset itemizes $6.4M for 2015 to 2018, about $1.6M a year, but that window closes in 2018 and 87% of it is one CHAI founding grant in the parent field. Collective Constitutional AI is an Anthropic research project rather than a funder. Left out: no share attributable to this row, parent-field budget, the window closed too long ago.","25":"[E] Coefficient's published areas include robust unlearning but not tamper-resistance as a line, and Deep Ignorance is a paper, not a funder; no attributable figure. ~$3-8M/yr. Left out: counted under another row, no share attributable to this row, parent-field budget.","26":"[E] no attributable funding found, <$3M/yr. Left out: no share attributable to this row.","27":"[E] Coefficient's Navigating Transformative AI fund publishes no values line, and the $1M+ figure carries no period. small but hot. Left out: no share attributable to this row, parent-field budget.","28":"[S] Coefficient Giving TAIS RFP, area 7 'Encoded reasoning in chain-of-thought and inter-model communication' - up to $1.9M one-off (2025), a 1/21 share of the pool, the same money is counted under row 5. [E] $1.9M is the arithmetic share of Coefficient Giving's TAIS RFP: one of 21 published areas in a $40M pool with no per-area allocation, over a one-time five-month window rather than a yearly rate. No other funder names this topic, so the middle is that share carried forward and nothing else. Left out: no share attributable to this row.","29":"[S] Coefficient Giving TAIS RFP, area 5 'Robust unlearning' as it bears on memorization - up to $1.9M one-off (2025), a 1/21 share of the pool, the same money is counted under row 11. [E] $1.9M is the same arithmetic share of Coefficient Giving's TAIS RFP, for robust unlearning as it bears on memorization, and it is one-off. NSF's SaTC program publishes $60M a year, but that is the budget for all US academic security and privacy research rather than a memorization line. The middle is corporate privacy engineering, which no company reports apart from its legal and compliance spend. Left out: no share attributable to this row, parent-field budget.","30":"[E] the fairness/bias literature is large and mostly outside safety funds, so this band measures the field and not safety money: NSF publishes no fairness/bias program line, FAccT is a conference and cannot publish a funding figure, and none of this row's own cards - Stanford HAI's 2026 seed grants, the Humane Intelligence bias bounty, two Turing Institute groups - names an amount. Left out: no share attributable to this row, parent-field budget.","31":"[E] C2PA coalition (Adobe/MS/Google) and DeepMind SynthID are industry programs that publish no budget; this is compliance and product spend, not research funding. mid. Left out: compliance spend, no share attributable to this row.","32":"[S] Foresight Institute grant pool, 'AI for Science & Epistemics' focus area - $0.43M a year, a 1/7 share of the pool. [E] Foresight publishes two different figures itself - ~$3M/yr in total across 7 focus areas, and $4.5-5.5M/yr for AI safety specifically (the same pool is cited under directions 37 and 41); Coefficient Giving (formerly OpenPhil) AI-for-epistemics - a few $M, no published line. small. Left out: no share attributable to this row, announced but not disbursed.","33":"[S] UK AISI Systemic AI Safety program, phase one (GBP 4M, 20 seed grants awarded 3 Apr 2025) - up to $5.36M a year (2025). [E] Phase one of the UK AISI Systemic AI Safety program is the one published figure: GBP 4M, or $5.36M, across 20 seed grants awarded on 3 April 2025. The GBP 8.5M across-phases total contains that phase already and the rest of it is not awarded, Singapore's Digital Trust Centre S$50M is a one-time endowment for a whole center dated 2022, and the OECD is cited with no figure at all. Left out: no share attributable to this row, announced but not disbursed, an organisation's whole budget.","34":"[E] an emerging field with no published figure. internal lab spend inside RSP/Preparedness, which neither company discloses and which also underpins several other rows here, mid. Left out: no share attributable to this row, an organisation's whole budget.","35":"[S] FLI 'How to mitigate AI-driven power concentration' program, awarded total - up to $4.0M one-off (2024). [E] FLI awarded $4M across 13 projects in its program on mitigating AI-driven power concentration, and that is a ceiling announced for a multi-round program rather than a yearly rate; its term is not published, so the map does not divide it. Longview's RFP gives a per-grant range of $100k to $2M a year and no program size, and its call closed with no awards published. The middle is a guess at the yearly rate the two of them imply. Left out: no share attributable to this row, announced but not disbursed.","36":"[E] The one quantified line near this row is NSF's Safe Learning-Enabled Systems, $10.9M across 11 projects in 2023, and it is counted on another row. NSF's Foundational Research in Robotics publishes no funding total and no embodied-safety line, so it sizes nothing. The middle is robotics-safety work inside academic groups and standards bodies, which publish papers rather than budgets. Left out: counted under another row, no share attributable to this row, parent-field budget.","37":"[S] Center for Reducing Suffering, historical yearly operating budget - $0.13M a year (2025); Center on Long-Term Risk, SFF-2025 recommendation (received) - $0.2M one-off (2025). [E] Two figures are on record and both are small: the Center for Reducing Suffering's historical yearly operating budget of $0.13M, and $0.2M to the Center on Long-Term Risk from the SFF-2025 round. CRS's expected $200k for next year and CLR's $400k fundraising target are money asked for rather than received, and the Foresight and CAIF grants for spitefulness research name no amount. About $1M a year is the whole dedicated field. Left out: no share attributable to this row, announced but not disbursed.","38":"[E] No figure for the safety slice is published anywhere on this row. Concordia AI gives no budget, revenue or expense line in any of its 2025 reports. Shanghai AI Lab's budget is capability money whose safety part is not broken out, and the city's US$13.8bn AI and semiconductor fund-of-funds with its RMB 600M compute vouchers is parent-field money at a scale that says nothing about safety. The middle is a guess at state and lab safety staffing in China. Left out: no share attributable to this row, parent-field budget.","39":"[E] commercial (bigtech internal + startups), large - no public figures: the only quantities in this space are venture rounds and acquisition prices (Lakera $20M Series A, Protect AI bought by Palo Alto Networks at an undisclosed price), that is capital and valuation, not annual research spend. Left out: acquisition price, compliance spend, no share attributable to this row, valuation.","40":"[S] SafeBench prize purse (CAIS, funded by Schmidt Sciences), 7 of the 8 prizes - $0.23M one-off (2025), a 23/25 share of the pool; UK AISI Alignment Project, 'Benchmark Design and Evaluation' area of the first-round pool - $3.29M total for the whole period (2025), the term is not published, a 1/11 share of the pool. [E] $3.52M is on record: $3.29M of the UK AISI Alignment Project's first-round pool for benchmark design and evaluation, and $0.23M of the SafeBench prize purse. Both are one-off, since AISI publishes per-project durations but no pool term, and SafeBench announced no second running. The middle adds the benchmark work done inside labs and inside MLCommons, which is staff time nobody bills as a grant. Left out: counted under another row, no share attributable to this row.","41":"[S] SFF-2025, ALTER (Association for Long Term Existence and Resilience) - $0.08M one-off (2025); SFF-2025, Meaning Alignment Institute - $0.15M one-off (2025), the same money is counted under row 24; Manifund, moral-graph-elicitation project (Meaning Alignment Institute) - $0.01M one-off. [E] small (self-other overlap: only a handful of real AI papers). AE Studio funds its alignment work from consulting profit and publishes no figure, Astera/Byrnes; ALTER/Kosoy combine that SFF grant with contract revenue; Foresight's ~$3M/yr covers 7 focus areas of which only some are AI safety. Left out: counted under another row, no share attributable to this row.","42":"[E] a large literature on diffusion and deepfake safety, but no named funding program and no attributable figure - the size here is bibliometric, not financial. mid to large. Left out: no share attributable to this row, parent-field budget.","43":"[S] Alignment Research Center (ARC), FY2024 total expenses (IRS Form 990, EIN 86-3605182) - $9.05M a year (FY2024); UK AISI Alignment Project, the four formal-theoretic areas of the first-round pool - $13.16M total for the whole period (2025), the term is not published, a 4/11 share of the pool. [E] Two figures carry this row: ARC's FY2024 expenses of $9.05M from its Form 990, a whole year of an organization that has been wholly theoretical since METR spun out, and $13.16M of the UK AISI Alignment Project's first-round pool across its four formal-theoretic areas. The pool publishes no term, so it is not divided into a yearly rate, and the middle is what those two suggest for a year of the field. Left out: counted under another row, no share attributable to this row.","44":"[S] SafeBench second prize for the Situational Awareness Dataset (SAD) - $0.02M one-off (2025), a 2/25 share of the pool. [E] $0.02M, the SafeBench second prize for the Situational Awareness Dataset, is the only dollar figure attached to this row, and the other seven prizes in the same purse are counted under benchmarks. Whatever funded that work and the rest of the surprising-phenomena literature was never published, so the middle is a guess at the size of a literature rather than a sum of grants (count inflated by autopilots). Left out: counted under another row, no share attributable to this row.","45":"[S] OpenAI AI-and-Mental-Health research grants pool - up to $2.0M one-off (2025); OpenAI EMEA Youth & Wellbeing Grant - $0.57M one-off (2026). [E] OpenAI's two published grant programs are what is on record: a $2M pool for AI-and-mental-health research and $0.57M of EMEA youth and wellbeing grants. Its internal product-safety spend on crisis routing, age prediction and parental controls is disclosed in no dollars anywhere and is what this band is meant to capture, while regulation drives company compliance cost rather than research funding. Left out: compliance spend, no share attributable to this row.","46":"[S] NIST CAISI (formerly the US AI Safety Institute), FY2026 enacted appropriation - $10.0M a year (FY2026). [E] ISO/NIST (state) + a commercial audit market that nobody has quantified. mid to large. ~$15M/yr in total (an outside estimate; NIST's own justification calls the base $11M). Left out: compliance spend, no share attributable to this row, announced but not disbursed.","48":"[S] UK AISI Alignment Project, 'Economic Theory and Game Theory' area of the first-round pool - $3.29M total for the whole period (2025), the term is not published, a 1/11 share of the pool; Manifund, postdoc on verification protocols for frontier AI training (ZK proofs of training properties) - $0.05M one-off (2026); Manifund, token taxes against AI-driven power concentration - $0.05M one-off (2026). [E] academia with no attributable figure plus two Manifund grants of $50,000 each, small. mechanism and information design appears as the theme of individual AISI Alignment Project grants, not as a published track; the cohort's 60 grants run 50k-1M GBP, so ~450k GBP is the average 27M/60 rather than a per-project figure - and 450k GBP is ~$0.6M for a single grant, not the row total. Left out: no share attributable to this row.","49":"[E] AISI has a Human Influence research area but publishes no budget for it (the same area is cited under direction 19). small to mid, no figure available. Left out: counted under another row, no share attributable to this row.","50":"[E] money is not split out for this vertical: the former Safety in verticals row carried $150M/yr, and that figure could not be tied to any published source - it mixes the scale of the applied domain with a safety slice nobody publishes. Left out: compliance spend, counted under another row, no share attributable to this row, parent-field budget.","51":"[E] money is not split out for this vertical: the former Safety in verticals row carried $150M/yr, and that figure could not be tied to any published source - it mixes the scale of the applied domain with a safety slice nobody publishes. The lines belonging to this vertical are NHTSA research appropriations for automated driving systems ($8.17M executed in FY2023, $7.0M requested for FY2025), 18-21x smaller. These are not the only amounts under the old row: the cards of the verticals also carry the European SUNRISE project (about EUR 13,087,426) and the British AI2 (GBP 2 million); neither entered the ledger because they are project budgets rather than funding for the direction. Left out: no share attributable to this row, parent-field budget, the window closed too long ago, announced but not disbursed.","52":"[E] money is not split out for this vertical: the former Safety in verticals row carried $150M/yr, and that figure could not be tied to any published source - it mixes the scale of the applied domain with a safety slice nobody publishes. Left out: compliance spend, counted under another row, no share attributable to this row, parent-field budget.","53":"[E] money is not split out for this vertical: the former Safety in verticals row carried $150M/yr, and that figure could not be tied to any published source - it mixes the scale of the applied domain with a safety slice nobody publishes. Left out: compliance spend, counted under another row, no share attributable to this row, parent-field budget.","54":"[E] money is not split out for this vertical: the former Safety in verticals row carried $150M/yr, and that figure could not be tied to any published source - it mixes the scale of the applied domain with a safety slice nobody publishes. Left out: counted under another row, no share attributable to this row, parent-field budget."};

const uiText={"title":"AI Safety Genealogy: Mid-2026 - demand metrics","h1":"AI Safety Genealogy: Mid-2026 - demand metrics","sub":"What is actually on the frontier in AI safety: 53 directions, each with two honest demand metrics - money and citations. The frontier here is not an opinion but three converging signals: 2025-to-2026 acceleration, citation intensity and the size of the money. Citations: real numbers from Semantic Scholar (papers 2024-2026, snapshot 3 August 2026). Money: one composition instead of two modes - the sourced run-rate with names on it, plus the residual estimate no disclosure regime reaches. Hover anything.","theme":"Theme","tAuto":"auto","tLight":"light","tDark":"dark","hTags":"Tags and directions: what the work actually is","sTags":"tags","sDirs":"directions (colored by their first tag)","reset":"reset","hC1":"Money against attention, moving through the years","hC2":"The same thing, but the bands are tags","hT1":"All 53 directions","hT2":"The same table, grouped by tag","cName":"direction","cTags":"tags","cMoney":"money [E]","cMoneyS":"money [S] paid","cPapers":"papers","cTop":"top cite","cInten":"cites/paper","cYears":"by year","cGrow":"x25 to 26","cTrend":"trend","few":"sparse","tiles":["directions on the map","papers 2024-2026 (S2, upper bound: head-measured 10,730 survive; stratified recount 12 Aug: 8,784)","topics in explosive growth","fastest acceleration"],"dirs":"directions","money":"Money, sourced + residual","perYear":"a year","legTrack":"track 2024 - 2025 - 2026","legSize":"2026 dot size - cites per paper","legHollow":"hollow dot - annualized 2026 pace","legDash":"dashed track - polysemous key, volume inflated","axt":"papers per year (log scale): 2024, 2025, 2026, hollow dot is the annualized 2026 pace","kYears":"papers by year:","kAnn":"2026 annualized:","kTot":"total 2024-2026:","kNoisy":" (upper bound, the key is polysemous)","kInten":"cites/paper:","kTrend":"trend:","kForum":"the topic lives on forums, S2 barely sees it","kTags":"tags:","kMoney":"money [E]:","src":"[S] source:","est":"[E] estimate:","both":"[S]/[E]:","mkNoisy":"polysemous key: volume inflated by an adjacent sense","mkNarrow":"key narrowed to AI/safety and recounted: the paper count here is a lower bound, not a measurement","mkForum":"the topic lives on forums, Semantic Scholar barely sees it","hTk":"Tasks inside a direction","tkHint":"Pick a direction above to see the tasks inside it.","tkN":"tasks","fOrg":"institution","fAuthor":"author","fMentor":"mentor","fDir":"direction","fDates":"dates","notStated":"not stated in the source","qsHead":"5 questions about the direction","qsLabs":["Why this topic, in the labs’ own words","How the field the request came from explains it","Why it holds and how it changed","Does the topic have a history","Where the topic goes next"],"qWho":"Who works on it right now","qRes":"Results","closeAll":"close all","closeOne":"close","tipOpen":"Click the row to open them below","tipClose":"Click the row to close the list","kConf":"confirmed by a source:","confNone":"nothing found, the band is entirely an estimate","confNoAnn":"nothing annual","confPlus":"plus one-off and multi-year","mkNoConf":"no confirmed money was found for this direction: the band is entirely an estimate","stChecked":"page read on","notCounted":"not counted","srcs":"[S] sources:","confCeil":"plus announced up to","confOnlyCeil":"nothing awarded, only announced up to","mkOnlyCeil":"no awarded money was found for this direction: the source names only an announced program ceiling","kKey":"counted with the phrase:","kTopPaper":"the paper it puts first:","kNoisyWhy":"that paper is about something else, which is why this row is marked *","moneyS":"Money [S] paid","kMoneyS":"paid, sourced:","notSourced":"not sourced","mToggle":"Money","mAll":"all (E+S)","mSourced":"sourced only (S)","upTo":"up to","oneOff":"one-off","legMoney":"money composition ($M, log): the solid head is the sourced annual run-rate - money with names on it - and the pale band is the row's own estimate range; the gap between them is the residual that no disclosure regime reaches, mostly lab payroll","hCost":"The cost of a paper, and of a citation: 2015-2026","cRowMoney":"Grant money per year","cRowPapers":"Papers per year","cRowPPaper":"Dollars per paper of that year","cRowPCite":"Dollars per citation those papers gathered","cTickLab":"tick - as the registry records it","cHollowLab":"hollow dot - citations still arriving","cKAnnounced":"as recorded","cKRange":"range","cPartial":"incomplete year","hCDir":"What a dollar is, and what it buys, direction by direction","cdWhat":"read as","cdUnit":"unit","cdMoney":"money","cdPaper":"per paper","cdCite":"per citation","cdAnnual":"annual, $/year","cdOneoff":"one-off, $","cdPaid":"paid","cdAwarded":"awarded","cdPromised":"promised","cdZeroPaid":"hollow ring at the axis - nothing paid","cdRecords":"the records behind it","cdNoRec":"no record in this unit","cdRest":"directions with nothing in this unit, in any status","cdDen":"denominator","cdPace":"papers a year (2026 pace)","cdPapers":"papers 2024-2026","cdCites":"citations, every paper","cdNoisyWarn":"the key is polysemous, so the paper count is an upper bound and this price is a lower one - and the star is not the whole story: keys that carry no star were measured too, and eleven of them fall below 0.5, and four are dirtier than half the starred ones","hCoh":"The price of a year, and why only one of the three is a price","cohWhat":"read as","cohPaper":"per paper","cohCite":"per citation","cohLayers":"layers: registry, directions, plus infrastructure","cohMature":"a mature cohort - this is a price","cohMoving":"a ceiling, and it will fall for years","cohNone":"not a price: a seven-month snapshot","cohPapers":"papers","cohCites":"citations to date","hTrk":"Through the years: money, the price of a paper and the price of a citation","trkWhat":"on the horizontal","trkGroup":"a row is","trkMoney":"money of the year","trkPaper":"price of a paper","trkCite":"price of a citation","trkDir":"a direction","trkTag":"a tag","trkEarly":"earlier year","trkLate":"one plot per row: years across, value up","trkHollow":"hollow - a cohort younger than 18 months: a ceiling, not a price","trkColor":"the row takes its color from its tag, as everywhere on this page","trkOf":"the numbers behind it","trkImmature":"the cohort is immature, so this is a ceiling","trkNone":"nothing here has both money and a denominator in at least two years","cdSrc":"source of the money","cdSrcReg":"the map registry, 48 records","cdSrcAtt":"attributed grants 2024-26, 1,853 of them","cdDenRaw":"papers as counted","cdDenEff":"effective: corrected for the key precision","cdEffNote":"of which effective, at the measured precision of its key","foot":"Markers beside a name: <b>*</b> the key is polysemous, so the paper count is an upper bound - 20 rows. <b>[f]</b> the topic lives in forum essays and citation counts barely see it - 5 rows. <b>&deg;</b> nothing confirmed by a source: the band is entirely an estimate - 33 rows. How every layer was built is in the repository: docs/method.md and docs/dashboard_notes.md.","btnTable":"table","btnBack":"back to the charts","tblOf":"the table behind","trkScale":"vertical scale","trkScaleRowS":"its own, per row","trkScaleSharedS":"shared by every row","trkScaleRow":"each row on its own scale: the shape of a row is readable, the height of one row against another is not","trkScaleShared":"one scale on every row, log","trkLayout":"shape of the chart","layGrid":"a plot per row","layLines":"all on one axis","layIndex":"indexed to the first year","layHeat":"a heat grid","layGridWhy":"each row on its own scale: the shape of a row is readable, the height of one row against another is not","layLinesWhy":"every row on one logarithmic axis: height is the level, slope is the rate, and two parallel lines grew at the same rate whatever their level","layIndexWhy":"every row starts at 100 in its first year: level is gone on purpose, so what is left is the rate alone and rows that began far apart can be compared","layHeatWhy":"one cell per year, color by value on a logarithmic ramp from cold to red: no shape, but the whole grid at once - a row reads as a history, a column as a year across the field, and an empty cell means no money at all that year","heatLow":"least","heatHigh":"most","idxBase":"first year = 100","hM2":"What the August campaign added, and where the data stops","m2Status":"three statuses by year","m2Org":"what an organization pays for its own output","m2Lab":"the labs, where no budget is published","m2Eu":"the EU tender that gave one direction its first money","m2Floors":"the floors: below these, public money does not exist","m2Paid":"paid","m2Awarded":"awarded on top","m2Promised":"promised","m2Skip":"not counted twice","m2SkipWhy":"grants that two funder ledgers both list, held out by direction and year rather than dropped in silence","m2StatusWhy":"three statuses of different dollars, never stacked: paid is documented as moved, awarded-additional is what a funder page names on top of it, promised is announced. The 2025 fall in paid is the filing lag of the tax forms, not the field","m2OrgWhy":"an organization's own expenses over its own output, where both are whole: the filled dot is dollars per paper, the pale one dollars per output item once technical posts are counted too. METR has no dot on the first: zero papers is a mismatch of units, not a price of zero","m2LabWhy":"items on the labs' own research listings, 357 of them. No lab publishes a safety budget, so this is the ceiling of the knowable - effort, not money. Output tripled in 2025, the same year the philanthropic layer did","m2EuWhy":"six lots of one 2025 tender of the EU AI Office, awarded values read from the machine-readable notice. Lot 4, harmful manipulation, is the first money ever awarded to sycophancy and persuasion","m2FloorsWhy":"after eleven collectors and five labeling passes, these are the bottoms below which public money does not exist. Each carries the reason it cannot be collected, so the next \"what else is there?\" has a written answer rather than a promise","m2Papers":"papers","m2Posts":"technical posts","m2Expenses":"expenses","m2Lot":"lot","m2Bids":"bids","m2Gov":"the floors in other currencies: a direction with one of these is not empty","m2GovWhy":"1,426 government grants labeled line by line, and the three currencies are never converted - a floor is read in the currency it was awarded in. This is where the phrase search was blind: watermarking looked like a property of the world with no visible dollar anywhere, and the labeling found EUR 11.69M of European deepfake and provenance work. The claim died the way the map's claims die. What survives of it: invisible to philanthropy and to American funders, visible to Europe","m2Sff":"the tail of the SFF rounds, spread line by line","m2SffWhy":"what the rounds left over, put on directions one grant at a time; what could not be put anywhere is named as a bucket - infrastructure, out of scope, unclassifiable - rather than quietly dropped","m2Empty":"and after all of it, the directions that are still empty","m2Fund":"who pays for what: every ledger against the directions it funds","m2FundWhy":"one ledger now, not seven files joined by hand: every row of every layer in one schema. A column is one funder in one currency and is read against itself - the color says what share of THAT funder's money a direction took, and the four currencies are never compared with one another. Under each name: the share its single largest direction took, then how many directions it reached. Open Philanthropy concentrates, the European programs spread, and Tallinn - who publishes his own ledger - sits here as several columns because his money reaches the field through several vehicles","m2FundConc":"in its largest direction","m2FundDirs":"directions","hM3":"Four things the collection knew and the page never showed","m3Dist":"how citations sit inside a direction","m3DistWhy":"the whole walk, not the sum. The bar is the share of a direction's papers that have never been cited at all; the two dots are its median paper and its mean one, on a log axis. Where the two stand far apart the direction is a few heavily cited papers and a long silent tail - and the price of a citation on this page is really the price of that head","m3Jaan":"one donor, seven channels: what a published ledger looks like","m3JaanWhy":"a single funder publishes his own disbursements, and this is what the field looks like from inside one ledger: the same money reaching it through a foundation, a fund, a regranter, a donor-advised vehicle. Nobody else at this scale publishes anything comparable, which is why the eighth floor of the unknowable is donor-advised money","m3Corpus":"how firm the paper count is","m3CorpusWhy":"two ways the denominator moves. Counted across directions the corpus is larger than it is: some papers belong to two directions and are counted in both. And the same queries run again days later do not return the same numbers - the rows below moved most","m3Arch":"whether the evidence survives its own page","m3ArchWhy":"every cited money page was pushed to the Wayback Machine. The ones that refused are named: a claim whose page can be edited and has no archived copy is a claim with a shelf life","m3Zero":"never cited","m3Median":"median paper","m3Mean":"mean paper","m3Counted":"counted across directions","m3Distinct":"distinct papers","m3Twice":"in two directions at once","m3Drift":"moved most when the queries were run again","m3Archived":"archived","m3NotArchived":"refused","m3Forum":"the forum, on the same directions","m3ForumWhy":"the harvest was keyed by phrase and this page by direction, and the two meet: five of the eight phrases ARE a direction's stored key, and the other three name a direction outright. Where the forum word and the academic key differ, both are printed - the community wrote \"AI control\" while the literature was still counted under \"untrusted model\". **Two venues now**: the Alignment Forum bar and, beside it, LessWrong reached through a mirror after the site itself refused this client for twenty hours. The two shapes agree, which is what makes the silences - s-risks, neglected approaches - a fact about the topic rather than about the size of one forum","m3Cand":"what another phrase would have counted","m3CandWhy":"for the thinnest directions, the count a candidate phrase returns, beside the one the stored key returns. An alternative, never a replacement: swapping a key changes what the whole map says, and that is a decision rather than a drawing","m3Sizes":"what one grant looks like at each funder","m3SizesWhy":"the size of a single grant, as quartiles rather than a total: the bar runs from the first quartile to the third, the line inside is the median, and the whisker reaches the largest one. Two ledgers of the same size can be a hundred grants or a hundred thousand - the NSF pays a median of $440k, the LTFF $27k, and Manifund $12k","m3Posts":"posts","m3Karma":"karma","m3SameWord":"the forum and the literature use the same word","m3OtherWord":"the forum says","m3KeyWord":"the literature is counted under","m3Stored":"stored key","m3CandN":"candidate","m3Comp":"compute given in kind, converted into the arithmetic it could buy","m3CompWhy":"the sixth floor of the unknowable says compute in kind is countable but unpriceable. That is true of dollars and not of arithmetic: an allocation of hours on a named machine has a published peak, and hours times peak is a number anyone can re-derive. So it is a **ceiling**, never a measurement - nobody reaches vendor peak, a real run commonly gets a third to a half of it, and an allocation is an entitlement rather than a receipt. Where the machine is not named or its accelerator is not published, nothing is converted and the hours are listed as they are. Part of the same program is not compute at all but cloud and API credit in dollars; those stay dollars and are never added to the other side","m3CompCeil":"peak ceiling","m3CompRows":"allocations converted","m3CompLeft":"left unconverted","m3CompUsd":"and, in the same program, credit denominated in dollars","m3CompWord":"by the word that put the row in the sample","m3CompTop":"the largest single allocations","m3CompRates":"the rates, each with its source","m3Unseen":"the money that was collected and drawn nowhere","m3UnseenWhy":"three sources that reached no chart until now. The US federal awards are matched by **keyword and never hand-labeled**, unlike the philanthropic and European grants, so they are a floor rather than a figure - and the phrase that matched is printed beside each one, because \"trustworthy artificial intelligence\" in a grant about dementia care is not this field. The Canadian rounds are in CAD and only two thirds of them publish an amount at all. And for Japan, Korea and Singapore what was found is mostly that no figure exists - which is a finding, and is why those countries sit among the floors of the unknowable","m3UsaBy":"by the phrase that matched","m3UsaAg":"by agency","m3UsaTop":"the largest awards","m3Caisi":"the Canadian rounds, in their own currency","m3Intl":"looked for, and mostly not found","m3Priced":"of them publish an amount","m3Orgs":"the organizations, as their own filings report them","m3OrgsWhy":"166 filing-years for 40 organizations, read off the tax forms. A cell is a filing year, colored by what the organization spent; a dot in the cell is a year where less came in than went out, which is a year spent out of reserves. The number on the right is its largest year. Fourteen organizations have no bars at all, and the reason is printed instead of a zero, because the reasons are not the same: **no 990** means the organization does not file one, **pdf only** means the filing exists and is not machine-readable, **no filings yet** means it is too young to have filed. This is the layer the price of an output came from, and here it is whole rather than as eleven rows","m3OrgSpent":"spent","m3OrgIn":"came in","m3OrgNo":"no figure","m3OrgGrow":"growth over its own filings","m3Led":"the two ledgers the rest of the page rests on","m3LedWhy":"everything above is only as good as these. The **overlap pairs** are candidates: grants that two funder ledgers both list, matched by recipient and year. Being a candidate is not being a duplicate - of the money in this table only a third turned out to be the same dollars twice, because a donor-advised grant passing through a fund does not match its rows one to one. What was actually held out is counted separately, below. The **labels** are the papers a phrase key caught, each with the sentence that ruled it out; this is where a precision of 0.42 stops being a number and becomes a list of titles, each of which can be argued with line by line","m3LedOv":"candidate pairs: grants two ledgers both list","m3LedLab":"what a key actually caught","m3LedSame":"the same year","m3LedAdj":"a year apart","m3LedOn":"on topic","m3LedOff":"ruled out, with the reason","m3Af":"Alignment Forum","m3Lw":"LessWrong","m3Compdir":"and where that arithmetic went","m3CompdirWhy":"the same allocations, now labeled by direction rather than by the word that caught them. Adversarial robustness takes more arithmetic than everything else together, and the reason is not that the field cares most about it: adversarial training is GPU-shaped work, while a project on alignment faking needs a thousandth of it. Compute follows the method, not the discourse","m3Usadir":"the federal money, once it is labeled","m3UsadirWhy":"the same 84 awards, labeled by direction. The largest block is not research at all: **assurance and certification, and mostly contracts rather than grants** - the government buys testing, where philanthropy buys inquiry","m3Cov":"the coverage table: which layer reaches which direction","m3CovWhy":"the end of the arc that began with more than half the map holding no money at all: no direction is empty now. But the table also says how thin the floor is under some of them - seven rows are held up by a single layer, so if that one labeling turns out wrong, the row is empty again. The last two to close - open-weight safety and modality safety - closed not by new collection but by re-reading what was already collected: an FLI grant turned out to be an RFP on tamper-resistant safeguards for open-weight models, a Canadian Catalyst project turned out to be the safety of diffusion models. **Empty was a property of the labeling, not of the world** - and so is not-empty","m3CovLayers":"layers touching it","m3CovNone":"no layer","m3Skip2":"the seventy-three exclusions, by name","m3Skip2Why":"what would have been counted twice if two ledgers were simply added: each held out by name, with the reason, rather than netted off in silence","m3Port":"what the labs and the organizations actually publish, by direction","m3PortWhy":"every published item labeled one at a time. A third of what Anthropic puts out is interpretability, OpenAI leans on the deployment surface, and Google DeepMind's largest single row is pluralistic alignment - not what any of the three is best known for. Items that are not a direction are kept as their own kind rather than forced onto the map: organizational news, and capability work that is not safety. This is output, not budget - it says where the effort went, never how much it cost","m3Sched":"grants read out of the filings themselves","m3SchedWhy":"four funders whose own pages refuse a robot, opened through the open XML of their tax filings instead. Schedule I lists every grant with its purpose in the filer's own words - which is how the Foresight cohort became visible years before its own site will say anything, and how a Schmidt grant to the AI Safety Fund was found from the donor's side","m3Skip3":"the exclusions, by name","m3Skip3Why":"what would have been counted twice had two ledgers simply been added - the same grant listed by the foundation that gave it and by the fund that passed it on. Held out by name, with the funder and the grantee, rather than netted off in silence","m3PortOff":"off the map","m3SchedN":"grants in the filing","m3Skip2b":"and what was actually held out - two books, not one","m3Skip2bWhy":"two different exclusions, kept apart because they answer different questions. **Channel overlap**: a row in a donor's own ledger that matches, line for line, a row in the fund he gave through - the same dollars arriving twice. **Registry against itemized**: a figure the map's registry carries as one number where the itemization now lists the parts, so the coarse row steps aside. And the first book, the side-picking of the money bounds, is a third thing again","m3SkipChan":"channel overlap","m3SkipReg":"registry stepping aside for the itemization","scopeNote":"Every row on this card is sourced - paid, awarded or promised, on its own chips. The estimate lives one card up as the pale residual band: since the August redefinition the two layers are additive, sourced plus residual, and no switch is needed to tell them apart.","kResid":"of it, decomposed:","residNamed":"has names on it (paid or awarded)","residBeyond":"is the residual estimate no disclosure regime reaches","cdStratNote":"stratified recount, 12 Aug: precision measured down the citation tail, not only the head","cdStratLab":"labels","cdDenStrat":"stratified: precision measured down the citation tail (12 Aug)"};

const constants={"snapshot":{"date":"2026-08-03","why":"The Semantic Scholar snapshot date. The multiplier that scales the incomplete 2026 to a full year is computed from it: 365 / day of the year. The multiplier used to sit as a constant 12/7 in four places, which assumed a snapshot at the end of July and so understated momentum by 4.4%."},"estimates":{"as_of":"2026-08-02","why":"The date of the [E] layer, declared once for all of it. An estimate is the map's own guess at spending nobody publishes, so method.md calls the amount unverifiable in principle - but until round 60 the guess carried no date either, and a guess with no date cannot go stale. There is no finer provenance to recover: MONEY.json entered the repository in a single commit, 9a44c1d of this date, and not one of the 52 estimates dates itself in its own text, so 52 separate dates would have to be invented. This is the latest date at which the whole layer is known to have existed, and it bounds every guess in it. It cannot be later than the snapshot the map is read beside."},"trend":{"sparse_max":9,"cooling":0.6,"plateau":1.1,"surge":2.4,"why":"The rule behind the trend label, which until round 62 was written nowhere. A row with sparse_max papers or fewer over 2024-2026 is sparse, because three counts that small carry no trend; otherwise the label comes from g, the annualised ratio the page and export_csv already compute - y26 * 365 / day of the snapshot year, over y25 or 1 - and the thresholds are read as g below cooling, at or below plateau, at or below surge, above surge. The thresholds are ours and not the literature's: they were fitted to the labels the map already carried, and they reproduce 45 of the 53. That fit is the argument for keeping overrides rather than deriving outright: near a cut of ours the label is a reading and not a computation, and the two sparse readings the rule disagreed with in both snapshots stood at 11 and 10 papers before round 56, two and one above the cut. Round 62 found the other five disagreements were not readings at all: each was a correct reading of the paper count the row carried before round 56 re-derived 44 of the 53 phrase keys, and the label had stayed behind while the count moved.","overrides":{"49":"The count is not this row's. The essay records that the field calls this socioaffective alignment and co-affective alignment is the map's own label, and the phrase key is a third thing again, 'affective alignment' - broad in affective computing, where the top paper it finds is Whose Emotions and Moral Sentiments Do Language Models Reflect? at 26 citations. So the 87 papers are largely not about alignment to long-term wellbeing, and the rule reads growth off a corpus that belongs to another topic. The row keeps sparse because its own data is sparse. Polysemy alone is not this reason: 20 rows carry the marker and 17 of them agree with the rule."}},"reread":{"deadline_soon":30,"unread":30,"retake":90,"why":"The three windows of the re-read regime, which make check prints in order of urgency: a live card whose deadline falls within deadline_soon days, a rolling call or a volatile source unread for more than unread days, and the citation snapshot past retake days, which is the only one of the three that fails the build. They are ours, like the trend thresholds: a month is the shortest period over which a call can be seen to have moved, and retake is a quarter because the caption on the page names a snapshot date and past a quarter the paper counts stop being what it promises. Round 63 declared them because retake stood twice in status_tests.py - once in the test and once in the line that prints the number to the reader - and a threshold written twice can drift against itself."},"fx":{"GBP":{"usd":1.34,"why":"The registry's rate for the pound. One rate for the whole registry: the AISI pool and the ARIA grants are counted with it too, otherwise the same pool would give different sums in neighbouring rows."},"EUR":{"usd":1.14,"why":"The registry's rate for the euro. Until round 50 the registry held two values - 1.14 for the Cooperative AI Foundation and 1.16 for the OpenAI EMEA grant; 1.14 was kept, because the aggregate of 22 grants is counted with it."},"SEK":{"usd":0.1046,"why":"Spot rate of 31 July 2026, exchangerate-api.com. The krona appears in the registry once, in the Cooperative AI Foundation's grant book."}}};

arly rate the two of them imply."},"36":{"srcA":0,"mid":40,"lo":20,"hi":60,"oldMid":40,"why":"The one quantified line near this row is NSF's Safe Learning-Enabled Systems, $10.9M across 11 projects in 2023, and it is counted on another row. NSF's Foundational Research in Robotics publishes no funding total and no embodied-safety line, so it sizes nothing. The middle is robotics-safety work inside academic groups and standards bodies, which publish papers rather than budgets."},"37":{"srcA":0.12,"mid":0.88,"lo":0.88,"hi":0.88,"oldMid":1,"why":"Two figures are on record and both are small: the Center for Reducing Suffering's historical yearly operating budget of $0.13M, and $0.2M to the Center on Long-Term Risk from the SFF-2025 round. CRS's expected $200k for next year and CLR's $400k fundraising target are money asked for rather than received, and the Foresight and CAIF grants for spitefulness research name no amount. About $1M a year is the whole dedicated field."},"38":{"srcA":1.92,"mid":63.08,"lo":28.08,"hi":98.08,"oldMid":65,"why":"No figure for the safety slice is published anywhere on this row. Concordia AI gives no budget, revenue or expense line in any of its 2025 reports. Shanghai AI Lab's budget is capability money whose safety part is not broken out, and the city's US$13.8bn AI and semiconductor fund-of-funds with its RMB 600M compute vouchers is parent-field money at a scale that says nothing about safety. The middle is a guess at state and lab safety staffing in China."},"39":{"srcA":0.31,"mid":99.69,"lo":49.69,"hi":149.69,"oldMid":100,"why":"commercial (bigtech internal + startups), large - no public figures: the only quantities in this space are venture rounds and acquisition prices (Lakera $20M Series A, Protect AI bought by Palo Alto Networks at an undisclosed price), that is capital and valuation, not annual research spend"},"40":{"srcA":3.15,"mid":2.85,"lo":0,"hi":6.85,"oldMid":6,"why":"$3.52M is on record: $3.29M of the UK AISI Alignment Project's first-round pool for benchmark design and evaluation, and $0.23M of the SafeBench prize purse. Both are one-off, since AISI publishes per-project durations but no pool term, and SafeBench announced no second running. The middle adds the benchmark work done inside labs and inside MLCommons, which is staff time nobody bills as a grant."},"41":{"srcA":0.05,"mid":1.45,"lo":0.95,"hi":1.95,"oldMid":1.5,"why":"small (self-other overlap: only a handful of real AI papers). AE Studio funds its alignment work from consulting profit and publishes no figure, Astera/Byrnes; ALTER/Kosoy combine that SFF grant with contract revenue; Foresight's ~$3M/yr covers 7 focus areas of which only some are AI safety"},"42":{"srcA":0,"mid":35,"lo":20,"hi":50,"oldMid":35,"why":"a large literature on diffusion and deepfake safety, but no named funding program and no attributable figure - the size here is bibliometric, not financial. mid to large"},"43":{"srcA":20.61,"mid":0,"lo":0,"hi":4.39,"oldMid":16,"why":"Two figures carry this row: ARC's FY2024 expenses of $9.05M from its Form 990, a whole year of an organization that has been wholly theoretical since METR spun out, and $13.16M of the UK AISI Alignment Project's first-round pool across its four formal-theoretic areas. The pool publishes no term, so it is not divided into a yearly rate, and the middle is what those two suggest for a year of the field."},"44":{"srcA":0.11,"mid":2.39,"lo":0.89,"hi":3.89,"oldMid":2.5,"why":"$0.02M, the SafeBench second prize for the Situational Awareness Dataset, is the only dollar figure attached to this row, and the other seven prizes in the same purse are counted under benchmarks. Whatever funded that work and the rest of the surprising-phenomena literature was never published, so the middle is a guess at the size of a literature rather than a sum of grants (count inflated by autopilots)."},"45":{"srcA":0.27,"mid":19.73,"lo":9.73,"hi":29.73,"oldMid":20,"why":"OpenAI's two published grant programs are what const mparse=lab=>{                       // "$30-80M" -> [30,80]; "$50M+" -> [50,null]; "<$2M" -> [0,2]

function trkSeries(c){

    if(m>0&&d>0)out.push([y,m*1e6/d]);});

function trkTagSeries(ti){
  const cs=rows.filter(r=>r.tags.includes(ti)&&moneyByDir.rows[r.id]).map(r=>moneyByDir.rows[r.id]);
  if(trkWhat==='money'){const acc={};
    cs.forEach(c=>Object.entries(c.byYear||{}).forEach(([y,v])=>{acc[y]=(acc[y]||0)+v*1e6;}));
    return Object.entries(acc).map(([y,v])=>[+y,v]).filter(p=>p[1]>0).sort((a,b)=>a[0]-b[0]);}

const HEAT=t=>{const u=Math.max(0,Math.min(1,t));
  // hue runs cold to hot; lightness rises to the middle and comes back down, so the hot end
  // reads as red rather than as pale orange, and the ramp still keeps an order in lightness
  const stops=[[0,255,55,-0.12],[0.30,190,60,-0.04],[0.55,135,68,0.04],[0.78,58,78,0.02],[1,14,80,-0.06]];
  let a=stops[0], b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++) if(u>=stops[i][0]&&u<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;}
  const f=(u-a[0])/Math.max(b[0]-a[0],1e-9), m=(i)=>a[i]+(b[i]-a[i])*f;
  return `oklch(from hsl(${m(1).toFixed(0)} ${m(2).toFixed(0)}% 50%) calc(var(--tl) + ${m(3).toFixed(3)}) c h)`;};
const TRKW=1010, TRKL=250, TRKR=150;

// 1. a plot per row - the shape of one row, at the cost of comparing rows
function trkGrid(svg,data,t){

function trkRowChrome(g,d,cy,col,right){

// labels at the right edge, pushed apart so none covers another
function trkEndLabels(svg,ends,x0,base){

  const over=ends.length?ends[ends.length-1].y-base:0;
  if(over>0){ends.forEach(e=>e.y-=over);
    for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<GAP) ends[i].y=ends[i-1].y+GAP;}
  ends.forEach(e=>{
    svg.appendChild(el('path',{d:`M${e.x+3},${e.y0} L${x0+12},${e.y}`,stroke:e.col,'stroke-width':1,opacity:.4,fill:'none'}));

// 3. indexed to the first year - the level is dropped so that the rate can be compared

    g.appendChild(el('polyline',{points:pts.map(p=>p[0]+','+p[1]).join(' '),fill:'none',stroke:col,'stroke-width':2,'stroke-opacity':.85}));
    pts.forEach(p=>g.appendChild(el('circle',{cx:p[0],cy:p[1],r:2.8,fill:col})));
    const last=pts[pts.length-1];
    ends.push({d:data[i],col,x:last[0],y:last[1],y0:last[1]});
    const hit=el('polyline',{points:pts.map(p=>p[0]+','+p[1]).join(' '),fill:'none',stroke:'transparent','stroke-width':12});

}
// 4. a heat grid - no shape, but every row and every year at once
function trkHeat(svg,data,t){
  const W=TRKW, L2=TRKL, R2=TRKR, rowH=20, lg=Math.log10;
  const years=[...new Set(data.flatMap(d=>d.ys.map(p=>p[0])))].sort();
  const cw=(W-L2-R2-32)/years.length;
  const vals=data.flatMap(d=>d.ys.map(p=>p[1]));
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const A=v=>(lg(v)-lg(lo))/Math.max(lg(hi)-lg(lo),1e-9);
  const H=26+data.length*rowH+30;
  svg.setAttribute('viewBox',`0 -34 ${W} ${H+34}`);
  // the key: the ramp itself, with the value at each end and in the middle
  const kx=L2+16, kw=Math.min(260,(W-L2-R2-32)/2), steps=28;
  for(let i=0;i<steps;i++)
    svg.appendChild(el('rect',{x:kx+kw*i/steps,y:-16,width:kw/steps+.6,height:9,fill:HEAT(i/(steps-1))}));
  [[0,lo],[0.5,Math.pow(10,(lg(lo)+lg(hi))/2)],[1,hi]].forEach(([f,v])=>{
    const e=el('text',{x:kx+kw*f,y:-20,'text-anchor':f===0?'start':(f===1?'end':'middle'),class:'axlab'});
    e.textContent=cnum(v); svg.appendChild(e);});
  years.forEach((y,j)=>{
    const e=el('text',{x:L2+16+cw*(j+.5),y:18,'text-anchor':'middle',class:'axlab'});e.textContent=y;svg.appendChild(e);
    const e2=el('text',{x:L2+16+cw*(j+.5),y:26+data.length*rowH+16,'text-anchor':'middle',class:'axlab'});
    e2.textContent=y;svg.appendChild(e2);});
  data.forEach((d,i)=>{
    const top=26+i*rowH, g=el('g',{}); svg.appendChild(g);
    const by={}; d.ys.forEach(p=>by[p[0]]=p[1]);
    years.forEach((y,j)=>{const v=by[y];
      if(v==null){g.appendChild(el('rect',{x:L2+16+cw*j+1,y:top+1,width:cw-2,height:rowH-2,rx:2,
        fill:'var(--text-primary)','fill-opacity':.03}));return;}
      const hol=trkWhat!=='money'&&immature(y,trkWhat);
      const rc=el('rect',{x:L2+16+cw*j+1,y:top+1,width:cw-2,height:rowH-2,rx:2,fill:HEAT(A(v))});
      rc.setAttribute('stroke','var(--surface-1)'); rc.setAttribute('stroke-width',.8);
      if(hol){rc.setAttribute('stroke','var(--surface-1)');rc.setAttribute('stroke-dasharray','3 2');rc.setAttribute('stroke-width',1.2);}
      g.appendChild(rc);
      const hit=el('rect',{x:L2+16+cw*j,y:top,width:cw,height:rowH,fill:'transparent'});
      hit.addEventListener('mousemove',ev=>showTip(`<b>${d.name}</b><br><span class="k">${y}:</span> <b>${cnum(v)}</b>`,ev));
      hit.addEventListener('mouseleave',hideTip); g.appendChild(hit);});
    const vs=d.ys.map(p=>p[1]);
    trkRowChrome(g,d,top+rowH/2,TCL(d.tag),cnum(Math.min(...vs))+' - '+cnum(Math.max(...vs)));
  });
}

  (()=>{const svg=document.getElementById('m2sff'); svg.textContent='';

// ---- four readings the collection had and the page never drew
function drawM3(){
  const t=T(), M=moneyPanels, W=1010;

    [1,3,10,30,100].forEach(v=>{ if(v<lo||v>hi)return;
      svg.appendChild(el('line',{x1:X(v),y1:top-6,x2:X(v),y2:top+D2.length*rowH,stroke:'var(--grid)','stroke-width':1}));
      const e=el('text',{x:X(v),y:top-10,'text-anchor':'middle',class:'axlab'});e.textContent=v;svg.appendChild(e);});
    D2.forEach((d,i)=>{const y=top+i*rowH, g=el('g',{}); svg.appendChild(g);

      g.appendChild(nm);
      g.appendChild(el('rect',{x:L2+16,y:y+4,width:Math.max(bw*d.zero,1.5),height:11,rx:2,
        fill:'var(--muted)','fill-opacity':.55}));

      pz.textContent=Math.round(d.zero*100)+'%'; g.appendChild(pz);
      if(d.median>0)g.appendChild(el('circle',{cx:X(d.median),cy:y+9.5,r:3.6,fill:'var(--s-blue)'}));
      if(d.mean>0)g.appendChild(el('circle',{cx:X(d.mean),cy:y+9.5,r:3.6,fill:'var(--surface-1)',
        stroke:'var(--warn)','stroke-width':2}));
      if(d.median>0&&d.mean>0)g.appendChild(el('line',{x1:X(d.median),y1:y+9.5,x2:X(d.mean),y2:y+9.5,
        stroke:'var(--warn)','stroke-width':1.4,'stroke-opacity':.4}));

        +`<span class="k">${t.m3Mean}:</span> <b>${(d.mean||0).toFixed(1)}</b><br>`

  // 2. one donor through his channels

    const years=[...new Set(F.flatMap(f=>Object.keys(f.posts).concat(Object.keys(f.lwPosts||{}))))].map(Number).sort();

    F.sort((a,b)=>(b.totalPosts+(b.lwTotalPosts||0))-(a.totalPosts+(a.lwTotalPosts||0)));

      wl.textContent=f.sameWord?T().m3SameWord:('"'+f.phrase+'" / "'+f.key+'"'); g.appendChild(wl);});})();

  // 2c. what one grant looks like at each funder
  (()=>{const svg=document.getElementById('m3sizes'); svg.textContent='';
    const S=M.grantSizes, rowH=22, top=28, L2=200, R2=190, H=top+S.length*rowH+14, lg=Math.log10;

      vl.textContent=p.n+(p.off?' + '+p.off+' '+T().m3PortOff:''); g.appendChild(vl);});})();

  // 2h3. Schedule I, straight out of the filings

  (()=>{const S=M.skippedNamed, t2=T(); if(!S)return;

  // 2h5. the two books that actually removed money
  (()=>{const L=M.ledger, t2=T(); const el2=document.getElementById('m3skip2b'); if(!el2||!L)return;
    const S2=L.skipped2||{kinds:[],rows:[],n:0,total:0}, S1=L.skipped||{n:0};

    el2.innerHTML=`<p class="foot">`
