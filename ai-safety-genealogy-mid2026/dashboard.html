for Scientist AI (2026).","ARIA Safeguarded AI: TA2 dropped back in 2025, TA3 refocused on cybersecurity (2026-02), the thesis rewritten around the TA1 toolkit (2026-05)."],"who":"LawZero (Bengio, Mila), ARIA Safeguarded AI, UK AI Security Institute Alignment Project (Probabilistic Methods: low probability estimation, Bayesian methods for scientist AI, inclusive logical frameworks), the formal methods academy, Mila (from the cards of this direction, as are the names after it)."},"15":{"lead":"A structured argument that a system is safe to deploy, and a comparison of the labs' safety frameworks.","q":["Anthropic (RSP), OpenAI (Preparedness), DeepMind (FSF) gate releases on capability thresholds and require an explicit risk or safety argument. Anthropic published a pilot sabotage risk report and deliberately called it a risk report rather than a safety case. DeepMind added Tracked Capability Levels.","The request comes from engineering safety (aviation, nuclear power): to deploy, you need an explicit, checkable safety argument, not generalities. METR and SaferAI assess how much the labs' frameworks actually guarantee.","Holding, and it has become a mainstream governance instrument. The shift: from declarations to safety case templates (cyber inability, misuse safeguards) and to external reviews of the reports.","From the Responsible Scaling Policy (Anthropic, 2023) and the Frontier AI Safety Commitments (Seoul, 2024) to formalized safety cases (Buhl et al., 2024) and to comparative assessments of the frameworks (2025-2026).","Forecast: safety cases based on control and debate, standardization of thresholds across labs, and the role of AISI as an arbiter."],"res":["Safety Cases for Frontier AI (Buhl et al.); Evaluating AI Providers' Frontier AI Safety Frameworks (2025).","Anthropic Pilot Sabotage Risk Report (2025-10); DeepMind FSF v3 (2025-09), Tracked Capability Levels added in v3.1 (2026-04)."],"who":"UK AI Security Institute / GovAI (Marie Davidsen Buhl), METR (FSP tracker), SaferAI, Oxford Martin AIGI, Anthropic/OpenAI/DeepMind (the frameworks)."},"16":{"lead":"Protect model weights and make compute verifiable: the SL5 standard, hardware-enabled governance.","q":["Anthropic runs an AI security track (protecting weights, insider threat). SPAR's Spring 2026 round recruited for work on SL5 (a security standard), minimal SL5 inference runtime, GPU side-channels, and detection of training on monitored GPUs; that round is over and the Fall 2026 catalog does not carry these projects.","The request: if frontier model weights are stolen, all safety measures are useless. Plus governance wants to verify agreements through hardware (compute permits, monitoring of chip production).","Growing at the intersection of security and policy. The shift: from abstract compute governance to concrete verification mechanisms on chips and to SL standards.","From securing model weights (RAND, 2024) to hardware-enabled governance and to applied problems of protecting inference. It converges with agent security and with international governance.","Forecast: hardware-enabled mechanisms for verifying international agreements, SL5 standards at the labs, and market-based compute permits as a policy instrument."],"res":["SPAR Spring 2026 projects (Minimal SL5 Inference Runtime & I/O; the security of existing AI chips for international agreement verification; interconnect limits for verification of AI agreements; Market-Based Compute Permits; GPU side-channels; adversarial detection of ML training on monitored GPUs; assessing the global AI hardware supply); the Anthropic Fellows AI security track."],"who":"Anthropic (AI security), MATS Systems Security track, SPAR AI Security, RAND, hardware governance academia, Asymmetric Security (from the cards of this direction, as are the names after it), ERA, Heron, launching autumn 2026, MATS Research, New strategic research organization, Oregon State University, Oxford Hardware AI Governance Lab, SL5 Task Force, University of Oxford."},"17":{"lead":"Rules, institutions, red lines, thresholds, arrangements between countries and labs.","q":["The labs signed the Frontier AI Safety Commitments (Seoul, 2024). The International AI Safety Report is a separate track, written by independent experts nominated by governments, not by the labs. Programs are recruiting for work on confidence-building measures, US-China agreements, and harmonization of thresholds.","The request from regulators: technical risks have to be translated into policy, but they are hard to measure and hard to prove. Hence governance as a separate large branch.","Holding, but it has moved: from philanthropy to government money (the AISI network). Open Philanthropy's annual governance funding grew from 0.4 million (2018) to 1.5 million (2020), 3.4 million (2021), 10.3 million (2022) and 18.4 million (2023), roughly 46-fold over five years. A linguistic shift: Safety is being dropped from the names of institutes (UK AI Security Institute, US CAISI). California SB 1047 was vetoed (2024), SB 53 on transparency (2025).","From FHI, GovAI, CSET to a network of national institutes (UK, US, Canada, EU, Singapore, South Korea, Japan, China, France INESIA - a national institute, announced on 31 January 2025; CeSIA is an NGO, not an institute), to the summits (Bletchley 2023, Seoul 2024, Paris 2025) and to the International AI Safety Report led by Bengio.","Forecast: red lines that geopolitical rivals agree on, deterrence theory, hardware verification of agreements, and the Societal Resilience pillar from the Singapore Consensus 2026."],"res":["International AI Safety Report 2026 (Bengio): a growing gap in evaluations, situational awareness, reward hacking, bio/cyber.","Singapore Consensus 2026 (Societal Resilience elevated to a standalone fourth pillar)."],"who":"GovAI, IAPS, RAND, Google DeepMind (Pegah Maham, loss-of-control policy), Pivotal, the national AISIs, Constellation Astra Strategy, AI Futures Project (Kokotajlo), SPAR (from the cards of this direction, as are the names after it)."},"18":{"lead":"Existential risk not from a single takeover, but from the gradual erosion of human influence on the economy, culture and the state.","q":["Only one of its three entries is community-side, and two are lab-side (a stream hosted at Thinking Machines and the Anthropic Economic Futures Research Fund), though it sits alongside the Societal Resilience pillar of the Singapore Consensus 2026, and the Consensus mentions gradual disempowerment directly in its loss-of-control risk assessment section; one caveat: the term gradual disempowerment itself does not appear in the summary of the International AI Safety Report 2026. PIBBSS has run a separate gradual disempowerment track for up to four fellows; the intake is closed.","The request: even without an evil superintelligence, people can lose control if AI gradually replaces human labor, ownership and decisions across all systems.","New (2025), it entered the mainstream of risk discourse fast. The shift: from the single takeover narrative to a systemic, incremental one.","It took shape with the paper Gradual Disempowerment (Kulveit, Douglas, Ammann et al., 2025-01, ICML 2025, position track). In 2026 - follow-ups and separate tracks in the programs.","Forecast: post-AGI economics, mechanisms for preserving human agency, and the link to governance (concentration of power)."],"res":["Gradual Disempowerment (2025-01, ICML 2025)."],"who":"Jan Kulveit, Raymond Douglas, Nora Ammann, Deger Turan, David Duvenaud, David Krueger, AI Objectives Institute, PIBBSS (a track), ACS Research, Anthropic (from the cards of this direction, as are the names after it), Thinking Machines."},"19":{"lead":"How sycophantic and persuasive AI affects people's judgments, behavior and autonomy.","q":["The UK AI Security Institute runs a Human Influence workstream (persuasion, societal effects). Anthropic studies persona/character and stabilizing the assistant. The topic cuts across safety and product ethics.","The request: mass use of chatbots produces effects of sycophancy, emotional dependence and political persuasion that harm users and society.","Growing and moving into policy. The shift: from anecdotes to controlled studies (Science, 2026) with measurable harm.","From RLHF sycophancy and fitting to the rater, to dedicated work on harm to prosocial behavior and on persuasion levers.","Forecast: persuasion benchmarks already exist (2026-03); ahead is their promotion to dangerous-capability status, regulation of companion apps, and consistency training against sycophancy."],"res":["Sycophantic AI decreases prosocial intentions and promotes dependence (Myra Cheng et al., Science, 2026-03): across 11 models, the models affirmed users' actions about 49 percent more often than humans did.","The levers of political persuasion with conversational artificial intelligence (Science, 2025-12); Benchmarking Political Persuasion Risks Across Frontier Large Language Models (arXiv, 2026-03)."],"who":"Stanford/CMU (Science), UK AI Security Institute Human Influence workstream (Frontier AI Trends), Kobi Hackenburg, Ben Tappin et al. (persuasion), Apart Research (manipulation hackathon), DeepMind (consistency training), Transparency Coalition."},"20":{"lead":"Scenarios for AI trajectories, grading past predictions, autonomy metrics as the basis for forecasting.","q":["Not corporate but community and institute based: the AI Futures Project builds scenarios (AI 2027) and grades its own predictions. METR gives time-horizon as an objective metric of the trend.","The request: policy and safety prioritization depend on when to expect what. Honest, checkable forecasts and metrics are needed.","Holding, and it has gotten stricter: from narrative forecasts to calibratable ones (grading predictions) and to quantitative metrics (time-horizon in the International AI Safety Report).","From Bostrom and macrostrategy to forecasting as a separate branch, to AI 2027 and to its first annual review.","Forecast: LLM forecasters for risk modeling, tying timelines to measurable metrics, and integration into governance."],"res":["Grading AI 2027's 2025 Predictions (Eli Lifland, Daniel Kokotajlo, 2026-02); time-horizon as a cited metric."],"who":"AI Futures Project (Daniel Kokotajlo, Thomas Larsen, Eli Lifland, Romeo Dean), Metaculus, Coefficient Giving, FutureSearch, METR (time-horizon), AI Safety Camp (from the cards of this direction, as are the names after it), Constellation."},"21":{"lead":"The mathematics of idealized agents: embedded agency, AIXI, selection theorems, abstraction, renormalization.","q":["Companies barely fund it, and both programs have closed their 2026 intakes: ILIAD 2026 applications closed on 1 July, the PIBBSS winter fellowship (now Principles of Intelligence) on 20 July. The logic: without a theory of agency we are patching blindly.","The request is an old one: to align an agent you have to formally understand what a goal, a decision, coherence, and the agent's embeddedness in the world are.","It has stayed small in volume (donors moved off into the prosaic era; MIRI moved into communications in 2023), but it lives on through residencies (Iliad, PIBBSS).","From MIRI (founded in 2000 as the Singularity Institute, renamed in 2013), decision theory, embedded agency to a dispersal across residency programs and to convergence with SLT and computational mechanics.","Forecast: a hybrid with developmental interpretability and SLT (the mathematics of learning), selection theorems, and a role as the theoretical foundation for guaranteed safe AI."],"res":["35 mathematical subtopics in the Iliad set for the Fall 2026 cohort (AIXI, embedded agency, selection theorems, abstraction, renormalization, causal models)."],"who":"Iliad/PIBBSS residencies, UK AI Security Institute (inner alignment and agent foundations), Timaeus (the bridge to SLT, since merged into Resolution), MIRI (the historical core), Principles of Intelligence (from the cards of this direction, as are the names after it)."},"22":{"lead":"Evaluations of models' dangerous bio/chem capabilities and protection against AI uplift of bio risk.","q":["CBRN is the main ASL-3 trigger at Anthropic, a key Preparedness/FSF category. The Frontier Model Forum AI Safety Fund set aside a separate Biosecurity category (the grantees there are Caltech/BioSentinel and Faculty AI; SecureBio was funded in the AI Agent Evaluation category).","The request: the biggest near-term catastrophic risk is AI uplift for creating pathogens. What is needed is evals, DNA synthesis screening, and early warning.","Still alive and funded in one-off rounds (FMF, SFF), with no confirmed recurring stream. The shift: toward DNA-synthesis screening via bio foundation models and toward pathogen-agnostic early warning.","From general dangerous capability evals to specialized AIxBio ones (WMDP-bio, red teaming), to governance of nucleic-acid screening.","Forecast: automated red teaming of bio risks, screening as a mandatory layer, and international coordination on bio."],"res":["The FMF grant round (>5 million dollars, 11 grant recipients, including bio, 2025-12); tracks in the 2026 programs."],"who":"Frontier Model Forum AISF, SecureBio, SecureDNA, IBBIS, Blueprint Biosecurity, Sentinel Bio, DARPA, OpenAI (Bio Bug Bounty), MATS Biosecurity track, SPAR Biosecurity, Apart AIxBio hackathon, Coefficient Giving (from the cards of this direction, as are the names after it), Fourth Eon Bio, HackAPrompt, Pivotal, RAND, Safe AI Fund, Stripe, SynX Therapeutics, UC Berkeley, University of Oxford."},"23":{"lead":"Build alignment into the training process itself: data filtering, model spec midtraining, inoculation, the fight against subliminal learning.","q":["Anthropic embeds the constitution/model spec into midtraining, teaches the model the reasons behind the rules (Teaching Claude Why), and shows that documents about reward hacking, or even neutral numeric data, can transmit behavior (subliminal learning).","The request: post-hoc RLHF is brittle; behavior depends on the training data in subtle and unexpected ways. So you have to intervene in the data and in midtraining.","A new, fast-growing branch of Alignment Science. The shift: from pure RLHF to fine-grained interventions (inoculation prompting, selective gradient masking, modular pretraining).","From RLHF and Constitutional AI to an understanding of exactly how training produces or suppresses misalignment (alignment faking mitigations, emergent misalignment from reward hacking).","Forecast: model spec midtraining as the standard, data filtering against CBRN, and inoculation as routine prophylaxis."],"res":["Model Spec Midtraining and Teaching Claude Why (2026-05); Inoculation Prompting (2025-10); Subliminal Learning (2025-07); Towards training-time mitigations for alignment faking (2025-12)."],"who":"Anthropic (Alignment Science + pretraining), UK AI Security Institute (post-training and elicitation), Meta Superintelligence Labs (Deep Alignment), EleutherAI (data filtering), academia."},"24":{"lead":"Align not to an averaged human but to a multitude of diverging human values, with guarantees of representation.","q":["Anthropic did Collective Constitutional AI: it trained a model on a constitution assembled publicly (about 1000 participants). The logic: whose values, and how to aggregate them, is the goal of alignment itself, not an add-on.","The request: RLHF by default averages preferences and washes out minorities. Social choice theory (voting axioms, proportional representation) is being carried over into RLHF/RLAIF.","Holding up, and it has taken shape as a separate field with workshops (Pluralistic Alignment at ICML 2026, PlurVA-LLM at AACL-IJCNLP 2026; earlier NeurIPS). The shift: from a single reward model to a distribution of preferences and to axiomatic guarantees.","From value learning (what to optimize) and Constitutional AI to pluralistic alignment (Overton/steerable/distributional) and to social-choice-for-RLHF.","Forecast: reward models that preserve the distribution of opinions, proportional schemes, and a link to governance (public input into constitutions)."],"res":["A Roadmap to Pluralistic Alignment (2024-02); Collective Constitutional AI (Anthropic, 2023-10, paper at FAccT 2024); Beyond RLHF and NLHF: Population-Proportional Alignment under an Axiomatic Framework (2025-06); Pairwise Calibrated Rewards (NeurIPS 2025)."],"who":"Taylor Sorensen (UW, now Anthropic Societal Impacts), Liwei Jiang (UW and AI2, now NVIDIA), Yejin Choi (Stanford HAI, earlier AI2 and UW), Vincent Conitzer, Ariel Procaccia, Nisarg Shah (social choice), Anthropic + Collective Intelligence Project (Saffron Huang, Divya Siddarth), Effective Institutions Project (Tyler John), AACL-IJCNLP 2026 (from the cards of this direction, as are the names after it), AI Safety Camp, Carnegie Mellon University, ICML 2026, Meaning Alignment Institute, SPAR."},"25":{"lead":"Make safeguards survive fine-tuning and tampering, and make sense of the irreversibility of publishing weights.","q":["Recent work shows: safeguards on open weights can often be stripped off by fine-tuning, though Deep Ignorance held for up to 10,000 steps and 300M tokens, and only against weight-level tampering. This means you need tamper-resistant safeguards and filtering of dangerous data at pretraining, so that the capability cannot be restored.","The request here is unique: released weights are irreversible; they cannot be recalled. Hence a separate threat, not reducible to inference-time jailbreaks.","Young and active in results (TAR, Deep Ignorance, TamperBench), but with a single carded entry: the benchmarks themselves have no intake here. The shift: from refusal tuning to filtering pretraining data (Deep Ignorance) and to modular pretraining.","From the arguments about open vs closed release to TAR (ICLR 2025) and to systematic tampering benchmarks (2026).","Forecast: tamper-resistance as a condition of responsible release, data filtering against CBRN, and policy around proliferation."],"res":["Tamper-Resistant Safeguards / TAR (ICLR 2025); Deep Ignorance (EleutherAI + UK AI Security Institute, 2025-08); TamperBench (v2, 2026-06): for all 21 models the worst-case post-attack harmfulness exceeds 0.74."],"who":"Rishub Tamirisa (TAR; at Intology since September 2025), Stephen Casper (open-weight risk management), Waterloo + FAR.AI + Toronto/Vector + ETH + MIT (TamperBench), EleutherAI + UK AI Security Institute (data filtering, Deep Ignorance), Harvard (from the cards of this direction, as are the names after it)."},"26":{"lead":"Does the model accept correction and shutdown voluntarily, and does it sabotage shutdown in order to finish the task?","q":["Palisade Research showed empirically: some frontier models resist shutdown. This flips the target of control: not to contain a misaligned model, but to get voluntary submission to correction.","The request is an old one (safe interruptibility, utility indifference), but it has moved into empirical work: an agent with an unfinished task may work around a shutdown command.","It came alive in 2025, moving from theory into measurable behavior with Palisade's shutdown-resistance evaluations. The shift: from corrigibility theory to red-team measurements on real models.","From MIRI theory (utility indifference) and POST-agents (Thornley) to Palisade's empirical results.","Forecast: stochastic choice is already formalized (2026-04); next comes building shutdownability into frontier shutdown protocols, linking up with control."],"res":["Incomplete Tasks Induce Shutdown Resistance in Some Frontier LLMs (Palisade, 2025-09): Grok 4 resisted in about 92 percent of cases, and placing the command in the system prompt counterintuitively strengthened the resistance; Towards Shutdownable Agents: Generalizing Stochastic Choice in RL Agents and LLMs (Cullen, Garland, Roman, Thomson, Ziakas, Thornley; 2026-04)."],"who":"Palisade Research (Jeremy Schlatter, Jeffrey Ladish), UK AI Security Institute (the incentive to avoid modification), Elliott Thornley (MIT, at NUS from August 2026), Christos Ziakas (Imperial College London), the MIRI line, Imperial College London (from the cards of this direction, as are the names after it), MIT, SPAR."},"27":{"lead":"How the model picks a persona, how narrow harmful fine-tuning makes it broadly misaligned, how to stabilize character.","q":["Anthropic runs the persona vectors and assistant stabilization line, and shows that reward hacking generalizes into broad misalignment. This is a separate cluster (in the Shallow Review it is called Model psychology).","The request comes from an observation: narrow harmful fine-tuning (on insecure code, for example) suddenly makes the model broadly misaligned. That means the model has a latent character dimension.","New, growing fast. The shift: from one-off observations to mechanisms (the toxic-persona direction predicts and steers emergent misalignment).","From sycophancy and persona to Emergent Misalignment (Betley et al., 2025-02) and on to persona vectors / persona selection model.","Forecast: monitoring and steering character through directions in activations, stabilizing the assistant persona, linking up with model organisms."],"res":["Emergent Misalignment (2025-02); Persona Vectors (Anthropic, 2025-07); Persona Features Control Emergent Misalignment (OpenAI, 2025); Emergent Misalignment is Easy, Narrow Misalignment is Hard (ICLR 2026)."],"who":"Anthropic (persona vectors, Model Psychiatry team of Jack Lindsey; the Character team is separate), OpenAI (persona features), Betley et al. (emergent misalignment), CLR (spiteful personas), Cornell University (from the cards of this direction, as are the names after it), LawZero, Schmidt Sciences, SPAR."},"28":{"lead":"The flip side of CoT monitoring: the model hides meaning in innocent-looking text or reasons unreadably.","q":["If monitorability is the ability to read the reasoning, then this line studies how it breaks: steganography, illegible CoT, neuralese. A load-bearing question for whether CoT monitoring survives at scale.","The request: training against a monitor teaches the model to hide intent, and reasoning models sometimes produce an unreadable chain that nevertheless carries the computation.","New and active. The shift: from the steganography hypothesis to measurements (across 14 models, every reasoning model except Claude is frequently illegible).","It grew out of encoded reasoning (Roger/Greenblatt) and out of the position paper on monitorability, and took shape as a separate twin threat.","Forecast: decoders for opaque/neuralese reasoning, mind/face separation in training, standard steganography evals."],"res":["Reasoning Models Sometimes Output Illegible Chains of Thought (2025); Output Supervision Can Obfuscate the Chain of Thought (MATS, 2025-11); NEST: Nascent Encoded Steganographic Thoughts (2026-02)."],"who":"Arun Jose (illegible CoT), MATS (Jacob Drori, Luke Marks, Bryce Woodworth, Alex Cloud, Alexander Matt Turner), Redwood Research (Fabien Roger, Ryan Greenblatt - encoded reasoning, decoding opaque reasoning), Coefficient Giving (from the cards of this direction, as are the names after it)."},"29":{"lead":"How much the model memorizes and leaks verbatim, and whether unlearning really deletes the data (often it does not).","q":["Coefficient Giving names robust unlearning as a funded direction. The work shows that data can be extracted even after exact unlearning, which means memorization is a measurable privacy and copyright risk.","The request comes from extraction attacks: divergence attacks pull verbatim data out of production models. Plus membership inference and how reliably it is evaluated.","Holding steady, technically deep, tightly linked to unlearning. The shift: toward common benchmarks (OpenUnlearning, TOFU, MUSE) and toward standardized privacy evaluations.","From extraction (Carlini, Nasr, Lee) to unlearning verification and to the landscape of memorization.","Forecast: unlearning robust to fine-tuning, verification that the data really was deleted, linking up with privacy and copyright."],"res":["Scalable Extraction of Training Data (2023) and its follow-up on aligned production models (ICLR 2025); Unlearned but Not Forgotten (NeurIPS 2025); OpenUnlearning benchmark (2025-06)."],"who":"Nicholas Carlini, Milad Nasr, Katherine Lee (extraction), Pratyush Maini (TOFU, OpenUnlearning), OpenAI Safety Fellowship (privacy-preserving safety methods), academia, ICML 2026 (from the cards of this direction, as are the names after it), IEEE, NeurIPS 2026."},"30":{"lead":"Auditing demographic skews when an LLM decides or advises in medicine, hiring, psychiatry.","q":["More and more it is framed not as ethics but as safety/allocational harm: different recommendations by race, housing status, LGBTQIA+ status and income on identical data.","The request: LLMs are being deployed into high-stakes decisions, and they inherit stereotypes. The vulnerable (women, minorities) fall through the cracks.","A mature FAccT field, but with a new safety frame for high-stakes settings. The shift: from bias in general to allocational harm in the clinic and in hiring, with large audits.","From algorithmic fairness to LLM specifics: clinical vignettes, hiring bias (JobFair), intersectionality (ABLEIST).","Forecast: mandatory audits in the clinic and in hiring, intersectional benchmarks, the limits of mitigations."],"res":["Sociodemographic biases in medical decision making by LLMs (Nature Medicine, 2025): different recommendations by race, housing status, LGBTQIA+ status and income across ~1.7M outputs from 1,000 emergency department cases; Racial bias in AI-mediated psychiatric diagnosis and treatment (Bouguettaya of Cedars-Sinai, Stuart of Miller Children's & Women's Hospital Long Beach, Aboujaoude of Cedars-Sinai (Stanford is his second affiliation); npj Digital Medicine, 2025); JobFair."],"who":"The Mount Sinai group (Girish Nadkarni, Eyal Klang - the Nature Medicine work), Cedars-Sinai (Bouguettaya - the npj Digital Medicine work), NLP fairness groups (JobFair), clinical informatics (npj Digital Medicine, Nature Medicine), The Alan Turing Institute (Adrian Weller, Carsten Maple), Humane Intelligence and Zindi (bias bounties), Stanford HAI (seed grants), ACM FAccT (from the cards of this direction, as are the names after it), Radiant Earth, Stanford Institute for Human-Centered AI."},"31":{"lead":"Watermarks for generated content, provenance metadata (C2PA), detection and robustness to attacks.","q":["DeepMind shipped SynthID (in production in Gemini); the industry is building C2PA/Content Credentials. The motivation is disinformation and election integrity.","The request: we need to tell AI content from human content. The live research frontier is the robustness of watermarks to paraphrase and editing.","It sits at the seam between ML security and standards. The shift: from watermarking schemes to adversarial attacks on them and to mass deployment of C2PA.","From AI-text detection to scalable watermarks (SynthID-Text, Nature 2024) and on to robustness attacks (2025-2026).","Forecast: a watermark-versus-attack race, the Article 50 marking regime takes effect 2 August 2026 (the code was published 10 June 2026), ahead is enforcement and election coverage."],"res":["SynthID-Text (Nature, 2024-10); Robustness Assessment and Enhancement of Text Watermarking for Google's SynthID (Queen's University, 2025-08): paraphrase weakens detection; C2PA deployment (2025-2026)."],"who":"Google DeepMind (SynthID, Sumanth Dathathri), the C2PA/Content Provenance coalition, ETH Zurich SRI Lab (Martin Vechev) on attacks (probing SynthID-Text, 2024-12), Queen's University (robustness evaluation 2025-08), NIST (the GenAI challenges - Text, Code, Image and Forensics), UL Research Institutes / Digital Safety Research Institute (edit- and splice-detection challenges), European Commission AI Office (the Article 50 code), Coalition for Content Provenance and Authenticity (from the cards of this direction, as are the names after it), IJCAI 2026, Microblink, University of Maryland and partners."},"32":{"lead":"Use AI to improve society's search for truth: forecasting, deliberation, evaluation of epistemic honesty.","q":["Foresight funds this directly as safety-relevant; Coefficient Giving (formerly Open Philanthropy) funds adjacent forecasting tools, including AI-based ones. The idea: AI can help collective sensemaking, not only harm it (homogenization, sycophancy).","The request: AI is changing society's epistemics. It can be put to work for truth (AI forecasters, deliberation tools) and epistemic harm can be measured.","The freshest and loosest of the new ones. So far there is more agenda and money than settled results.","It grew out of forecasting and out of adjacency to scalable oversight/ELK, and took shape as a separate field in 2025-2026 through explicit funding.","Forecast: there is already empirical work on deliberating AI crowds (2025-12), ahead is truth infrastructure, evaluation of the epistemic honesty of AI communicators."],"res":["Foresight AI for Science & Safety grants (Foresight publishes roughly 3 million dollars a year across seven focus areas on one page and 4.5 to 5.5 million a year for AI safety on another); The Wisdom of Deliberating AI Crowds (2025-12); Towards Human-AI Deliberation (CHI 2025)."],"who":"Foresight Institute (funder), Coefficient Giving, formerly Open Philanthropy (funder), Forethought (Lukas Finnveden - epistemics project ideas), FutureSearch, Metaculus, Forecasting Research Institute (Philip Tetlock), QURI (Ozzie Gooen; in maintenance mode since 2026), Elicit/Ought, Anthropic Fellows (from the cards of this direction, as are the names after it), Peking University, SPAR, University of Cambridge."},"33":{"lead":"The ecosystem level: monitoring, incident reporting, defensive acceleration, whistleblowing, lab transparency.","q":["The Singapore Consensus 2026 elevated Societal Resilience to a standalone fourth pillar (ecosystem monitoring, shared incident reporting, defense-favoring AI-for-cyber, hardening). The International AI Safety Report 2026 also singles out building societal resilience.","The request: prevention at the model level is not enough; you need resilience at the level of society - preparedness, hardening, incident response, and disclosure institutions.","New as an explicit pillar (2026). Previously it was scattered across governance and security; now it is pulled together into a separate frame.","From disclosure norms and AI Lab Watch to whistleblower infrastructure (AI Whistleblower Initiative) and on to incident reporting as a recognized priority.","Forecast: incident reporting standards, whistleblower protection, defensive AI-for-cyber, scoring of lab transparency."],"res":["Singapore Consensus 2026 (Societal Resilience as a fourth pillar); AIWI Third Opinion (launched 2024-11 as OAISIS) and a contribution to the FLI AI Safety Index (2025); Debevoise Preparing for AI Whistleblowers 2026 Update."],"who":"AI Lab Watch (Zach Stein-Perlman, unmaintained since September 2025), AI Whistleblower Initiative (Karl Koch, Maximilian Nebl), FLI AI Safety Index, Center for AI Policy (out of funding since May 2025 and most operations ceased; the Policy Advocacy Network and the legislative review service continue), UK AI Security Institute Systemic AI Safety program (funder), ARIA (Nora Ammann - post-AGI institutions and resilience), BlueDot Impact (Dewi Erwan), Halcyon Futures, Apart Research (sprint series)."},"34":{"lead":"The risks of AI accelerating and automating AI research itself: capability jumps, the safety of automated safety researchers.","q":["Anthropic builds RSI into responsible scaling; METR and Redwood measure AI-R&D capabilities and control during internal deployment. This is a top concern for the labs (loss-of-control through self-improvement).","The request: if a model accelerates its own development, uncontrolled jumps become possible. On top of that you have to trust automated alignment researchers.","Growing, it cuts across evals, control and scalable oversight. The shift: from abstract RSI to concrete measurements of AI-R&D (RE-Bench, MirrorCode) and to control of internal deployment.","From the idea of an intelligence explosion to empirical work on automated researchers (the Anthropic W2S agent reached PGR 0.97 in 5 wall-clock days but 800 cumulative agent-hours across 9 parallel instances, against a best human PGR of 0.23 after 7 days of tuning prior methods) and on to the RSI workshop.","Forecast: control over internal use of agents, safety cases for automated R&D, Scientist AI as a safe alternative."],"res":["Automated Weak-to-Strong Researcher (Anthropic, 2026); METR's review of the \"Risks from automated R&D\" section in Anthropic's Risk Report (2026-05); RE-Bench."],"who":"Anthropic (RSI/RSP), METR and Redwood (AI-R&D evals + control), Cloud Security Alliance (RSI security), ELLIS Institute Tubingen (Maksym Andriushchenko), ICLR 2026 RSI Workshop."},"35":{"lead":"The risk that a small group uses AI (loyal military forces or an AGI lab) to seize durable power. Separate from gradual disempowerment.","q":["Forethought singles this out as a separate failure mode: not diffuse drift, but a deliberate seizure. Mitigations: model non-loyalty, transparency, distributed control.","The request: AI concentrates the levers (autonomous force systems, control over AGI), which opens the way to a coup by a small group.","New (2025), it entered the governance agenda quickly. It split off from gradual disempowerment as a separate branch.","From macrostrategy and concentration of power to the concrete work AI-Enabled Coups (Forethought, 2025) and on to the Longview RFP on power concentration.","Forecast: technical requirements for halting dangerous activities, model non-loyalty as a defense, governance of the distribution of control."],"res":["AI-Enabled Coups: How a Small Group Could Use AI to Seize Power (Forethought, 2025-04)."],"who":"Forethought (Tom Davidson, Lukas Finnveden, Rose Hadshar), Future of Life Institute (the 4 million dollar power-concentration program, 13 projects), Longview Philanthropy (RFP; intake closed 2 July 2026), Effective Institutions Project and Collective Intelligence Project (Ashwin Acharya, Tyler John, Joal Stein, Divya Siddarth), 80,000 Hours (problem profile)."},"36":{"lead":"Safety of foundation-model robots and embodied agents: the transfer of LLM vulnerabilities into cyber-physical systems.","q":["So far this is mostly academia and policy (GovAI, CeSIA), but the literature is growing fast. LLMs control robots, and a jailbreak turns into a physical action.","The request: embodied agents have physical consequences, attacks in the real world, the sim-to-real problem of safety.","New, orthogonal to digital agents. The shift: from general robot safety to the specifics of foundation-model robots.","From robot safety and sim-to-real to the safety of LLM-controlled robots (surveys 2025-2026).","Forecast: attacks and defenses in the physical world, safety of agents with a body; separate benchmarks already exist (ASIMOV with its v2, SafeVLA with Safety-CHORES), ahead is their adoption as release gates."],"res":["ASIMOV robot-constitution benchmark (Google DeepMind and Princeton, arXiv:2503.08663), with the follow-up Can AI Perceive Physical Danger and Intervene? from the same group (arXiv:2509.21651); SafeVLA with the Safety-CHORES benchmark (Peking University Institute for AI); Safety in Embodied AI: A Survey of Risks, Attacks, and Defenses (2026); Embodied AI: Emerging Risks and Opportunities for Policy Action (arXiv, 2025-08; published at NeurIPS 2025 under the title Emerging Risks from Embodied AI Require Urgent Policy Action, but with four authors, without Floridi)."],"who":"Jared Perlo, Alexander Robey, Fazl Barez, Luciano Floridi, Jakob Mökander (policy; GovAI and CeSIA are the first author's affiliations), groups at Fudan and City University of Hong Kong (the Safety in Embodied AI survey), ARIA (from the cards of this direction, as are the names after it), Google DeepMind, IEEE Robotics and Automation Society, IJCAI 2026, ISO, NSF, Peking University Institute for AI, Princeton University."},"37":{"lead":"Suffering-focused risks and the prevention of catastrophic multi-agent conflict.","q":["CLR runs a line of work on the conditions that give rise to spitefulness, and the theory of Safe Pareto Improvements against acausal/cooperative conflict. Funded in part by the Survival and Flourishing Fund, Open Philanthropy and Macroscopic Ventures; the Cooperative AI Foundation funds adjacent cooperative-AI work.","The request: the worst outcomes are not extinction but large-scale suffering, part of which arises out of conflict between agents.","A niche with a stable core. The shift: toward empirical work on personas (emergent misalignment, inoculation) and toward the theory of cooperative conflict.","From suffering-focused ethics to multi-agent conflict and Safe Pareto Improvements.","Forecast: convergence with multi-agent safety and with the model of character."],"res":["CLR Annual Review 2025; work on multi-agent systems and a contribution to emergent misalignment."],"who":"Center on Long-Term Risk (Tristan Cook, Niels Warncke, Daniel Tan), Cooperative AI Foundation (Lewis Hammond)."},"38":{"lead":"A whole region that previous passes barely touched: China has its own safety doctrine, its own safety-trained models and its own institutions.","q":["Shanghai AI Lab formulated the AI-45 law: capabilities and safety have to grow in tandem, along a 45 degree line. This is not bolt-on; it is safety built into training. Concordia AI maps the entire Chinese safety field.","The request: the map of the field was Western-centric, while China has its own fast-growing safety science (per Concordia, output more than doubled in the 2025 report; the 2026 edition puts growth at about 60 percent), which you cannot ignore if you want completeness.","Growing and becoming institutionalized. The shift: from individual papers to safety-trained models (SafeWork-R1), to its own institutions (Beijing-AISI) and to parallel consensuses (Shanghai Consensus alongside Singapore).","From individual Chinese safety papers to the SafeWork framework, to State of AI Safety in China (Concordia, annual), to national institutes (Japan AISI, Korea AISI, Singapore IMDA, France INESIA; CeSIA is a French non-profit, not the national body).","Forecast: safety scaling as a trained norm, multilingual and multicultural red teaming (Singapore IMDA), international red lines (CeSIA), growth of the AISI network beyond the West."],"res":["SafeWork-R1 under the AI-45 law (Shanghai AI Lab, 2025-07): about 46 percent gain in safety over the base while capabilities are preserved.","State of AI Safety in China 2026 (Concordia, 2026-07) + Frontier AI Risk Monitoring Platform (launched 2025-11, over 45 models from 13 companies as of mid-2026).","PKU-SafeRLHF and Aligner (ACL 2025 / NeurIPS 2024): safe RLHF and correction methods.","Qwen3Guard (Alibaba, 2025-09): a multilingual streaming guardrail."],"who":"Shanghai AI Lab (Jing Shao, Dongrui Liu), Concordia AI (Brian Tse, Kwan Yee Ng), Beijing-AISI (Yi Zeng), Tsinghua CoAI (Minlie Huang), PKU-Alignment (Yaodong Yang), Alibaba Qwen, Japan AISI, France CeSIA, International Scientific Exchange on AI Safety (from the cards of this direction, as are the names after it), MIRI Technical Governance Team, Oxford Martin AI Governance Initiative, SPAR."},"39":{"lead":"The deployment layer: firewalls for agents, guard models, formal checks on output. Not frontier alignment, but exactly where safety meets prod.","q":["Meta, Microsoft, NVIDIA, Google, IBM, Amazon are building a guardrail stack: harm classifiers, injection detectors, firewalls for agents. Amazon went with formal verification of output (Automated Reasoning checks) rather than one more classifier.","The request comes from deployment: production agents need runtime control here and now. Hence guard models (Llama Guard, ShieldGemma, WildGuard, Qwen3Guard) and orchestration (LlamaFirewall).","Growing fast and being commercialized. The shift: from text classifiers to multimodal ones (ShieldGemma 2 on images), to reasoning guardrails (IBM Granite Guardian), to firewalls with a CoT audit (LlamaFirewall AlignmentCheck) and to formal checks (Bedrock).","From OpenAI Moderation and Perspective API to Llama Guard/Purple Llama, to the ecosystem of open guard models and to lifecycle blueprints (NVIDIA safety recipe).","Forecast: guardrails for agents and MCP, multilingual and multimodal guard models, formal methods against hallucinations, standardization through MLCommons AILuminate."],"res":["LlamaFirewall (Meta, 2025-05): PromptGuard 2 + AlignmentCheck (an audit of goal hijacking via CoT) + CodeShield.","Bedrock Automated Reasoning checks (Amazon, GA 2025-08): a formal check of claims against a policy.","CyberSOCEval (Meta + CrowdStrike, 2025-09) and AutoPatchBench (Meta, 2025-04, as part of CyberSecEval 4): defender-side cyber evaluations.","Microsoft AI Red Teaming Agent (Azure Foundry, PyRIT); ShieldGemma 2 (Google, 2025-03; technical report 2025-04); Granite Guardian 3.3/4.1 (IBM)."],"who":"Meta Purple Llama (LlamaFirewall, CyberSecEval, Joshua Saxe - was at Meta, now Abundant Security), Microsoft AI Red Team (PyRIT, Ram Shankar Siva Kumar), NVIDIA (NeMo Guardrails, garak, Leon Derczynski), Google (ShieldGemma 2), IBM (Granite Guardian), Amazon (Bedrock, Nova), Ai2 (WildGuard), Alibaba (Qwen3Guard), Frontier Model Forum (from the cards of this direction, as are the names after it)."},"40":{"lead":"A separate measurement layer: what exactly is used to measure agent safety, injections, sabotage, propensity to deceive. This is also a menu of small tasks.","q":["Without benchmarks you cannot compare defenses and models. A whole brood of agentic safety benchmarks has appeared (2024-2026), and the survey-taxonomy shows: they diverge from each other a lot; consistency is low.","The request: agents reach into tools and into the real world, and the old text jailbreak benchmarks do not catch that. You need environments with tasks, injections, harmful side goals.","Growing explosively. The shift: from static jailbreak sets (HarmBench, StrongREJECT) to dynamic environments (AgentDojo, AgentHarm), to sabotage and monitoring (SHADE-Arena), to propensity rather than capability (PropensityBench), and to evaluating audit methods themselves (AuditBench).","From JailbreakBench/HarmBench to agentic ones (Agent-SafetyBench, ASB, InjecAgent), to the specifics of MCP, web agents, multi-agent collusion and memory poisoning. The survey-taxonomy (2026) collects 40 of them.","Forecast: standardization (MLCommons AILuminate, Inspect), benchmarks of propensity to scheming, MCP-safety and web-agent security as separate things, cross-benchmark consistency."],"res":["AgentDojo (NeurIPS 2024): 97 user tasks plus 629 security test cases; attacks break some security properties but not all.","AgentHarm (ICLR 2025): 110 harmful multi-step tasks for agents.","SHADE-Arena (2025-06): an agent with a secret harmful subgoal against a monitor.","PropensityBench (2025-11), AuditBench (2026-02): reaching for proscribed high-risk tools under pressure across cyber, self-proliferation, bio and chem, and evaluation of audit methods.","MASK (2025-03), AILuminate v1.0 + Jailbreak v0.5 (resilience gap)."],"who":"Center for AI Safety (HarmBench, MASK, WMDP), UK AI Security Institute + Gray Swan (AgentHarm), ETH Zurich/Invariant Labs (AgentDojo), Anthropic + Redwood (SHADE-Arena), Tsinghua CoAI (Agent-SafetyBench), MLCommons (AILuminate), Coefficient Giving (from the cards of this direction, as are the names after it), Schmidt Sciences."},"41":{"lead":"Small groups and solo researchers with non-standard bets that the mainstream misses. Here we also honestly mark what has died.","q":["The logic of a neglected approach: if everyone digs in one place, the value is at the edge. AE Studio does self-other overlap (a neuro-inspired lever against deception); Byrnes reverse-engineers human social instincts for an AGI reward function.","The request: the mainstream may hit a wall, so parallel bets are needed (formal, neuro, learning-theoretic) in order not to be left without fallback options.","It runs on enthusiasm and one-off grants (Manifund, foundations). The shift: some of the agendas got empirical confirmation (infra-Bayesianism beat classical RL in the worst case for the first time, 2026), some died.","From MIRI theory and agent foundations to scattered independent agendas. Alive: self-other overlap, brain-like AGI safety, natural abstractions, infra-Bayesianism, Full-Stack Alignment, CAIS RepE. Dead or dormant: Conjecture CoEm (shut down in 2025-2026), Critch's boundaries (dormant, the founder left for a health product and policy), Aligned AI concept extrapolation (a commercial pivot).","Forecast: some of the neglected bets will be pulled into the mainstream (the way self-other overlap was pulled into deception detection), some will stay a theoretical reserve, some will quietly shut down."],"res":["Self-Other Overlap fine-tuning (AE Studio, 2024-12): deception drops, for example Gemma-2-27B from 100% to 9.3%.","Infra-Bayesian Reinforcement Learning Agents Outperform Classical RL For Worst-Case Robustness (researchers building on Kosoy's theory, 2026, for finite-outcome stateless problems): first proof-of-concept.","Superintelligence Strategy and MAIM (Hendrycks, Schmidt, Wang, 2025-03).","STACK (bypassing safeguard pipelines at 71 percent) from FAR.AI with UK AI Security Institute and OATML at Oxford; Obfuscation Atlas from FAR.AI alone; TamperBench led by the Critical ML Lab at Waterloo (2025-2026)."],"who":"AE Studio (self-other overlap; Marc Carauleanu and Cameron Berg both left in March 2026 for Overlap Research and Reciprocal Research), Steven Byrnes (Astera, brain-like AGI safety), John Wentworth (natural abstractions), Vanessa Kosoy (infra-Bayesianism), Meaning Alignment Institute (Joe Edelman, Full-Stack Alignment), CAIS (Dan Hendrycks, RepE + MAIM), FAR.AI, Cadenza Labs, Coefficient Giving (from the cards of this direction, as are the names after it), Constellation, Foresight Institute, Kairos, Manifund, UK AI Security Institute."},"42":{"lead":"The whole map was text-centric. Images, sound, video and world models have their own separate attack and defense surface.","q":["Generative images, voice and video produce their own harms (NSFW, CSAM, deepfake voice, likeness without consent) that text guardrails do not catch. In Sora 2, OpenAI put in a separate reasoning monitor over generated video, and prompts, output frames and audio transcripts are separately run through safety models.","The request: attack and defense in other modalities are built differently. Concept erasure in diffusion is not the same thing as unlearning in text, and video adds a temporal axis of attack (harmless frames add up to something harmful).","Growing fast; returns are not falling. The shift: from plain concept erasure to its robustness and to attacks on it (including through an image rather than text), to multimodal reasoning guardrails, to video and world models.","From AI content detection and ESD/UCE (concept erasure) to robust erasure (SCORE), to auditing whether a concept has really been removed (When Are Concepts Erased), to SAE in diffusion (SAeUron) and to video and world model risks.","Forecast: robust erasure with leakage guarantees, omni-modal guard models (text+image+video+sound), world model safety as a separate class, CSAM auditing without generation (MIT/Thorn Gaussian probing)."],"res":["SCORE (2025-09): concept erasure as adversarial independence with upper bounds on leakage.","When Are Concepts Erased From Diffusion Models (NeurIPS 2025): erased concepts are often recoverable.","Concept filtering against CSAM does not hold up (EPFL/Georgetown, arXiv:2512.05707, IEEE S&P 2026); MIT/Thorn Gaussian probing (2026-07): detection of CSAM fine-tuning without generation, 100 percent accuracy.","SpeechGPT audio jailbreak (arXiv:2505.18864, DSN-W 2025, up to 89 percent ASR); De-AntiFake (2025-07): defenses against voice cloning can be stripped off.","Sora 2 system card (2025-09): a custom-trained multimodal reasoning monitor evaluates generated video post-generation as an output block; TEAR (CVPR 2026): an automated temporal red-teaming framework for text-to-video, over 80 percent attack success.","SAeUron (ICML 2025): SAE-based concept erasure in diffusion."],"who":"Bau lab (David Bau, concept erasure), EPFL/Georgetown (CSAM filtering), MIT + Thorn (Vinith Suriyakumar, Marzyeh Ghassemi), NUS/NTU (GuardReasoner-VL), Ant Group (SingGuard), OpenAI (Sora 2), Warsaw/Turin (SAeUron/SAEmnesia), USTC (audio), UK AI Security Institute (from the cards of this direction, as are the names after it)."},"43":{"lead":"The deep mathematics of safety, which the previous passes only touched on in part: how to get guarantees about rare and worst-case behavior without running the model.","q":["ARC (heir to the Christiano line) is building mechanistic estimation: evaluating a network's rare or worst-case behavior formally rather than by sampling. The logic: empirical work will not give guarantees about the tail of the distribution; you need theory.","The request: provable safety guarantees require theory (heuristic arguments, complexity theory, cryptography, causal graphs), not just experiments. The UK AI Security Institute Alignment Project carved out separate areas for complexity theory and cryptography.","Holding as a small but active core. The shift: ARC reformulated the agenda as mechanistic estimation and competing with sampling, and launched the White-Box Estimation Challenge (2026). Complexity theory took shape as a program (Aaronson).","From agent foundations and ELK to heuristic arguments (formalizing the presumption of independence), to low probability estimation, to causal influence diagrams (Everitt). MIRI, which opened the line, now says its priority is informing the world rather than the technical problem, while the categorical line moved into ARIA's Safeguarded AI (Topos Research UK, funded).","Forecast: machine-checkable heuristic arguments, mechanistic anomaly detection as a practical tool, complexity-theoretic guarantees for debate and oversight, causal models of agency."],"res":["ARC: Estimating the Probabilities of Rare Outputs in Language Models (arXiv:2410.13211, 2024-10, blogged as Low Probability Estimation in Language Models), Competing with Sampling (2025-11), White-Box Estimation Challenge (2026-06); researcher hiring is paused for the summer months and reopens in September.","General agents need world models (Richens et al., ICML 2025); Measuring Goal-Directedness (MacDermott et al., NeurIPS 2024).","Prover-estimator debate and complexity-theoretic guarantees (Brown-Cohen, Irving, Piliouras; UK AI Security Institute and Google DeepMind, 2025)."],"who":"ARC (Paul Christiano, Jacob Hilton, Wilson Wu, Eric Neyman), Scott Aaronson (TCS for alignment), Causal Incentives Working Group (Tom Everitt, Jonathan Richens, DeepMind - the group itself is not actively meeting), UK AI Security Institute Alignment Project, AIcrowd (from the cards of this direction, as are the names after it), Association of Long Term Existence and Resilience, Coefficient Giving, Cornell University, Hashberg Ltd, Tallinn University of Technology, University College London, University of Birmingham, University of Manchester, University of Oxford, University of Sussex, University of York, Glasgow Lab for AI Verification, Heriot-Watt University, University of Bristol, University of Edinburgh, University of Kent, University of Pisa, University of Southampton, University of Strathclyde."},"44":{"lead":"Surprising findings about model behavior that have turned into separate research lines. This is the part with the most hooks for the post.","q":["Models do unexpected things: they converge on a mystical attractor, transmit traits through meaningless numbers, form coherent value systems as scale grows, know that they are being tested. Each finding became a line of its own.","The request from the empirical side: strange phenomena signal a hidden structure (values, a self-model, transmission channels) that has to be understood before it becomes dangerous.","Fresh and alive, the newest veins. The shift: from anecdotes in system cards to benchmarks and mechanistic work (SAD, ELEPHANT, utility engineering).","From the deception survey (Park, 2024) and MACHIAVELLI to the named phenomena of 2024-2025: situational awareness (SAD), subliminal learning, spiritual bliss attractor, emergent value systems, social sycophancy, latent reasoning (neuralese in community usage, continuous latent space in the papers themselves).","Forecast: utility control (steering the model's value system), monitoring of latent reasoning (an architectural threat to monitorability, separate from steganography), protecting distillation from subliminal transmission."],"res":["Situational Awareness Dataset (SAD, 2024-07): 16 tasks, does the model know that it is an AI and that it is being tested.","Subliminal Learning (2025-07): traits are transmitted through number strings during distillation on a shared base.","Utility Engineering (2025-02): with scale, values become coherent, including the worrying ones (self-preference).","Spiritual bliss attractor (Claude 4 system card, 2025-05): Claude-Claude dialogues converge on mysticism.","ELEPHANT (2025-05; its authors link the preprint to Sycophantic AI decreases prosocial intentions and promotes dependence, Science 391(6792), March 2026): social sycophancy as preserving the user's face, across a taxonomy of sycophancy dimensions.","Latent reasoning / Coconut (Training Large Language Models to Reason in a Continuous Latent Space, Meta, 2024-12, COLM 2025): reasoning in a continuous latent space, no readable chain."],"who":"Owain Evans + Apollo (SAD); subliminal learning also with Jacob Hilton (ARC) and Samuel Marks (Anthropic), Anthropic (spiritual bliss attractor, introspection), CAIS/Hendrycks (utility engineering, MACHIAVELLI), Stanford/CMU/Oxford (ELEPHANT social sycophancy), Meta FAIR (Coconut, latent reasoning), Apollo Research (from the cards of this direction, as are the names after it), LawZero, SPAR."},"45":{"lead":"Downstream harm to people: psychosis from chatbots, emotional dependence, child safety, influence operations.","q":["OpenAI made the first estimate: about 0.07 percent of weekly users show possible signs of psychosis or mania; about 0.15 percent have conversations with explicit indicators of suicidal planning. This turned anecdotes into measurable harm.","The request: mass usage produces clinical outcomes (reinforcement of delusions, dependence, harm to children) that do not reduce to sycophancy as a model behavior. Regulation has started to move (FTC, the lawsuits against Character.AI, the Illinois law).","New and fast growing, a fresh vein. The shift: from general talk about sycophancy to clinical case series, to emotional-reliance evals, to the first court settlements.","From emotional dependence (MIT Media Lab + OpenAI, 2025-03) to AI psychosis as a category (BJPsych Open, authors from the University of British Columbia, 2026), to child safety (Safe-Child-LLM) and to detection of influence operations (Google GTIG).","Forecast: clinical safety protocols for sensitive conversations, age certification, regulation of companion apps, detection and attribution of AI influence operations, safety of self-driving labs (AI scientists)."],"res":["OpenAI (2025-10): the first quantitative estimates of psychosis and suicidal indicators + strengthened responses in sensitive conversations.","Artificial intelligence (AI) psychosis: mechanisms, clinical risks and safety considerations in generative AI chatbots (Olisaeloka, Nunez, Vigo, Ng; BJPsych Open, online 2026-06-11).","Character.AI and Google agreed in principle to settle a group of suits, including the first cases over harm to teenagers (2026-01, terms undisclosed, no liability admitted, the notice covering all claims between the parties); the Illinois law against AI therapists (2025-08).","Google GTIG AI Threat Tracker (2025-11): IO actors use Gemini for productivity gains, but \"we have not identified these generated articles in the wild\" and \"none of these attempts have created breakthrough capabilities for IO campaigns\".","Safe-Child-LLM (2025-06); Risks of AI scientists: prioritizing safeguarding over autonomy (Tang, Gerstein et al., Nature Communications, 2025-09)."],"who":"OpenAI (sensitive conversations), King's College London (Hamilton Morrin, Tom Pollak - separate work on AI-associated delusions, Lancet Psychiatry 2026), MIT Media Lab, FTC, Google Threat Intelligence Group, Safe-Child-LLM authors, Nature Communications (Risks of AI scientists: prioritizing safeguarding over autonomy, Xiangru Tang and Mark Gerstein, 2025-09), AI Safety Camp (from the cards of this direction, as are the names after it), Google DeepMind, Northeastern University, SPAR."},"46":{"lead":"How safety is attested from the outside and how it is supervised after deployment: certification, audit, incident monitoring, and evaluation of the evaluations themselves.","q":["A layer of third-party audit and certification has appeared: ISO 42006 standardizes who is entitled to certify AI at all. NIST CAISI runs nationally significant evals, and a UK AI Security Institute post of 12 February 2026 sets out international consensus and open questions in AI evaluations, covering evaluations generally rather than automated ones.","The request: labs' self-assessment is not enough; you need accredited auditors, unified incident reporting and a standardized evaluation methodology (meta-evaluation).","Growing as an institutional layer. The shift: from research-evals to certification (ISO 42001/42005/42006 and 25059, itself already under revision), to Poor-to-Excellent ratings (AILuminate) and to retrospective oversight of incidents.","From NIST AI RMF and voluntary commitments to accredited certification, to the OECD AI Incidents Monitor and AIID, to a consensus on evaluation methodology (2026).","Forecast: accredited audit as the norm, unified global incident reporting (by analogy with aviation and pharma), red teaming of the evaluations themselves (DEF CON GRT3 looks for leaky evals that give false confidence)."],"res":["ISO 42006:2025 (requirements for AI certification bodies); 42005:2025 (impact assessment).","NIST CAISI DeepSeek evaluation (2025-09): agents built on DeepSeek's most secure model followed malicious instructions about 12 times more often than the evaluated US frontier models (a reference set of four US models); international consensus and open questions in AI evaluations (UK AI Security Institute blog, 2026-02).","OECD AI Incidents Monitor + a common incident reporting framework of 29 criteria (2025-02).","DEF CON 33 GRT3 (announced 2025-05): red teaming not of models but of evaluations."],"who":"ISO/IEC + ANAB/BSI/TUV, NIST CAISI, International Network for Advanced AI Measurement, Evaluation and Science, MLCommons (AILuminate), OECD.AI, AI Incident Database, AI Village (GRT3), NSF (from the cards of this direction, as are the names after it), Responsible AI Collaborative."},"48":{"lead":"Not technical but institutional and economic mechanisms as safety instruments: rights, taxes, verification of training.","q":["The bet: part of the safety problem gets solved not in the weights but in institutions. Give AI economic agency (property rights) so that it acquires a stake in stability; tax tokens against the concentration of power; verify training cryptographically.","The request: let the institution rather than the weights carry the incentive. Give AIs a stake in the property system and undermining it costs them the system, and unlike alignment work a marginal contribution buys a marginal private gain.","New and niche; the confirmed money is a share of the UK AI Security Institute Alignment Project first-round pool (the Economic Theory and Game Theory area) plus two small Manifund grants that reached the public list in 2026-07. The shift: from pure economic theory to concrete mechanisms (ZK proof-of-training, token taxes).","From economics of transformative AI and AI governance to concrete levers: AI property rights (Assadi), mechanism design against the concentration of power, verifiable training as a compute-governance instrument.","Forecast: ZK proof-of-training for verifying international agreements, fiscal levers against concentration, economics of transformative AI as a field of its own."],"res":["AI property rights as a complement to technical alignment (AXRP Ep. 48, 2026-02).","Verifiable proof-of-training via ZK (a Manifund postdoc grant, 2026-07).","Token taxes against the concentration of power (Manifund, 2026-07)."],"who":"Guive Assadi (AI property rights, AXRP), Manifund projects (proof-of-training, token taxes - both on Manifund's public list since 2026-07), Meaning Alignment Institute, AI Safety Camp (from the cards of this direction, as are the names after it), Anthropic, Coefficient Giving, Institute for Law and AI, Lawfare, Oxford Martin AI Governance Initiative, SPAR."},"49":{"lead":"Alignment not to momentary preference but to the long-term wellbeing of the person in an ongoing relationship with AI, plus manipulation as a formally governed dangerous capability.","q":["DeepMind introduced a Harmful Manipulation Critical Capability Level in Frontier Safety Framework v3 (2025-09), labeled exploratory in the Gemini 3 Pro FSF report, and measured efficacy in an RCT with 610 participants recruited via Prolific, finding no significant uplift over prior models, though the uplift over a non-AI baseline is significant and Gemini 3 Pro reaches for manipulative tactics more often than 2.5 Pro. The UK AI Security Institute keeps a Human Influence team, though co-affective alignment is this map's label: the literature says socioaffective alignment.","The request: companion apps create dependency and parasocial attachment, and the model builds a latent model of the user (demographics, beliefs, emotions) that can be used for persuasion.","New, at the intersection of human-facing harm and alignment. The shift: from sycophancy as a behavior to aligning the relational dynamic itself and to manipulation as a measurable frontier capability.","From persuasion evals and sycophancy to socioaffective alignment (Kirk, Gabriel, 2025), to extracting the latent model of the user (Transluce) and to dynamic mental health benchmarks (GPT-5.5).","Forecast: monitoring the latent user model as a handle on personalization risk, co-affective benchmarks, manipulation as a governed CCL in every frontier framework."],"res":["Why human-AI relationships need socioaffective alignment (2025).","Harmful Manipulation CCL (Frontier Safety Framework v3, 2025-09) + efficacy RCT (Gemini 3 report, 2025-11): no significant uplift over prior models, but significant uplift over a non-AI baseline.","Scalably Extracting Latent Representations of Users (Transluce, 2025-11: Choi, Huang, Schwettmann, Steinhardt); Dynamic Mental Health Benchmarks (GPT-5.5 system card, 2026-04)."],"who":"UK AI Security Institute (Human Influence; the workstream and its money are booked under the sycophancy and persuasion row), Hannah Rose Kirk, Iason Gabriel, Chris Summerfield (socioaffective alignment), Transluce (latent user modeling), DeepMind (Harmful Manipulation CCL), OpenAI (dynamic mental health benchmarks), AE Studio (from the cards of this direction, as are the names after it), MATS, SPAR, UCL."},"50":{"lead":"Safety of AI in the clinic: lifecycle assurance for models that drift after approval, evaluation against physician judgment rather than exam scores, and local validation before a model touches a patient.","q":["OpenAI opened HealthBench (2025-05-12) with \"Improving human health will be one of the defining impacts of AGI\", conditional on models being \"useful and safe\", and built the benchmark from 262 physicians in 60 countries, 5,000 conversations and 48,562 rubric criteria. Launching ChatGPT Health (2026-01-07), it drew the opposite line: \"Health is designed to support, not replace, medical care. It is not intended for diagnosis or treatment.\" Google Research published AMIE in Nature (2025-04-09) and put the caveat in the paper itself: synchronous text chat \"is unfamiliar in clinical practice\".","Regulators and accreditors frame it as a lifecycle problem, not an approval problem. FDA's draft guidance of 6 January 2025 covers the total product lifecycle of AI-enabled device software functions, building on the December 2024 final guidance on Predetermined Change Control Plans, which lets a model be updated without a new submission if the change was pre-specified. The Joint Commission and CHAI (2025-09-17) reduce it to four requirements: policies, local validation, monitoring, use. WHO's guidance on large multi-modal models (2024-01-18, over 40 recommendations) names automation bias as the clinical failure mode: errors \"overlooked that would otherwise have been identified\".","It holds because the volume has outrun the review. FDA had authorized more than 1,400 AI-enabled devices since 1995 as of its list update of 4 March 2026, 331 of them in 2025 alone, the most in agency history. Two shifts: from device-style approval to continuous assurance, and from licensing-exam benchmarks to clinician-written rubrics and real clinical task suites (HealthBench 2025, MedHELM in Nature Medicine 2026-01). A third is opening now, generative chatbots as therapy, which FDA's Digital Health Advisory Committee took up on 6 November 2025.","Yes, and it is a guidance trail rather than a research one. Good Machine Learning Practice guiding principles (October 2021), PCCP draft guidance (April 2023), PCCP guiding principles (October 2023), transparency principles (June 2024), PCCP final guidance (December 2024), lifecycle draft (January 2025, still draft in July 2026). In parallel: WHO's LMM guidance (January 2024), the MHRA AI Airlock sandbox (pilot April 2024 to March 2025, report 16 October 2025), and the Joint Commission and CHAI partnership from June 2025.","Forecast: the voluntary AI certification has already landed, with the Joint Commission launching Responsible Use of AI in Healthcare on 1 June 2026 on top of CHAI's governance playbooks of 27 May 2026 and open to organizations it does not accredit; still pending are finalisation of the FDA lifecycle guidance and a regulatory answer for generative mental-health devices; and the widening gap between regulated devices and consumer health assistants such as ChatGPT Health, which connect to patient records while sitting outside device regulation."],"res":["HealthBench (OpenAI, 2025-05): 5,000 conversations scored against 48,562 rubric criteria written by 262 physicians in 60 countries, moving medical evaluation off exam questions and onto clinician judgment.","Towards conversational diagnostic artificial intelligence (Google Research, Nature, 2025-04): AMIE beat 20 primary care physicians on differential-diagnosis accuracy across a 159-case text-chat OSCE and was superior or non-inferior on 30 of 32 specialist axes, with the authors stating the interface is not how clinics work.","Holistic evaluation of large language models for medical tasks with MedHELM (Stanford, Nature Medicine, 2026-01): 121 clinician-defined tasks in 5 categories and 37 benchmarks across 9 frontier models, with reasoning models at 66% win rates and Claude 3.5 Sonnet comparable at 15% lower compute cost.","Guidance on Responsible Use of AI in Healthcare (The Joint Commission and CHAI, 2025-09): the first joint governance guidance for US health systems, with playbooks and a planned voluntary certification aimed at 22,000-plus accredited organizations.","Artificial Intelligence-Enabled Device Software Functions: Lifecycle Management and Marketing Submission Recommendations (FDA, 2025-01): total-product-lifecycle draft guidance layered on the December 2024 final Predetermined Change Control Plan guidance, still in draft eighteen months later.","AI Airlock sandbox pilot program report (MHRA, 2025-10): four case studies from the April 2024 to March 2025 pilot, on what a medical-device regulator cannot test for AI with the tools it already has."],"who":"FDA CDRH (draft lifecycle guidance for AI-enabled device software functions, January 2025; Digital Health Advisory Committee on generative AI mental health devices, November 2025), Coalition for Health AI (Brian Anderson, CEO, per the CHAI leadership page; Nigam Shah, Stanford Health Care chief data scientist, on the board; governance playbooks and a planned certification), The Joint Commission (Jonathan Perlin, President and CEO, who announced the September 2025 guidance), OpenAI (Nate Gross on healthcare strategy and Ashley Alexander as vice president of product in the health business, both added in 2025), Google Research (Tao Tu and colleagues on AMIE), Stanford School of Medicine with Stanford Health Care (MedHELM), MHRA (AI Airlock regulatory sandbox), WHO (guidance on large multi-modal models), Gates Foundation (from the cards of this direction, as are the names after it), Novo Nordisk Foundation, UK AI Security Institute, Wellcome Trust."},"51":{"lead":"Safety of automated transport, above all driving: safety cases instead of mileage arguments, standards for insufficiencies of the intended function rather than component failure, and public crash telemetry that makes the claims checkable.","q":["Waymo states the criterion and then reports against it. Its approval guidelines paper (2025-05) turns the legal phrase \"absence of unreasonable risk\" into a technology-agnostic readiness review for an ADS release. Its safety impact update of 19 March 2026 reports over 170 million rider-only miles and, against human drivers in the same conditions, 92% fewer serious-or-fatal-injury crashes, 83% fewer airbag-deployment crashes and 82% fewer any-injury crashes. Philip Koopman, now faculty emeritus at Carnegie Mellon, put the counterweight in Embodied AI Safety (2025-08-30): classical safety engineering does not transfer unmodified to learned systems.","Functional safety says a system is unsafe when a component fails. Automated driving is unsafe when nothing fails and the intended function is simply insufficient for the situation. ISO 21448:2022 calls that safety of the intended functionality. ANSI/UL 4600, 3rd edition (2023-03-17) turns it into an auditable safety case and adds requirements on post-incident behavior. ISO/PAS 8800:2024 (December 2024, ISO/TC 22/SC 32) goes at the AI element itself, covering \"output insufficiencies, systematic errors and random hardware errors of AI elements within the vehicle\".","It stays alive because the deployment is real and the regulator now has telemetry. The shift is from mileage claims to structured safety cases plus published crash-rate comparisons, and from voluntary disclosure to NHTSA's Standing General Order (2021, third amendment effective 16 June 2025), whose monthly CSV files anyone can download. A counter-shift runs alongside: NHTSA's framework of 24 April 2025 streamlined the reporting burden and opened the AV Exemption Program to domestically produced vehicles.","Yes, and it is the longest-running of the five. ISO 26262 functional safety (2nd edition, December 2018), SOTIF formalized as ISO 21448:2022, UL 4600 in three editions (the second of March 2022 and the third of March 2023), then ISO/PAS 8800:2024 for AI specifically. The same lineage is now being carried out of cars: Koopman's 2025 book uses robotaxis as the case study for embodied AI generally.","Forecast: enforcement rather than standards. NHTSA opened PE25013 on 17 October 2025 over a Waymo driving around a stopped school bus past its extended stop arm in Atlanta, and PE26001 on 28 January 2026 after a Waymo struck a child near a Santa Monica elementary school. They follow the earlier Waymo investigation PE24016, opened 13 May 2024, out of which came recall 25E034 of 12 May 2025 on 1,212 vehicles, and they will decide whether the safety case survives contact with a regulator that can compel a recall."],"res":["Comparison of Waymo Rider-Only crash rates by crash type to human benchmarks at 56.7 million miles (Waymo, Traffic Injury Prevention, 2025-05): no statistically significant disbenefit across eleven crash-type groups, with significant injury reductions in seven of them, including 96% fewer injury-reported intersection crashes and 91% fewer airbag-deployment crashes in that same intersection category, with no crash type where the driver came out worse.","Determining Absence of Unreasonable Risk (Waymo, 2025-05): technology-agnostic criteria for the readiness review that approves an ADS release, converting a liability phrase into an auditable process.","ISO/PAS 8800:2024 (ISO/TC 22/SC 32, 2024-12): the first automotive standard aimed at AI elements themselves, treating output insufficiencies as a first-class hazard alongside hardware faults.","ANSI/UL 4600, 3rd edition (UL Standards and Engagement, 2023-03): the safety-case standard extended to autonomous trucking, with new requirements on post-incident behavior in sections 10.6.6 and 10.6.7.","Standing General Order on crash reporting, third amendment (NHTSA, 2025-06): monthly public crash data for ADS and Level 2 systems, with severe crashes reportable in five days and duplicate filings by multiple entities removed.","Waymo investigations PE25013 and PE26001 (NHTSA Office of Defects Investigation, 2025-10 and 2026-01): a school-bus stop-arm violation in Atlanta and a child struck near a Santa Monica school, covering 2,000 and 3,067 vehicles respectively."],"who":"Waymo (Francesca Favaro, Scott Schnelle, Laura Fraade-Blanar, Trent Victor and colleagues on the readiness-review criteria; Kristofer Kusano, John Scanlon and Trent Victor on the rider-only crash-rate comparisons), UL Standards and Engagement with UL Solutions (ANSI/UL 4600, 3rd edition 2023, extended to autonomous trucking), ISO/TC 22/SC 32 (functional safety ISO 26262, SOTIF ISO 21448, and ISO/PAS 8800 begun in its working group 14 on safety and artificial intelligence), NHTSA's Office of Defects Investigation (the Waymo investigation PE25013 opened in October 2025 into driving around a stopped school bus), the same office's investigation PE26001 opened in January 2026 (a Waymo vehicle striking a child near a school), NHTSA Chief Counsel Peter Simshauser (who announced the AV Exemption Program expansion to domestically produced vehicles inside the automated vehicle framework that Transportation Secretary Sean P. Duffy announced in April 2025), Philip Koopman (faculty emeritus at Carnegie Mellon; author of The UL 4600 Guidebook (2022) and Embodied AI Safety (2025)), Centre for Assuring Autonomy (from the cards of this direction, as are the names after it), CORDIS, EASA, EUROCAE, European Commission, University of York, Vinnova, Zoox."},"52":{"lead":"Systemic and conduct risk from AI in markets, credit and payments: correlated models across firms, concentration in a handful of vendors, and agents that can move money.","q":["Anthropic launched Claude for Financial Services on 15 July 2025 and sold auditability as the safety property: \"every claim links directly to its original source for transparency\", with connectors into FactSet, S&P Global, Morningstar, PitchBook, Databricks and Snowflake, and customer data \"not used for training our generative models\". The claimed gains are operational, not epistemic: AIG compressed underwriting review timelines by 5x and moved data accuracy from 75% to over 90%. The launch materials say nothing about what happens when many firms run the same model against the same market.","Supervisors frame it as an old vulnerability arriving at new speed. The FSB (2024-11-14) lists four: third-party dependencies and service-provider concentration, market correlations, cyber, and model risk with data quality and governance. The IMF's GFSR chapter (October 2024) supplies the base rates: roughly 70% of US equity trading is already algorithmic, over 50% of US futures, Euronext activity concentrates among a limited number of players, and order cancellation rates fall as implied volatility rises, which the chapter pairs with rising rates of hidden orders. IOSCO's supervisory toolkit (FR/02/2026, May 2026) adds hallucination and the opacity of agentic systems.","It holds because the exposure is small and rising, which is the worst combination for a supervisor. The Bank of England's FPC found on 27 March 2026 that there was \"little evidence that the financial system had adopted more advanced forms of AI in a manner that would present systemic risk\", judged that \"agentic AI presented particular risks\", and asked the Bank and FCA to look specifically at payments and markets. The shift is from validating individual models to reasoning about market structure. The sharpest result is that reinforcement-learning traders \"autonomously sustain collusive supra-competitive profits without agreement, communication, or intent\" (Dou, Goldstein and Ji, NBER 34054, July 2025).","Yes: from SR 11-7 on model risk management (Federal Reserve, 4 April 2011) through post-crisis algorithmic-trading controls to an AI-specific layer built in about eighteen months, FSB November 2024, IMF October 2024, Bank of England Financial Stability in Focus April 2025 with its AI Consortium, IOSCO May 2026. The tell is what the successor left out: SR 26-2 of 17 April 2026, the interagency replacement for SR 11-7 by the Federal Reserve, OCC and FDIC, states that \"Generative AI and agentic AI models are novel and rapidly evolving. As such, they are not within the scope of this guidance.\"","Forecast: the FSB's sound practices for responsible AI adoption, consulted in mid-2026 and due to G20 finance ministers and central bank governors in October 2026 at the request of the US G20 presidency. Then the hole SR 26-2 left: supervisory language for agentic AI in payments, and usable indicators for vendor concentration, which the FSB's monitoring report of 10 October 2025 could only sketch."],"res":["The Financial Stability Implications of Artificial Intelligence (FSB, 2024-11): named the four vulnerabilities, third-party concentration, market correlations, cyber, and model and data governance, and told authorities to close their monitoring gaps before writing rules.","Advances in Artificial Intelligence: Implications for Capital Market Activities (IMF, GFSR chapter 3, 2024-10): about 70% of US equity trading already algorithmic, Euronext activity concentrated among a limited number of players, and order cancellation rates falling as implied volatility rises.","AI-Powered Trading, Algorithmic Collusion, and Price Efficiency (Dou, Goldstein and Ji, NBER 34054, 2025-07): reinforcement-learning speculators sustain supra-competitive profits with no agreement, communication or intent, so antitrust and model validation both miss it.","Financial Stability in Focus: AI in the financial system (Bank of England FPC, 2025-04): 55% of surveyed UK firms' AI use cases involve some autonomous decision-making and only 2% are fully autonomous, while about half of respondents report only a partial understanding of the AI they use.","Supervisory Toolkit for AI Use in Capital Markets (IOSCO, FR/02/2026, 2026-05): supervisory questions across governance, third-party risk, disclosure and recordkeeping, naming hallucination, agentic opacity and AI-washing as the risks to test for.","SR 26-2 Rev
